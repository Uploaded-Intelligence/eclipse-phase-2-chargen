  "morph_traits": {
    "Striking Looks": {
      "short": "A face that turns heads even in a setting of sculpted beauty. (Level 1: synths/uplifts. Level 2: humanoid biomorphs.)",
      "used_for": "+10 to Persuade and Provoke Tests where appearance matters. Standard on sylphs and many pleasure pods.",
      "page": 76
    },
    "Exotic Morphology": {
      "short": "Body plan substantially different from baseline humanoid (uplift, novacrab, swarmanoid, etc.).",
      "used_for": "−10 per level to Integration Tests when first sleeving this body. Does NOT apply if it's your original morph type.",
      "page": 78
    },
    "Pain Tolerance": {
      "short": "Higher threshold for pain — wounds bother you less.",
      "used_for": "Ignore 1 wound's −10 modifier per level. Max 3 wounds ignored when stacked with other pain-resistant effects. Can be Ego or Morph trait.",
      "page": 74
    },
    "Digital Speed": {
      "name": "Digital Speed",
      "short": "Infomorph trait: think and act faster in pure-digital environments.",
      "used_for": "While in pure-mesh / simulspace, gain +1 to mental action types; treat all infomorph actions as quick where physical would be complex. Drops to nil while teleoperating physical bodies.",
      "page": 67
    },
    "Enhanced Behavior": {
      "name": "Enhanced Behavior",
      "short": "Engineered or implanted behavioral/emotional modification. GM specifies the trigger behavior; PC must roll WIL ÷ 10 to resist when motivated to act on it.",
      "used_for": "Combat- or socially-conditioned morphs (Fury, Ghost). Level 1 encourages behavior (−10 to actions when withheld), Level 2 drives it (WIL Check required to resist), Level 4 compels it (SV 1d6 if suppressed). Flavors the morph's psychology and combat tactics.",
      "page": 78
    },
    "Limberness": {
      "name": "Limberness",
      "short": "Exceptionally flexible and supple — capable of graceful contortions and unusual joint positions.",
      "used_for": "Positive morph trait on Bouncer, Neo-Orangutan, Neo-Octopus. Level 1: splits and squeeze into small spaces. Level 2: double-jointed escape artist. +10 per level to escape bonds, contort, fit into cramped spaces.",
      "page": 76
    },
    "Non-Human Biochemistry": {
      "name": "Non-Human Biochemistry",
      "short": "Morph has substantial physiological and genetic differences from human baseline. Different metabolism affects medicine and drug interactions.",
      "used_for": "Negative trait on Neo-Bonobo, Neo-Neanderthal, Neo-Gorilla, Neo-Orangutan, Neo-Octopus. Level 1: −10 to Medicine Tests on this morph. Level 2: −20 to Medicine Tests. Certain drugs/toxins/procedures may not work or have different effects (GM discretion). Biomorphs only.",
      "page": 79
    },
    "Planned Obsolescence": {
      "name": "Planned Obsolescence",
      "short": "Morph designed to degrade if not maintained. Requires periodic genetic service packs or proprietary maintenance or performance will fail.",
      "used_for": "Negative trait on Basic Pod, sometimes Ruster. Needs Moderate Complexity maintenance every month. Miss a month: reduce pools by 1. At 0 pools: 1 wound per month. At 4 wounds: morph incapacitated. Gene therapy or black-market maintenance restores functionality.",
      "page": 79
    },
    "Inherent Flaws": {
      "name": "Inherent Flaws",
      "short": "Manufacturing or genetic defects baked into this morph design.",
      "used_for": "GM rolls 1d10 when sleeving; any roll of 1-2 = minor defect (random −10 on one skill while in this morph). Standard on cheap morphs (Case, Spare).",
      "page": 80
    }
  },
  "movement_types": {

      "page": 230
    },

      "short": "Legged locomotion — the default for humanoid morphs.",

      "page": 230
    },
    "Roller": {
      "short": "Wheel- or hoop-based ground motion using the morph's own body.",

      "page": 230
    },
    "Wheeled": {
      "short": "Dedicated wheels or treads, deployed as needed.",
      "used_for": "Common on arachnoid morphs and bots. Fast on flat surfaces, struggles on rough terrain.",
      "page": 230
    },
    "Thrust Vector": {
      "short": "Compressed-air or ionic jets for propulsion in microgravity or in-atmosphere hover.",

    },
    "Hopper": {

      "page": 230
    },
    "Winged": {
      "short": "Wing-based flight, capable in atmosphere.",

    },
    "Ionic": {
      "short": "High-thrust ionic drive for sustained fast travel.",

      "page": 230
    },
    "Rotor": {

      "page": 230
    }
  },
  "gear_categories": {
    "Weapons": {
      "short": "Tools designed to inflict damage. EP2 weapons split into kinetic, beam, spray, seeker, melee, and implant types.",
      "used_for": "Each weapon has a Damage Value (DV) rolled when you hit, plus traits (range, ammo, fire modes, armor piercing). Damage type determines which AV (Kinetic or Energy) reduces it.",
      "page": 202
    },
    "Kinetic Weapons": {
      "short": "Firearms, railguns, and projectile weapons. The most common ranged option.",
      "used_for": "Use Guns skill. Damage reduced by Kinetic AV. Single-Action, Burst Fire, and Full Auto modes (SA/BF/FA). Smartlinked rounds and frangible/AP variants change behavior.",
      "page": 209
    },
    "Beam Weapons": {
      "short": "Lasers, plasma, microwave, particle beams.",
      "used_for": "Use Guns skill. Damage reduced by Energy AV. Usually silent and recoilless. Many ignore some armor or have continuous-fire modes.",
      "page": 206
    },
    "Spray Weapons": {
      "short": "Flamers, chemical sprayers, freezers, and stunners that project a cone or stream.",
      "used_for": "Use Guns skill. Cover an area; harder to dodge but limited range. Variants split between Kinetic and Energy AV.",
      "page": 207
    },
    "Seeker Weapons": {
      "short": "Smart micromissiles and mini-rockets with onboard guidance.",
      "used_for": "Use Guns skill. Fire-and-forget; harder for the target to dodge. Various warheads (HEAP, plasma, EMP, smoke).",
      "page": 208
    },
    "Melee Weapons": {
      "short": "Knives, swords, clubs, axes, vibroblades, monofilament weapons.",
      "used_for": "Use Melee skill. Damage reduced by Kinetic AV. Many are concealable; some have Reach or Armor-Piercing.",
      "page": 204
    },
    "Implant Weapons": {
      "short": "Built-in weapons grown into a morph: claws, retractable blades, shock organs, beak attacks.",
      "used_for": "Always available, hard to detect, usually impossible to disarm. Use Melee (or Exotic) skill.",
      "page": 204
    },
    "Armor": {
      "short": "Worn or implanted protection. Every armor has two ratings: Kinetic AV and Energy AV, written K/E (e.g. 8/6).",
      "used_for": "When you take damage, subtract the appropriate AV (kinetic or energy) from incoming DV. Synthmorphs have built-in armor (Light Frame 6/4, Medium 8/6, Heavy 12/10). Worn armor stacks with implant armor up to a max.",
      "page": 214
    },
    "Drugs": {
      "short": "Chemical compounds for combat boosts, social leverage, healing, and recreation.",
      "used_for": "Each drug has an onset, duration, application method (oral/inhaled/injected/etc.), and effect. Many give pool boosts capped at +5. Common biomorph use; synths usually can't metabolize them.",
      "page": 330
    },
    "Nanotech": {
      "short": "Programmable nanoswarms — clouds of microscopic robots that perform a designated task.",
      "used_for": "Categories include healer/fixer, scout/spy, guardian/disabler, cleaner, smart-dust. Use Hardware: Nanotech or Interface to deploy and direct.",
      "page": 344
    },
    "Bots": {
      "short": "Autonomous drones and robots run by ALIs or controlled by a remote operator.",
      "used_for": "Range from insect-sized (speck, smart hawk) to combat-grade (guardian angel, automech). Each has its own stats and Pilot/Interface use.",
      "page": 346
    },
    "Vehicles": {
      "short": "Cars, aircraft, watercraft, spacecraft, exoskeletons.",
      "used_for": "Roll Pilot: [field] to operate. Have own armor, DUR, and weapon mounts. Some morphs (flexbots, arachnoids) are themselves vehicle-scale.",
      "page": 350
    },
    "Sensors": {
      "short": "Radar, lidar, t-ray, electrical sense, nanoscopic vision, biometric scanners.",
      "used_for": "Defeat darkness, smoke, concealment, and biometric spoofing. Often integrated as ware in morphs, also as standalone gear.",
      "page": 318
    },
    "Tools": {
      "short": "Repair kits, tool kits, fabbers, utility tools, specialist instruments.",
      "used_for": "Many tests require a tool kit (no tools = −10 to −30 modifier). Fabbers build other items from blueprints; bigger fabber, bigger item.",
      "page": 317
    },
    "Tactical": {
      "short": "Combat-support gear: TacNet apps, smartlinks, smart cuffs, smart dust, scopes, exoskeletons.",
      "used_for": "TacNet shares sensor and team data in real time. Smartlinks and scopes give modifier bonuses on attack rolls.",
      "page": 327
    },
    "Communications": {
      "short": "Ectos, radio boosters, satphones, signal jammers, anonymizers, private servers.",
      "used_for": "Provide mesh access without inserts, extend range, hide identity, or block enemy signals. The ecto is the standard exterior smartphone.",
      "page": 336
    },
    "Survival": {
      "short": "Vacsuits, breathers, pressure tents, healing sprays, survival rations, magboots.",
      "used_for": "Keep you alive in vacuum, deep ocean, hostile atmospheres, or simply on long expeditions. Many morphs already have some of this baked in.",
      "page": 341
    },
    "Stealth": {
      "short": "Chameleon cloaks, anonymizers, skinflex disguises, microbugs, signal jammers, smart dust.",
      "used_for": "Defeat detection, conceal identity, or hide presence — from sensors and from other transhumans. Big bonuses to Infiltrate.",
      "page": 338
    }
  },
  "gear_avail_cost": {
    "short": "Every gear item has two ratings written as Complexity/GP, e.g. Min/1 or Maj/R/3. Complexity = how hard to find or fabricate; GP = how much it costs from your starting Gear Points.",
    "page": 312,
    "availability": {
      "Min": "Minimal complexity — household, mass-market, common everywhere. Easy to scrounge or fab.",
      "Mod": "Moderate complexity — professional or specialist gear. Available legally in most habitats.",
      "Maj": "Major complexity — high-end, restricted, or dangerous. Often requires legitimate justification or black-market connections.",
      "Top": "Top complexity — bleeding-edge, prototype, or extremely restricted. GM-discretion to acquire."
    },
    "restricted": {
      "R": "Suffix 'R' on Complexity means the item is restricted, regulated, or illegal in many polities. Possession may attract authorities."
    },
    "gp_cost": {
      "1": "1 GP — Minor item. Most common gear at this tier.",
      "2": "2 GP — Moderate item. Specialist apps, mid-grade ware, midrange drones.",
      "3": "3 GP — Major item. Premium ware (medichines, neurachem, healing vat), heavy weapons, vehicles.",
      "note": "Characters start with a Gear Pack (campaign) + Profession Pack of preset items. Spend MP on extra gear at 1 MP per Minor / 2 MP per Moderate / 3 MP per Major item (book p46-48)."
    }
  },

  "combat": {
    "attack": {
      "short": "Roll d100 vs your skill (Guns or Melee) + modifiers. Target rolls opposed Fray (or Fray/2 against guns) or Melee to dodge/parry. Higher successful roll wins.",
      "page": 200
    },
    "damage": {
      "short": "Damage Value (DV) is the dice you roll on a hit — usually a weapon's listed DV plus any bonuses (margin of success, superior result, weapon traits). Subtract the target's relevant Armor Value, then apply to DUR.",
      "page": 219
    },
    "armor": {
      "short": "Every armor item has two values: Kinetic AV (vs bullets, kinetic, melee) and Energy AV (vs lasers, plasma, fire). Written K/E (e.g. 8/6). Subtract the AV matching the incoming damage type from DV before applying.",
      "page": 214
    },
    "wounds": {
      "short": "Any single hit dealing damage equal to or above Wound Threshold (DUR/5) inflicts 1 wound. Each wound: cumulative −10 to action tests, −1 Initiative, and forces a SOM Check or you fall. At total damage = DUR you're unconscious (biomorph) or crashed (synth); at DR you're dead/wrecked.",
      "page": 220
    },
    "trauma": {
      "short": "Any single stress hit equal to or above Trauma Threshold (LUC/5) inflicts 1 trauma. Each trauma: cumulative −10 to actions, −1 Initiative, forces a WIL Check or you're stunned. At total stress = LUC you suffer a breakdown (1d6 hours catatonic, gain a Mental Disorder); at IR your mind is permanently lost.",
      "page": 222
    },
    "initiative": {
      "short": "Initiative stat = (REF + INT) / 5. Each turn roll 1d6 + Initiative; high roll goes first. Spend 1 Vigor (any action) or 1 Insight (mental/mesh only) to act first regardless of roll.",
      "page": 226
    },
    "action_economy": {
      "short": "A 3-second action turn allows ONE of: 1 complex action + 1 quick action, OR 1 task action + 1 quick action, OR up to 3 quick actions. Plus unlimited automatic actions. Basic movement (base move) is automatic; full move uses a complex action.",
      "page": 228
    },
    "criticals": {
      "short": "Any double on the d100 (00, 11, 22, ..., 99) is a critical. Roll of 00 is always a critical success regardless of target; 99 is always a critical failure. Crits give GM-discretion bonuses or penalties beyond the standard result.",
      "page": 31
    },
    "superior_results": {
      "short": "33/66 rule: a successful roll of 33 or higher is a superior success (more damage, extra detail, etc.); 66+ is a double superior. A failure of 66 or less is a superior failure; 33 or less is a double superior failure. See tests.superior_results.",
      "page": 31
    },
    "healing": {
      "name": "Healing",
      "short": "How biomorphs, synthmorphs, and egos recover from damage, wounds, stress, and traumas. Damage and wounds heal at DIFFERENT rates — wounds are permanent until actively healed; raw damage heals faster.",
      "used_for": "Biomorph damage: 1d10/day natural rest (1d10/12h with Biomods; 1d10/hour with medichines or healing spray; 2d10/hour in a healing vat). Biomorph wounds: 1/week natural, 1/3 days with Biomods, 1/day with medichines, 1/2h in vat. First Aid (Medicine: Paramedic, 10min + 10min/wound): heals 1 wound + 1d10 damage once per injury set. Synthmorph damage: requires Hardware: Robotics test, 1h per 5 damage + 8h per wound; fixer swarms automate (1d10/hour). Stress: 1d10/hour relaxation; 1 Moxie spend = 1d10 stress recovered immediately. Trauma: 8h Medicine: Psychosurgery (split into 1h sessions). Disorder: 40h Psychosurgery. Poor conditions: healing doubled time; harsh: tripled.",
      "page": 220
    }
  },

      "negative_trait_cap": "No more than 6 MP worth of negative morph traits.",
      "flex_conversion": "Leftover MP -> Flex at 2:1, max 3 Flex. Resets on next resleeve."
    }

  "know_fields": {
    "_meta": {
      "note": "Setting context for Know skill fields. 'setting' explains what the knowledge means in EP2 universe. 'hooks' offers 2-3 roleplay angles. Page references point to the canonical book entry; page 0 means the term is named in lists but synthesized from setting chapters. Canonical Know skill list: p52-53.",
      "list_page": 52
    },
    "habitat-ops": {
      "name": "Habitat Ops",
      "setting": "Habitats are artificial space environments — torus and cylinder spin habs, asteroid hollows, aerostats in Venusian cloud, cluster modules — and habitat ops is the living infrastructure that keeps them alive: life support, air mix and recycling, hull integrity, spin balance, thermal management, environmental equilibrium. In a habitat, one fire or one decompression event can kill everyone aboard, so the people who know hab ops are the people who notice trouble first.",
      "hooks": "the engineer who smells the air mix going off before any alert fires; the systems chief who survived a hab failure and refuses to let it happen again; the maintenance veteran who knows every duct, every quirk, every system by touch.",
      "page": 53
    },
    "hab-ops": {
      "name": "Hab Ops",
      "setting": "Short for Habitat Ops — same knowledge, same field. Life support, air, recycling, spin, hull, thermals. The discipline that keeps your station from killing everyone aboard.",
      "hooks": "the engineer who smells the air mix going off before any alert fires; the systems chief who survived a hab failure and refuses to let it happen again; the maintenance veteran who knows every duct, every quirk, every system by touch.",
      "page": 53
    },
    "flight-crew-ops": {
      "name": "Flight Crew Ops",
      "setting": "The professional knowledge of running a spacecraft as crew, not just piloting it: cargo handling, passenger procedures, docking protocols, customs and inspection routines, fuel and life support logistics, comms discipline, microgravity safety drills. Anyone who has worked the lanes between habs knows this work intimately.",
      "hooks": "the long-haul crewer who has seen every kind of customs scam; the steward who can defuse a passenger panic in microgravity; the bosun who reads a ship's mood the way others read a room.",
      "page": 53
    },
    "gatecrashing": {
      "name": "Gatecrashing",
      "setting": "Pandora gates are alien wormholes — five known to transhumanity — that connect the Solar System to exoplanets across the galaxy. Gatecrashing is the profession (and lifestyle) of going through them: first-in protocols, gear loads for unknown environments, gate-time logistics, return-window discipline, hostile xenoecology, anomaly identification. Often lethal, occasionally world-changing.",
      "hooks": "the veteran of a first-in op that went wrong on the far side; the xenosurveyor who has walked more exoplanets than habitats; the contract gatecrasher between expeditions, restless and bored on the wrong side of the wormhole.",
      "page": 115
    },
    "terraforming": {
      "name": "Terraforming",
      "setting": "Mars is the only large-scale terraforming project in the system, and the political fights around it are bitter — settle the surface, claim the land, change the air, decide who Mars is for. Terraforming knowledge covers atmospheric chemistry, ecopoesis, large-scale climate engineering, microbial seeding, and the long-game economics of remaking a world over centuries.",
      "hooks": "the Tharsis Terraforming Office veteran with conflicted loyalties; the Barsoomian agronomist who thinks the project belongs to Martians, not hypercorps; the exoplanet ecologist asking whether we should be doing this at all.",
      "page": 178
    },
    "spacecraft": {
      "name": "Spacecraft",
      "setting": "Knowledge of spacecraft as systems: types of drive (chemical, fusion, antimatter, ion), ship classes (tugs, shuttles, freighters, gunships, exploration vessels), life support architecture, registries, drive signatures, who builds what. The 'spaceship models' interest in p53. Most transhumans live and die aboard them.",
      "hooks": "the ship-nut who can identify a hull by drive plume; the ex-crew who knows every quirk of a particular class; the smuggler who can tell a customs cruiser from a courier at a hundred kilometers.",
      "page": 352
    },
    "titan-machines": {
      "name": "TITAN Machines",
      "setting": "The TITANs were transhumanity's military seed AIs that achieved hard takeoff during the Fall, devastated Earth, and then vanished — leaving behind contaminated zones, alien architecture, the exsurgent virus, and machines that still occasionally wake up. Knowledge of TITAN tech means recognizing their handiwork: weapons, infrastructure, code, fab patterns, the wrong kind of symmetry. Most of it is lethal, contagious, or both. Specialists are vanishingly rare and usually compartmented.",
      "hooks": "the salvager who survived a TITAN site and won't talk about why; the Firewall asset who studies what no one else will touch; the engineer who recognizes TITAN signatures in things they shouldn't be in.",
      "page": 101
    },
    "morph-design": {
      "name": "Morph Design",
      "setting": "Morphs are the bodies — biomorphs grown in exowombs, synthmorphs assembled in shops, pods stitched from biological and synthetic parts, infomorphs that are pure code. Morph design is the work of specifying them: genelines, neural architecture, bioware suites, aesthetic and functional choices, baseline traits. Every body you've ever sleeved was designed by someone.",
      "hooks": "the genehacker who builds bespoke sleeves for clients with strange needs; the ex-corporate designer who fled with their proprietary lines; the pod-shaper whose work blurs the lines between art and biology.",
      "page": 53
    },
    "body-bank-ops": {
      "name": "Body Bank Ops",
      "setting": "Body banks are where morphs get cycled — stored, refurbished, sold, leased, repossessed. They're hospitals, mortuaries, garages, and warehouses at once. Knowledge of body bank ops covers vat schedules, ego-sleeving procedures, morph availability and pricing, biomonitoring, escrow protocols, and the paperwork of moving minds between bodies. Adjacent industries: insurance, ego transfer, organ trade, illegal flesh markets.",
      "hooks": "the body bank tech who has watched a thousand resleeves and seen a few go wrong; the broker who knows which morphs are clean and which have hidden mods; the ex-Goules operative trying to leave the illegal morph trade behind.",
      "page": 53
    },
    "ego-hunting": {
      "name": "Ego Hunting",
      "setting": "An ego is a person — the mind-pattern that gets backed up, transferred, and resleeved into a new morph. Ego hunting is the trade of tracking egos across the Solar System and exoplanets: bounty work for skipped indentures, recovery of forknapped backups, locating someone who keeps egocasting away. Half investigation, half network expertise; usually adjacent to crime regardless of which side hires you.",
      "hooks": "the freelance ego hunter who works both sides; the Firewall asset who quietly recovers contaminated egos before they wake up; the Nine Lives defector hunting the syndicate that owns their backup.",
      "page": 53
    },
    "mind-hacks": {
      "name": "Mind Hacks",
      "setting": "Psychosurgery — the cognitive science of rewriting minds. Memory editing, behavior masking, hidden knowledge implants, interrogation, deep learning, personality alteration. Legitimate uses (therapy, skill imprints, trauma healing) sit next to terrifying ones (forced compliance, false memories, mind control). Most muses can perform minor psychosurgery; full procedures take specialists. Mind hacks is the knowledge side of that whole landscape.",
      "hooks": "the ex-psychosurgeon haunted by who they edited and why; the underground specialist who runs anonymous trauma clinics; the Firewall asset who studies illegal edits to recognize them in others.",
      "page": 112
    },
    "memetics": {
      "name": "Memetics",
      "setting": "Memes are weaponized ideas — propaganda, narrative warfare, viral framing, social-engineering campaigns designed to reshape populations. In Eclipse Phase 2 memetics is treated seriously enough to be listed as an x-risk in its own right. Every faction runs memetic ops; every habitat is downstream of someone's narrative. Memeticists design, deploy, and counter these campaigns.",
      "hooks": "the ex-Consortium memeticist who defected and now runs counter-narratives; the Barsoomian propagandist who turned a colony anti-corporate one slogan at a time; the analyst who reads social trends like weather and predicts the next mass panic.",
      "page": 369
    },
    "nanofacturing": {
      "name": "Nanofacturing",
      "setting": "Nanofabrication is how almost everything gets made in EP2 — molecular 3D printing from feedstock, driven by blueprints. Nanofacturing as a profession covers the industrial side: factory-scale fabbers, hive arrays, feedstock logistics, blueprint libraries, quality control, the politics of who controls which designs. The Argonauts run an open-source repo called PrintLib; hypercorps fight tooth and nail over proprietary blueprints.",
      "hooks": "the factory veteran who has run every kind of fabber line; the PrintLib contributor smuggling blueprints to autonomist habs; the corporate compliance officer hunting unauthorized prints.",
      "page": 120
    },
    "nanotechnology": {
      "name": "Nanotechnology",
      "setting": "The science underneath nanofabrication — molecular machines, swarms, hives, medichines, gray-goo theory, the difference between a useful nano and a runaway one. Most consumer-facing nanotech is mundane (autocooks, fixer swarms, medichines), but the field also includes weapons-grade and TITAN-derived horrors. Listed as an x-risk for a reason.",
      "hooks": "the nanotech researcher who has signed too many NDAs; the swarm specialist who builds custom hives for outer-system clients; the recovery worker who scrubs nanocontamination out of habitats and dreams about it.",
      "page": 369
    },
    "bioconservativism": {
      "name": "Bioconservativism",
      "setting": "A political stance opposing core transhuman tech: resleeving, uploading, AGI, uplifts, radical augmentation. Pre-Fall it was fringe; the destruction of Earth catalyzed it into a major movement. The Jovian Republic is its institutional home — a militarized polity that bans most transhuman tech outright. Knowing bioconservativism means knowing its arguments, its factions, its sympathizers in unexpected places, and its terror tactics.",
      "hooks": "the ex-Jovian who left over an argument they still half-believe; the Firewall asset who infiltrates biocon cells; the negotiator who has actually had productive talks with bioconservatives and surprised everyone.",
      "page": 161
    },
    "hypercorp-politics": {
      "name": "Hypercorp Politics",
      "setting": "Hypercorps are the post-national giants — they run the Planetary Consortium, own most of Mars and the inner system, and operate proprietary habitats, body banks, gates, and entire industries. Hypercorp politics is the knowledge of who holds which seats, who is feuding with whom (Omnicor versus Starware, Pathfinder versus TerraGenesis), which corps Oversight is sniffing around, where Project Ozma is rumored to operate.",
      "hooks": "the ex-corporate exec who knows where every body is buried; the Consortium-trained negotiator who plays the long game; the journalist who maps the dotted lines between boardrooms.",
      "page": 164
    },
    "political-science": {
      "name": "Political Science",
      "setting": "Knowledge of how transhuman polities function: the Lunar-Lagrange Alliance's council voting, the Planetary Consortium's hypercorp blocs, the Autonomist Alliance's four points of unity, the Titanian Commonwealth's micro-democracy, the Jovian Republic's military rule. In a system with this many ideologies actively in conflict, political theory is survival knowledge.",
      "hooks": "the academic whose work gets quoted by people on every side; the diplomat with too many citizenships; the Firewall analyst who reads polity dynamics like weather patterns.",
      "page": 52
    },
    "uplift-culture": {
      "name": "Uplift Culture",
      "setting": "Uplifts are non-human animals raised to sapience — neo-octopuses, neo-ravens, neo-gorillas, neo-chimps and bonobos, neo-orangutans, and others. Each species has its own evolving culture, internal politics, and ongoing struggle for rights. Knowledge of uplift culture covers their histories, their art, their factional fights (Sapients vs. Mercurials), the Kisilev open-source uplift genetic library, and the daily reality of living transhuman without being human.",
      "hooks": "the uplift advocate working political channels; the neo-avian artist drawing on a cultural inheritance only a generation old; the transhuman ally who actually listens.",
      "page": 109
    },
    "uplift-rights": {
      "name": "Uplift Rights",
      "setting": "The legal and political fight for uplift autonomy — opposing indenture contracts, owning their own genome, voting, parental rights for genetically-modified offspring. Status varies wildly by polity: outer system mostly respects uplifts as full sapients, inner system treats many as property or second-class citizens. Adjacent to AGI rights and the broader Mercurial movement.",
      "hooks": "the uplift-rights lawyer fighting indenture cases habitat by habitat; the Mercurial organizer who lost family to forced sterilization; the ally with hypercorp connections quietly leaking documents.",
      "page": 109
    },
    "black-markets": {
      "name": "Black Markets",
      "setting": "Every banned good, every restricted service, every illegal morph or ego has a market somewhere — and habitats run on these markets more than their councils admit. Knowing the black markets means knowing brokers, fences, dead-drop sites, encrypted auction houses, current prices on contraband morphs, illegal AGIs, weapons-grade nano, narcoalgorithms, and forknapped egos.",
      "hooks": "the broker who can source almost anything for the right rep; the ex-cop turned consultant who knows which fences talk to which cops; the smuggler retired into legitimate trade who can still make introductions.",
      "page": 0
    },
    "xp-dealers": {
      "name": "XP Dealers",
      "setting": "XP is experience playback — recorded sensory streams of someone else's life, played back through your mesh inserts as their own felt experience. Legal XP is entertainment and journalism; illegal XP includes torture recordings, murder logs, illegal sex, and underground combat. XP dealers are the people who move the recordings, both clean and dirty. Underground XP is the ugly half of the trade.",
      "hooks": "the XP dealer who knows which recordings are real; the recovering XP addict who can still spot a fresh feed; the journalist who uses XP to expose what nobody else can prove.",
      "page": 53
    },
    "underground-xp": {
      "name": "Underground XP",
      "setting": "The illegal XP scene — snuff feeds, torture recordings, illegal combat streams, leaked private moments, footage from TITAN-contaminated zones. The dark mesh trades it constantly; Firewall watches because exsurgent virus has been seeded through XP before. Knowing the underground XP scene is knowing who deals what, which feeds are real, and which collectors are dangerous to meet.",
      "hooks": "the ex-collector who burned their library and can't quite forget it; the dark-mesh investigator hunting a specific recording; the addict working their way out one substitution at a time.",
      "page": 53
    },
    "cartel-politics": {
      "name": "Cartel Politics",
      "setting": "Knowledge of the major criminal syndicates — Nine Lives (soul-trafficking out of Legba), the Night Cartel (extortion, nano-piracy, gambling), Pax Familae (Claudia Ambelina's fork-clones running fraud system-wide), the Hidden Concern, the ID Crew, Pirates. Who controls which routes, which feuds are active, which truces are nominal, who Firewall is willing to deal with.",
      "hooks": "the analyst who maps cartel territories on borrowed mesh time; the Firewall asset who runs cartel informants; the ex-soldier who used to work cartel security and walked.",
      "page": 170
    },
    "cartels": {
      "name": "Cartels",
      "setting": "Same field as Cartel Politics — knowledge of the major post-Fall criminal syndicates. Nine Lives (soul-trafficking), Night Cartel (nano-piracy and racketeering), Pax Familae (fork-clones running fraud), Pirates, the Triads. Each cartel has its own territories, rituals, and product lines.",
      "hooks": "the analyst who maps cartel territories on borrowed mesh time; the Firewall asset who runs cartel informants; the ex-soldier who used to work cartel security and walked.",
      "page": 170
    },
    "racketeering": {
      "name": "Racketeering",
      "setting": "The professional practice of organized crime — protection rackets, extortion, kickback structures, money laundering through legitimate hypercorp fronts, intimidation campaigns. In the Solar System this includes Earth-style mob tactics adapted for habitats: control the airlocks, control the body banks, control the rep economy in your zone.",
      "hooks": "the enforcer who is tired of breaking fingers; the accountant who launders for a cartel and hates themself; the ex-mark who learned the trade from the inside and uses it for revenge.",
      "page": 171
    },
    "smuggling": {
      "name": "Smuggling",
      "setting": "Moving contraband — weapons, illegal morphs, forknapped egos, hostile nano, banned XP, restricted blueprints — between habitats and across polity borders. Routes through the Belt, slingshot transits around Jupiter, gate-runs, customs evasion, fence networks at the destination. Half logistics, half social engineering. Every smuggler eventually deals with cartels even if they tried not to.",
      "hooks": "the captain who runs a clean ship and asks no questions; the route specialist who knows every customs blind spot in the inner system; the ex-smuggler turned Firewall courier.",
      "page": 0
    },
    "triads": {
      "name": "Triads",
      "setting": "Long-running East Asian-origin crime syndicates that survived the Fall and adapted aggressively to the post-Fall economy. Heavy in drugs, prostitution and trafficking, extortion, nanofab piracy, gambling, and darknet operations. Often present themselves as legitimate hypercorps; in reality most habitats with a Triad presence know exactly what they are.",
      "hooks": "the Triad-adjacent fixer who can open any door for a price; the ex-soldier who left and is still looking over their shoulder; the investigator building a case nobody is brave enough to prosecute.",
      "page": 171
    },
    "fencing": {
      "name": "Fencing",
      "setting": "The trade of moving stolen goods — morphs, gear, blueprints, art, data, egos. A fence knows valuations, which buyers will not ask questions, how to wipe identifying nano-tags off an item, how to launder physical objects through legitimate-looking trade flows. Adjacent to black markets and racketeering.",
      "hooks": "the fence who refuses certain kinds of merchandise on principle; the appraiser-turned-fence who can spot a fake at a glance; the ex-cop who knows every fence in their station by reputation.",
      "page": 53
    },
    "security-ops": {
      "name": "Security Ops",
