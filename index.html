/* buildPartyMemberCard — renders one card. For self, entry = null and stateLike = STATE.
   For imports, entry = STATE.partyImports[i] and stateLike = entry.full. */
function buildPartyMemberCard(stateLike, entry) {
  const isSelf = !entry;
  const data = partyComputeCardData(stateLike);
  // v0.9.2: tolerate entries missing the v7 .source/.gmNotes fields (e.g. legacy
  // saves whose live state predates normalizePartyImportEntries firing).
  const source = isSelf ? "self" : (typeof entry.source === "string" ? entry.source : "file");
  // v0.10 A4: defensive default so imported members always render the tracker
  // block even if gmNotes is somehow falsy (the PUFT-yes / UNNA-no bug).
  // Wave B replaces this UI with auto-derived display; this is a holdover.
  const gm = (entry && entry.gmNotes) || { wounds:0, stress:0, initiative:null, statusEffects:[], notes:"" };

  const cls = "party-card" + (isSelf ? " party-card--self" : "") + (source === "live" ? " party-card--live" : "");
  const card = h("div", {class: cls});

  // v0.10 A1: portrait thumbnail leads the banner — viscerally seeing the team.
  // Falls back to a glyph silhouette when no avatar is set.
  const portraitThumb = data.avatarDataUrl
    ? h("img", {
        src: data.avatarDataUrl,
        alt: data.name + " portrait",
        class: "pc-portrait-thumb",
        style: {width:"64px",height:"64px",objectFit:"cover",borderRadius:"3px",border:"1px solid rgba(127,212,226,0.3)",flex:"0 0 64px"}
      })
    : h("div", {
        class: "pc-portrait-thumb pc-portrait-thumb--empty",
        style: {width:"64px",height:"64px",borderRadius:"3px",border:"1px dashed rgba(127,212,226,0.25)",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:'"Share Tech Mono", ui-monospace, monospace',fontSize:"22px",color:"rgba(127,212,226,0.4)",flex:"0 0 64px",background:"rgba(7,24,29,0.4)"}
      }, (data.name || "?").trim().charAt(0).toUpperCase() || "?");

  // Banner: portrait + name + morph + source badge.
  // v0.10 C: imported member banner is clickable — opens drawer with their full sheet.
  const bannerProps = {class:"pc-banner", style:{display:"flex",alignItems:"center",gap:"12px"}};
  if (!isSelf) {
    bannerProps.style.cursor = "pointer";
    bannerProps.title = "Click to view " + data.name + "'s full sheet (read-only)";
    bannerProps.onClick = () => showTeamMemberDrawer(entry);
  }
  const banner = h("div", bannerProps);
  banner.appendChild(portraitThumb);
  banner.appendChild(h("div", {style:{flex:"1 1 auto",minWidth:0}},
    h("div", {class:"pc-name"}, data.name),
    data.concept ? h("div", {class:"pc-lifepath"}, "// " + data.concept.toUpperCase()) : null
  ));
  if (data.morph) banner.appendChild(h("div", {class:"pc-morph"}, data.morph.name));
  // v0.10 C: tiny "VIEW SHEET" affordance hint on imported banners (so users
  // know it's clickable; the cursor-pointer alone isn't enough discovery).
  if (!isSelf) {
    banner.appendChild(h("div", {
      style:{fontFamily:"var(--mono)",fontSize:"9.5px",color:"var(--accent-2)",letterSpacing:"1.3px",fontWeight:700,padding:"4px 8px",border:"1px solid rgba(127,212,226,0.3)",borderRadius:"2px",textTransform:"uppercase",flex:"0 0 auto"}
    }, "▸ VIEW SHEET"));
  }
  card.appendChild(banner);

  // Source + timestamp strip
  const srcMap = {file:"FILE", url:"LINK", qr:"QR", live:"LIVE", self:"YOU"};
  const sourceClass = "pc-source pc-source--" + (isSelf ? "self" : source);
  card.appendChild(h("div", {style:{display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap",marginTop:"-2px"}},
    h("span", {class: isSelf ? "pc-source pc-source--file" : sourceClass}, "// " + (srcMap[source] || (typeof source === "string" ? source.toUpperCase() : "FILE"))),
    !isSelf && entry.lastSyncedAt ? h("span", {class:"pc-timestamp"}, "updated " + partyRelativeTime(entry.lastSyncedAt)) : null
  ));

  // Lifepath
  if (data.lifepath || data.faction) {
    card.appendChild(h("div", {class:"pc-meta"},
      data.lifepath ? data.lifepath : "",
      data.lifepath && data.faction ? " · " : "",
      data.faction ? data.faction : ""
    ));
  }

  // v0.10.6: VITALS up top so the team's HP/STRESS row aligns laterally across
  // cards. Everything variable (top skills, lifepath specifics) flows below.
  // v0.10.5: YOU is mutable (it's your STATE); FILE imports are read-only.
  // Sync correction (v0.10.5): studioPcFromState() reads STATE.play.woundsTaken
  // directly, so the wound count matches the studio sheet (was using a
  // recompute-from-raw-damage formula that ignored the latched override).
  if (isSelf || (entry && entry.full)) {
    const vitalsWrap = h("div", { class:"studio-sheet pc-vitals-embed" });
    const renderVitals = () => {
      const pc = studioPcFromState();
      if (!pc || !pc.derived) return;
      vitalsWrap.appendChild(buildStudioVitalSignsCard(pc, { vitalsOnly: true, readOnly: !isSelf }));
    };
    if (isSelf) renderVitals();
    else withStateAs(entry.full, renderVitals);
    card.appendChild(vitalsWrap);
  }

  // v0.10.6: APTITUDES — replaced the text-only "COG 20  INT 15 …" line with
  // the rich studio Aptitudes & Derived strip (three colour-coded family
  // boxes feeding INSIGHT/VIGOR/MOXIE, derived ×3 shown as the dominant
  // number, raw aptitude shown as a small secondary chip). Read-only on the
  // team card — clicks-to-roll stay on the studio sheet. Tooltips fire via
  // the existing data-tip delegation; no new code needed.
  if (isSelf || (entry && entry.full)) {
    const aptWrap = h("div", { class:"studio-sheet pc-aptitudes-embed" });
    const renderApt = () => {
      const pc = studioPcFromState();
      if (!pc || !pc.aptitudes) return;
      aptWrap.appendChild(buildStudioAptitudeStrip(pc, { readOnly: true }));
    };
    if (isSelf) renderApt();
    else withStateAs(entry.full, renderApt);
    card.appendChild(aptWrap);
  }

  // v0.10.9: 4-zone coverage — replaced the text-only pc-cov tiles with
  // buildPartyMemberCoverage's rich slider tiles (label + big number +
  // traffic-light progress bar + emphasized treatment for high tier).
  // Matches the design of the top-of-page team radar; high (≥60) zones
  // get a green glow + bigger number so competence reads at a glance.
  card.appendChild(h("div", {class:"pc-section"},
    h("div", {class:"pc-section-label"}, "▸ ZONE COVERAGE"),
    buildPartyMemberCoverage(data.coverage)
  ));

  // Top skills — variable-length text; lives below the fixed-structure rows.
  if (data.topSkills.length > 0) {
    card.appendChild(h("div", {class:"pc-section"},
      h("div", {class:"pc-section-label"}, "▸ TOP SKILLS"),
      h("div", {style:{fontFamily:"var(--mono)",fontSize:"11.5px",color:"rgba(220,235,238,0.85)",lineHeight:1.55}},
        data.topSkills.map(s => s.name + " " + s.value).join("  ·  ")
      )
    ));
  }

  // v0.10.6: REPUTATION — embed the studio rep panel (progress bars + favor
  // tickboxes per network) on team cards. The panel handles its own "No
  // reputation yet" empty state, so characters without rep entries degrade
  // gracefully. Tooltips (rep.i-rep etc.) fire via the existing delegation.
  if (isSelf || (entry && entry.full)) {
    const repWrap = h("div", { class:"studio-sheet pc-rep-embed" });
    const renderRep = () => {
      const pc = studioPcFromState();
      if (!pc || !pc.reputation) return;
      repWrap.appendChild(buildStudioReputation(pc));
    };
    if (isSelf) renderRep();
    else withStateAs(entry.full, renderRep);
    card.appendChild(repWrap);
  }

  // v0.10.5: TEAM TOOLS — initiative + personal notes for imported members.
  // Vitals moved up into the live panel above; this block keeps the manual
  // initiative tracker (still per-card, shared rollout deferred) and the
  // local-only personal notes textarea.
  if (!isSelf) {
    const idx = STATE.partyImports.indexOf(entry);

    const tracker = h("div", {class:"gm-tracker"});
    tracker.appendChild(h("div", {class:"gm-tracker-label"}, "▾ TEAM TOOLS · initiative · personal notes"));

    // Initiative row (still manual — shared rollout deferred to a later wave)
    const initRow = h("div", {class:"gm-stat-row"},
      h("label", null, "Initiative"),
      h("input", {type:"number", value: gm.initiative !== null ? gm.initiative : "",
        style:{width:"70px",padding:"3px 6px",background:"rgba(0,0,0,0.3)",color:"#fff",border:"1px solid rgba(127,212,226,0.4)",borderRadius:"2px",fontFamily:"var(--mono)",fontSize:"11px"},
        placeholder:"—",
        onChange:(ev) => dispatch(s => {
          const v = ev.target.value;
          if (!s.partyImports[idx].gmNotes) s.partyImports[idx].gmNotes = { wounds:0,stress:0,initiative:null,statusEffects:[],notes:"" };
          s.partyImports[idx].gmNotes.initiative = v === "" ? null : Number(v);
        })}),
      h("button", {style:{padding:"3px 8px",background:"transparent",color:"var(--narrative)",border:"1px solid rgba(194,84,26,0.4)",borderRadius:"2px",fontFamily:"var(--mono)",fontSize:"9.5px",letterSpacing:"1px",fontWeight:700,cursor:"pointer",textTransform:"uppercase"},
        onClick:() => dispatch(s => {
          // d10 + REF/10
          const ref = (entry.full && entry.full.ego && entry.full.ego.aptitudes && entry.full.ego.aptitudes.REF) || 0;
          if (!s.partyImports[idx].gmNotes) s.partyImports[idx].gmNotes = { wounds:0,stress:0,initiative:null,statusEffects:[],notes:"" };
          s.partyImports[idx].gmNotes.initiative = Math.floor(Math.random() * 10) + 1 + Math.floor(ref / 10);
        })}, "Roll")
    );
    tracker.appendChild(initRow);

    // Personal notes textarea — local-only annotation (kept for GM commentary even though the page is for the whole team)
    tracker.appendChild(h("textarea", {class:"gm-notes-textarea", placeholder:"// personal notes — local only, not shared",
      value: gm.notes || "",
      onInput:(ev) => dispatch(s => {
        if (!s.partyImports[idx].gmNotes) s.partyImports[idx].gmNotes = { wounds:0,stress:0,initiative:null,statusEffects:[],notes:"" };
        s.partyImports[idx].gmNotes.notes = ev.target.value;
      }, { skipRerender: true })
    }));
    card.appendChild(tracker);
  }

  // Per-card actions
  const actions = h("div", {class:"pc-actions"});
  if (!isSelf) {
    if (source === "live" && entry.id) {
      actions.appendChild(h("button", {
        title:"Force refresh from /api/share — bypasses 30s poll",
        onClick: async () => {
          try {
            const resp = await fetch("/api/share/" + encodeURIComponent(entry.id));
            if (!resp.ok) { showToast("Refresh failed: " + resp.status); return; }
            const remote = await resp.json();
            const json = LZString.decompressFromEncodedURIComponent(remote.data || "");
            const parsed = json ? JSON.parse(json) : null;
            if (!parsed) { showToast("Decode failed"); return; }
            dispatch(s => {
              const i = s.partyImports.findIndex(p => p === entry || p.id === entry.id);
              if (i >= 0) {
                s.partyImports[i].full = parsed;
                s.partyImports[i].lastSyncedAt = remote.updatedAt || new Date().toISOString();
              }
            });
            showToast("Refreshed " + entry.name);
          } catch(e) { showToast("Refresh error: " + e.message); }
        }
      }, "↻ Refresh"));
    }
    actions.appendChild(h("button", {class:"danger",
      onClick: () => {
        if (!confirm("Remove " + entry.name + " from party?")) return;
        dispatch(s => {
          const i = s.partyImports.findIndex(p => p === entry || p.id === entry.id);
          if (i >= 0) s.partyImports.splice(i, 1);
        });
        showToast("Removed " + entry.name);
      }
    }, "✕ Remove"));
  } else {
    actions.appendChild(h("button", {
      title:"Open share modal",
      onClick: () => showShareModal()
    }, "↗ Share"));
  }
  card.appendChild(actions);

  return card;
}

/* buildPartyPage — the full team-page layout (header + team name + coverage radar + grid).
   v0.10: rebranded "Party" → "Team" in user copy; legacy code identifiers unchanged. */
function buildPartyPage() {
  const page = h("div", {class:"party-page"});

  // Header
  const teamMembers = (STATE.partyImports || []).length;
  const liveCount = (STATE.partyImports || []).filter(p => p.source === "live").length;
  const polling = !!_partyPollAbort;
  const teamName = (STATE.team && STATE.team.teamName) || "";

  // v0.10 A2 + D5: inline-editable team name input. Persists locally;
  // when in a team room, debounced-PATCHes to the team doc.
  const inTeamRoom = !!(STATE.team && STATE.team.roomId);
  const teamNameInput = h("input", {
    type:"text",
    value: teamName,
    placeholder: "// NAME YOUR TEAM",
    class: "team-name-input",
    style: {
      width:"100%", maxWidth:"480px", padding:"6px 10px",
      background:"rgba(7,24,29,0.4)", color:"#fff",
      border:"1px solid rgba(127,212,226,0.3)", borderRadius:"2px",
      fontFamily:"var(--mono)", fontSize:"14px", letterSpacing:"1.5px",
      textTransform:"uppercase", fontWeight:700, marginTop:"6px"
    },
    onInput: (ev) => {
      const v = ev.target.value;
      dispatch(s => {
        if (!s.team) s.team = { roomId:null, teamName:"", lastPolledAt:null };
        s.team.teamName = v;
      }, { skipRerender:true });
      // v0.10 Wave D: when in a team room, debounce-PATCH the team doc
      if (typeof debouncedPatchTeamName === "function" && STATE.team && STATE.team.roomId) {
        debouncedPatchTeamName(v);
      }
    }
  });

  // v0.10 D: room state badge
  const roomBadge = inTeamRoom
    ? h("span", {style:{display:"inline-block",padding:"3px 8px",background:"rgba(126,238,184,0.15)",border:"1px solid var(--good)",borderRadius:"2px",fontFamily:"var(--mono)",fontSize:"9.5px",color:"var(--good)",letterSpacing:"1.3px",fontWeight:700,textTransform:"uppercase",marginLeft:"8px"}}, "🟢 IN ROOM")
    : null;

  const header = h("div", {class:"party-page-header"},
    h("div", {style:{flex:"1 1 auto",minWidth:0}},
      h("h1", null, "Team · Command Centre", roomBadge),
      h("div", {class:"sub"}, "// " + teamMembers + " teammate" + (teamMembers === 1 ? "" : "s") + (liveCount > 0 ? " · " + liveCount + " 🟢 live" : "") + (inTeamRoom ? " · syncing every 60s" : (polling && liveCount > 0 ? " · polling every 30s" : ""))),
      teamNameInput
    ),
    h("div", {style:{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"flex-start"}},
      // Roll Initiative for all
      teamMembers > 0 ? h("button", {
        style:{padding:"8px 14px",background:"transparent",color:"#7fd4e2",border:"1px solid var(--accent)",borderRadius:"2px",fontFamily:"var(--mono)",fontSize:"11px",letterSpacing:"1.5px",fontWeight:700,textTransform:"uppercase",cursor:"pointer"},
        onClick: () => {
          // v0.10 D5: when in a room, write initiative to the team doc (shared);
          // otherwise fall back to per-entry gmNotes (legacy local-only).
          const rolled = [];
          // Include self
          const selfRef = (STATE.ego && STATE.ego.aptitudes && STATE.ego.aptitudes.REF) || 0;
          if (STATE.ego.characterId) {
            rolled.push({
              characterId: STATE.ego.characterId,
              value: Math.floor(Math.random() * 10) + 1 + Math.floor(selfRef / 10),
              rolledAt: new Date().toISOString()
            });
          }
          dispatch(s => {
            s.partyImports.forEach(p => {
              const ref = (p.full && p.full.ego && p.full.ego.aptitudes && p.full.ego.aptitudes.REF) || 0;
              if (!p.gmNotes) p.gmNotes = { wounds:0, stress:0, initiative:null, statusEffects:[], notes:"" };
              const v = Math.floor(Math.random() * 10) + 1 + Math.floor(ref / 10);
              p.gmNotes.initiative = v;
              if (p.id) rolled.push({ characterId: p.id, value: v, rolledAt: new Date().toISOString() });
            });
          });
          if (inTeamRoom) {
            patchTeamDoc({ initiative: rolled });
            showToast("Initiative rolled · shared to team room");
          }
        }
      }, "🎲 Roll Initiative · All") : null,
      // v0.10 D: Create / Leave Team Room
      !inTeamRoom ? h("button", {
        style:{padding:"8px 14px",background:"#1d8493",color:"#06141a",border:"1px solid #7fd4e2",borderRadius:"2px",fontFamily:"var(--mono)",fontSize:"11px",letterSpacing:"1.5px",fontWeight:700,textTransform:"uppercase",cursor:"pointer",boxShadow:"0 0 8px rgba(127,212,226,0.25)"},
        onClick: () => createTeamRoom(),
        title: "Create a shareable team room URL. Everyone who opens it joins the team and sees each other's live sheets."
      }, "🟢 Create Team Room") : h("button", {
        style:{padding:"8px 14px",background:"transparent",color:"rgba(255,160,140,0.85)",border:"1px solid rgba(255,160,140,0.4)",borderRadius:"2px",fontFamily:"var(--mono)",fontSize:"11px",letterSpacing:"1.5px",fontWeight:700,textTransform:"uppercase",cursor:"pointer"},
        onClick: () => { if (confirm("Leave this team room? Other members will still see your last-pushed character until the share expires.")) leaveTeamRoom(); },
        title: "Stop syncing with this team room. Your local state stays; the team doc unchanged."
      }, "✕ Leave Team"),
      // Copy Team URL (when in a room)
      inTeamRoom ? h("button", {
        style:{padding:"8px 14px",background:"transparent",color:"#7fd4e2",border:"1px solid rgba(127,212,226,0.4)",borderRadius:"2px",fontFamily:"var(--mono)",fontSize:"11px",letterSpacing:"1.5px",fontWeight:700,textTransform:"uppercase",cursor:"pointer"},
        onClick: async () => {
          const teamUrl = location.origin + location.pathname + "?team=" + encodeURIComponent(STATE.team.roomId);
          try { await navigator.clipboard.writeText(teamUrl); showToast("Team URL copied"); }
          catch(e) { showToast("Couldn't access clipboard — URL: " + teamUrl); }
        }
      }, "📋 Copy Team URL") : null,
      // Load Party shortcut (v0.10: relabel + dropzone copy)
      h("button", {
        style:{padding:"8px 14px",background:"transparent",color:"rgba(220,235,238,0.85)",border:"1px solid rgba(127,212,226,0.4)",borderRadius:"2px",fontFamily:"var(--mono)",fontSize:"11px",letterSpacing:"1.5px",fontWeight:700,textTransform:"uppercase",cursor:"pointer"},
        onClick: () => triggerImport(true)
      }, "+ Add Member (or drop file)")
    )
  );
  page.appendChild(header);

  // v0.10 A3: drag-and-drop dropzone — whole page accepts JSON drops, with a
  // visible affordance + overlay state on dragover. ADHD-friendly: no aiming.
  const dropzone = h("div", {class:"team-dropzone"},
    h("div", {class:"team-dropzone-hint", style:{padding:"10px 14px",border:"1px dashed rgba(127,212,226,0.35)",borderRadius:"2px",background:"rgba(7,24,29,0.25)",fontFamily:"var(--mono)",fontSize:"11px",letterSpacing:"1.2px",color:"rgba(127,212,226,0.7)",textTransform:"uppercase",textAlign:"center",margin:"12px 0"}},
      "// drop teammate .ep2.json files here (one or many)"
    )
  );
  // wire dropzone handlers via addEventListener AFTER it's in the DOM (see end of buildPartyPage)
  page.appendChild(dropzone);

  // 4-zone party-coverage radar (reuses buildStudioPartyCoverage with self adapter)
  const studioPc = studioPcFromState();
  const coverageBlock = h("div", {class:"party-page-coverage"},
    h("div", {style:{fontFamily:"var(--mono)",fontSize:"11px",letterSpacing:"1.5px",fontWeight:800,color:"var(--accent-2)",textTransform:"uppercase",marginBottom:"8px"}}, "▸ Team · 4-Zone Coverage"),
    buildStudioPartyCoverage(studioPc)
  );
  page.appendChild(coverageBlock);

  // Empty state
  if (teamMembers === 0) {
    const empty = h("div", {class:"party-empty"},
      h("h2", null, "No teammates yet."),
      h("p", null, "Drop a teammate's .ep2.json file anywhere on this page — or click ↗ Share to send your character via link, and your team-mates can share back. Each teammate's full sheet shows up live here."),
      h("button", {onClick: () => showShareModal()}, "↗ Share Your Character")
    );
    page.appendChild(empty);
    // Still render self card at the end
  }

  // Grid: self first, then members (sorted by initiative if any have it set, else insertion order)
  const grid = h("div", {class:"party-grid"});
  // Self card
  grid.appendChild(buildPartyMemberCard(STATE, null));

  // Member cards — initiative-sorted: members with initiative descend, then unrolled at end
  const members = (STATE.partyImports || []).slice();
  members.sort((a, b) => {
    const ai = (a.gmNotes && a.gmNotes.initiative);
    const bi = (b.gmNotes && b.gmNotes.initiative);
    if (ai == null && bi == null) return 0;
    if (ai == null) return 1;
    if (bi == null) return -1;
    return bi - ai;
  });
  members.forEach(m => {
    if (m && m.full) grid.appendChild(buildPartyMemberCard(m.full, m));
  });
  page.appendChild(grid);

  // v0.10 A3: attach drag-and-drop handlers to the page-level dropzone.
  // Whole-page drop is intentional (ADHD-friendly: no aiming). Visual feedback
  // via the .team-dropzone--active class toggles a highlight ring.
  let dragDepth = 0;
  const onDragEnter = (ev) => {
    if (!ev.dataTransfer || !Array.from(ev.dataTransfer.types || []).includes("Files")) return;
    ev.preventDefault();
    dragDepth++;
    page.classList.add("team-dropzone--active");
  };
  const onDragOver = (ev) => {
    if (!ev.dataTransfer || !Array.from(ev.dataTransfer.types || []).includes("Files")) return;
    ev.preventDefault();
  };
  const onDragLeave = (ev) => {
    if (!ev.dataTransfer || !Array.from(ev.dataTransfer.types || []).includes("Files")) return;
    dragDepth--;
    if (dragDepth <= 0) {
      dragDepth = 0;
      page.classList.remove("team-dropzone--active");
    }
  };
  const onDrop = (ev) => {
    ev.preventDefault();
    dragDepth = 0;
    page.classList.remove("team-dropzone--active");
    const files = ev.dataTransfer && ev.dataTransfer.files ? Array.from(ev.dataTransfer.files) : [];
    const jsonFiles = files.filter(f => /\.(json|ep2\.json)$/i.test(f.name) || f.type === "application/json");
    if (jsonFiles.length === 0) {
      showToast("No .json files in drop");
      return;
    }
    jsonFiles.forEach(f => {
      const reader = new FileReader();
      reader.onload = () => { try { importJSON(reader.result, true); } catch (e) { console.error("[drop import]", e); } };
      reader.readAsText(f);
    });
  };
  page.addEventListener("dragenter", onDragEnter);
  page.addEventListener("dragover", onDragOver);
  page.addEventListener("dragleave", onDragLeave);
  page.addEventListener("drop", onDrop);

  return page;
}

/* ── Live polling — runs while in Party mode. Polls every 30s; aborts when
   user leaves Party mode. Updates partyImports[i].full when remote data
   has a newer updatedAt timestamp. */
let _partyPollAbort = null;
let _partyPollInterval = null;
function startPartyPolling() {
  if (_partyPollAbort) return; // already running
  _partyPollAbort = new AbortController();
  const tick = async () => {
    if (!_partyPollAbort) return;
    const liveMembers = (STATE.partyImports || []).filter(p => p.source === "live" && p.id);
    if (liveMembers.length === 0) return;
    for (const member of liveMembers) {
      if (!_partyPollAbort) return;
      try {
        const resp = await fetch("/api/share/" + encodeURIComponent(member.id), { signal: _partyPollAbort.signal });
        if (!resp.ok) continue;
        const remote = await resp.json();
        if (!remote || !remote.updatedAt) continue;
        if (remote.updatedAt === member.lastSyncedAt) continue; // no change
        const json = LZString.decompressFromEncodedURIComponent(remote.data || "");
        const parsed = json ? JSON.parse(json) : null;
        if (!parsed) continue;
        dispatch(s => {
          const i = s.partyImports.findIndex(p => p === member || p.id === member.id);
          if (i >= 0) {
            // Preserve gmNotes — only replace .full and metadata
            s.partyImports[i].full = parsed;
            s.partyImports[i].lastSyncedAt = remote.updatedAt;
          }
        });
        showToast("🔄 " + (member.name || "Member") + " updated");
      } catch(e) {
        if (e.name === "AbortError") return;
        // network blip — try next tick
      }
    }
  };
  // Immediate first poll, then every 30s
  tick();
  _partyPollInterval = setInterval(tick, 30000);
}
function stopPartyPolling() {
  if (_partyPollAbort) {
    _partyPollAbort.abort();
    _partyPollAbort = null;
  }
  if (_partyPollInterval) {
    clearInterval(_partyPollInterval);

/* ── v0.8 Healing dispatchers — explicit damage/wound/stress/trauma decrements.
   The "Heal 1 wound" path removes BOTH a wound tick AND the threshold's worth
   of raw damage (the EP2 "surgery happened" path the UI was missing). ── */
function studioHealDamage(n) {
  n = Math.max(1, n|0);
  dispatch(s => { s.play.wounds = Math.max(0, (s.play.wounds || 0) - n); });
}
function studioHealWound(n) {
  n = Math.max(1, n|0);
  const ms = derived.morphStats();
  const WT = (ms && ms.morph && ms.morph.WT) || 1;
  dispatch(s => {
    s.play.woundsTaken = Math.max(0, (s.play.woundsTaken || 0) - n);
    s.play.wounds = Math.max(0, (s.play.wounds || 0) - (WT * n));
  });
}
function studioHealStress(n) {
  n = Math.max(1, n|0);
  dispatch(s => { s.play.stress = Math.max(0, (s.play.stress || 0) - n); });
}
function studioHealTrauma(n) {
  n = Math.max(1, n|0);
  const ds = derived.derivedStats();
  const TT = ds.traumaThreshold || 1;
  dispatch(s => {
    s.play.traumasTaken = Math.max(0, (s.play.traumasTaken || 0) - n);
    s.play.stress = Math.max(0, (s.play.stress || 0) - (TT * n));
  });
}
function studioLongRestHeal(pc) {
  // Biomorph: 1d10 damage + roll Medicine: Paramedic for 1 wound (if any) — abstracted to: −1d10 damage, −1 wound chance.
  // Synthmorph: requires Hardware: Robotics — abstracted: −1d10 damage if fixer swarm/automech present, else suggest.
  const ms = derived.morphStats();
  const morphType = (ms && ms.morph && ms.morph.type) || "biomorph";
  const dmgHeal = Math.floor(Math.random()*10) + 1;
  dispatch(s => {
    s.play.wounds = Math.max(0, (s.play.wounds || 0) - dmgHeal);
    s.play.stress = Math.max(0, (s.play.stress || 0) - (Math.floor(Math.random()*10) + 1));
  });
  showToast("Long rest: −" + dmgHeal + " damage, −1d10 stress" + (morphType === "synthmorph" ? " (synthmorph repair: requires Hardware: Robotics or fixer swarm for full effect)" : ""));
}

  bodyRow.appendChild(h("span", { "data-tip":"combat.healing", style:{cursor:"help",color:"var(--st-teal-deep)",fontSize:"12px",marginLeft:"4px"} }, "ⓘ"));
  section.appendChild(bodyRow);

  // MIND row

  mindRow.appendChild(h("div", { style:{fontFamily:"var(--mono)",fontSize:"9.5px",letterSpacing:"1.4px",color:"var(--st-ink-mute)",fontWeight:800,flex:"0 0 60px"} }, "▸ MIND"));

/* ── Portrait slot — file upload + drag-and-drop + downscale to JPEG ──
   We downscale to max 400px longest edge at q=0.85 JPEG so the dataURL fits
   comfortably in localStorage (typical result ~30–50KB instead of multi-MB).
   The user explicitly asked for portrait upload because the table includes
   artist players who care about character likeness — first-class affordance,
   not a v0.5 deferral. */
function buildStudioPortraitSlot(pc) {
  const hasAvatar = !!pc.avatar;
  const slot = h("div", {
    style: {
      position:"relative",
      width:"96px",
      minWidth:"96px",
      height:"120px",
      borderRadius:"3px",

    },

  });
  // Hidden file input
  const fileInput = h("input", {
    type:"file",
    accept:"image/*",
    style:{ display:"none" },
    onChange: (e) => { if (e.target.files && e.target.files[0]) handlePortraitFile(e.target.files[0]); e.target.value = ""; }
  });
  slot.appendChild(fileInput);
  // Either image content OR upload placeholder
  if (hasAvatar) {
    slot.appendChild(h("img", {
      src: pc.avatar,
      alt: "Character portrait",
      style: { width:"100%", height:"100%", objectFit:"cover", display:"block" },
      draggable: false
    }));
    // Hover overlay with clear button
    const overlay = h("div", {
      style:{
        position:"absolute", inset:"0", display:"flex", alignItems:"flex-end", justifyContent:"flex-end",
        background:"linear-gradient(180deg, rgba(0,0,0,0) 50%, rgba(0,0,0,0.72) 100%)",
        opacity:"0", transition:"opacity 140ms ease", padding:"4px"
      },
      onMouseEnter: (e) => { e.currentTarget.style.opacity = "1"; },
      onMouseLeave: (e) => { e.currentTarget.style.opacity = "0"; }
    });
    overlay.appendChild(h("button", {
      style:{
        appearance:"none", border:"1px solid rgba(255,255,255,0.4)", background:"rgba(192,57,90,0.85)",
        color:"#fff", fontSize:"10px", fontWeight:800, letterSpacing:"1.2px", padding:"3px 8px",
        borderRadius:"2px", cursor:"pointer", fontFamily:'"Share Tech Mono", ui-monospace, JetBrains Mono, monospace'
      },
      title: "Remove portrait",
      onClick: (e) => { e.stopPropagation(); studioSetIn(["ego","narrative","avatarDataUrl"], null); }
    }, "× CLEAR"));
    slot.appendChild(overlay);
  } else {
    const ph = h("div", { style:{ textAlign:"center", padding:"6px", color:"#7fd4e2", pointerEvents:"none" } });
    // Camera icon (simple SVG)
    ph.appendChild(h("div", { style:{ marginBottom:"4px", opacity:"0.85" } },
      Object.assign(document.createElementNS("http://www.w3.org/2000/svg","svg"), {})
    ));
    // Use the existing pattern: build SVG inline via innerHTML on a wrapper
    const iconWrap = h("div", { style:{ marginBottom:"4px", opacity:"0.85", display:"flex", justifyContent:"center" } });
    iconWrap.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7fd4e2" stroke-width="1.6"><path d="M4 7h3l2-2h6l2 2h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
    ph.innerHTML = "";
    ph.appendChild(iconWrap);
    ph.appendChild(h("div", { style:{ fontFamily:'"Share Tech Mono", ui-monospace, JetBrains Mono, monospace', fontSize:"9.5px", letterSpacing:"1.1px", fontWeight:800 } }, "DROP / CLICK"));
    ph.appendChild(h("div", { style:{ fontFamily:'"Share Tech Mono", ui-monospace, JetBrains Mono, monospace', fontSize:"9px", letterSpacing:"0.8px", opacity:"0.65", marginTop:"2px" } }, "TO UPLOAD"));
    slot.appendChild(ph);
  }
  // Click to open file dialog
  slot.addEventListener("click", () => fileInput.click());
  // Drag-and-drop
  slot.addEventListener("dragover", (e) => {
    e.preventDefault();
    slot.style.borderColor = "#4fd4e0";
    slot.style.transform = "scale(1.02)";
  });
  slot.addEventListener("dragleave", () => {
    slot.style.borderColor = hasAvatar ? "var(--st-teal)" : "rgba(127, 212, 226, 0.55)";
    slot.style.transform = "scale(1)";
  });
  slot.addEventListener("drop", (e) => {
    e.preventDefault();
    slot.style.borderColor = hasAvatar ? "var(--st-teal)" : "rgba(127, 212, 226, 0.55)";
    slot.style.transform = "scale(1)";
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) handlePortraitFile(f);
  });
  return slot;
}

/* Read file → resize via canvas → dispatch dataUrl into STATE. Capped at
   400px longest edge / JPEG q=0.85 so the persisted avatar stays small. */
function handlePortraitFile(file) {
  if (!file || !file.type || !file.type.startsWith("image/")) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 400;
      let w = img.width, hh = img.height;
      if (w > hh && w > maxDim) { hh = Math.round(hh * (maxDim/w)); w = maxDim; }
      else if (hh > maxDim) { w = Math.round(w * (maxDim/hh)); hh = maxDim; }
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(w); canvas.height = Math.round(hh);
      canvas.getContext("2d").drawImage(img, 0, 0, w, hh);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
      studioSetIn(["ego","narrative","avatarDataUrl"], dataUrl);
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

/* ── RollLog — last 12 rolls with outcome badge ── */

  if (rolls.length === 0) {
    return h("div", { style:{fontSize:"12px",color:"var(--st-ink-mute)",fontStyle:"italic"} }, "No rolls yet. Click any skill or aptitude.");
  }
  const wrap = h("div", { style:{display:"flex",flexDirection:"column",gap:"4px",maxHeight:"220px",overflowY:"auto"} });
  rolls.forEach(e => {
    wrap.appendChild(h("div", {
      style:{display:"grid",gridTemplateColumns:"20px 1fr auto auto",gap:"8px",alignItems:"center",padding:"4px 6px",borderLeft:"3px solid "+(e.success?"var(--st-green)":"var(--st-red)"),background:"var(--st-paper-alt)",borderRadius:"3px"}
    },
      buildStudioAptitudeChip(e.aptitude || "COG"),
      h("span", { style:{fontSize:"12px",color:"var(--st-ink)",fontWeight:600} }, e.text || ""),
      h("span", { style:{fontSize:"11px",color:"var(--st-ink-soft)",fontFamily:'"Share Tech Mono", ui-monospace, monospace'} },
        String(e.roll).padStart(2,"0") + " ≤ " + e.target
      ),
      h("span", {
        style:{fontSize:"10px",fontWeight:800,letterSpacing:"0.5px",padding:"1px 6px",borderRadius:"8px",color:e.success?"var(--st-green)":"var(--st-red)",background:e.success?"#e3f4ea":"#fbe8e3"}
      }, (e.doubles?"✦ ":"") + (e.outcome==="crit-success"?"CRIT":e.outcome==="crit-fail"?"BOTCH":e.success?"WIN":"FAIL"))

  return wrap;
}

/* ── StatusBar — active status chips + add-new dropdown ── */
const _STATUS_OPTIONS = ["Stunned","Prone","Restrained","Grappled","Surprised","Suppressed","Poisoned","On Fire","Bleeding","Blinded","Deafened","Mind-Hacked","Trauma","Disoriented"];
function buildStudioStatusBar(pc) {
  const wrap = h("div", { style:{display:"flex",flexWrap:"wrap",gap:"6px",alignItems:"center",minHeight:"30px"} });
  if (pc.statuses.length === 0 && !_studioUI.statusAdding) {
    wrap.appendChild(h("span", { style:{fontSize:"12px",color:"var(--st-ink-mute)"} }, "No active statuses."));
  }
  pc.statuses.forEach(s => {
    wrap.appendChild(h("span", {
      style:{background:"#fff4e0",color:"var(--st-amber)",padding:"3px 10px",borderRadius:"12px",fontSize:"11.5px",fontWeight:700,border:"1px solid var(--st-amber)",display:"inline-flex",alignItems:"center",gap:"6px"}
    },
      s.label + (s.modifier ? " (" + (s.modifier > 0 ? "+" : "") + s.modifier + ")" : ""),
      h("button", {
        style:{background:"transparent",border:"none",cursor:"pointer",color:"var(--st-amber)",padding:0,display:"inline-flex",fontSize:"14px",lineHeight:1},
        onClick: () => studioRemoveStatus(s.key),
        title: "Remove status"
      }, "×")
    ));
  });
  if (_studioUI.statusAdding) {
    const sel = h("select", {
      style:{fontSize:"12px",padding:"3px 6px",borderRadius:"12px",border:"1px solid var(--st-line-hi)"},

      onClick: () => { _studioUI.statusAdding = true; rerender(); }

/* ── ModifierStrip — top-priority readout of auto-applied penalties ── */
function buildStudioModifierStrip(pc) {
  const woundPenalty = (pc.woundsTaken || 0) * -10;
  const traumaPenalty = (pc.traumasTaken || 0) * -10;
  const statusPenalty = (pc.statuses || []).reduce((s, st) => s + (st.modifier || 0), 0);
  const total = woundPenalty + traumaPenalty + statusPenalty;
  const initPen = (pc.traumasTaken || 0) * -1;
  const penalized = total < 0 || initPen < 0;
  const wrap = h("div", {
    style:{
      background: penalized ? "#fff1ec" : "#ecf6f1",
      border: "1.5px solid " + (penalized ? "var(--st-red)" : "var(--st-green)"),
      borderRadius: "4px", padding: "8px 12px",
      display:"flex",alignItems:"center",justifyContent:"space-between",gap:"12px",flexWrap:"wrap"
    }
  });
  wrap.appendChild(h("div", null,
    h("div", { style:{fontSize:"9.5px",color:"var(--st-ink-mute)",letterSpacing:"1.4px",fontWeight:800,fontFamily:'"Share Tech Mono", ui-monospace, monospace'} }, "AUTO-APPLIED TO ALL ROLLS"),
    h("div", { style:{fontSize:"28px",fontWeight:800,color:penalized?"var(--st-red)":"var(--st-green)",fontFamily:'"Share Tech Mono", ui-monospace, monospace',lineHeight:1,marginTop:"2px"} },
      total === 0 ? "±0" : (total > 0 ? "+" + total : String(total)),
      initPen !== 0 ? h("span", { style:{fontSize:"13px",marginLeft:"8px",color:"var(--st-amber)",fontWeight:700} }, "init " + initPen) : null
    )
  ));
  const breakdown = h("div", { style:{display:"flex",flexDirection:"column",gap:"2px",fontSize:"10.5px",color:"var(--st-ink-soft)"} });
  if (pc.woundsTaken > 0) breakdown.appendChild(h("div", null,

    " · " + (pc.woundsTaken * -10) + " to actions"
  ));
  if (pc.traumasTaken > 0) breakdown.appendChild(h("div", null,
    h("span", { style:{color:"#9333ea",fontWeight:800} }, pc.traumasTaken + " trauma" + (pc.traumasTaken > 1 ? "s" : "")),
    " · " + (pc.traumasTaken * -10) + " actions · " + (pc.traumasTaken * -1) + " init"
  ));

    h("span", { style:{color:"var(--st-amber)",fontWeight:800} }, pc.statuses.length + " status"),
    " · " + pc.statuses.map(s => s.label).join(", ")
  ));
  if (pc.woundsTaken === 0 && pc.traumasTaken === 0 && pc.statuses.length === 0) {
    breakdown.appendChild(h("div", { style:{color:"var(--st-ink-mute)",fontStyle:"italic"} }, "No active penalties — clean."));
  }
  wrap.appendChild(breakdown);
  return wrap;
}

/* ── AttackPanel — weapon picker + range/mode/aim/cover + ad-hoc + live target ── */
function _studioGetAttack(pc) {
  if (!_studioUI.attack) {
    const weapons = (pc.gear || []).filter(g => g.weapon && g.equipped);
    _studioUI.attack = {
      weaponIdx: weapons.length > 0 ? 0 : -1,
      aim: "none", range: "close", cover: "none", mode: "ss", adhoc: 0
    };
  }
  return _studioUI.attack;
}
function buildStudioAttackPanel(pc, baseModifier) {
  const a = _studioGetAttack(pc);
  const weapons = (pc.gear || []).filter(g => g.weapon && g.equipped);
  const weapon = a.weaponIdx >= 0 ? weapons[a.weaponIdx] : null;
  const isMelee = !weapon || (weapon.weapon && weapon.weapon.modes === "Melee");
  // Find skill
  const skill = isMelee ? pc.skills.find(s => s.name === "Melee") : pc.skills.find(s => s.name === "Guns");
  // Modifier math
  const aimMod = a.aim === "quick" ? 10 : a.aim === "complex" ? 30 : 0;
  const rangeMod = isMelee ? 0 : ({ point:10, close:0, range:-10, beyond:-20 }[a.range] || 0);
  const coverMod = ({ none:0, minor:-10, moderate:-20, major:-30 }[a.cover] || 0);
  const modeMod = isMelee ? 0 : ({ ss:0, bf:10, fa:30 }[a.mode] || 0);
  const modeDV = isMelee ? "" : ({ ss:"", bf:" +1d10 DV", fa:" +2d10 DV" }[a.mode] || "");
  const totalMod = baseModifier + aimMod + rangeMod + coverMod + modeMod + a.adhoc;
  const target = Math.max(0, (skill ? skill.total : 0) + totalMod);

  const chip = (active, onClick, text) => h("button", {
    style:{padding:"3px 8px",fontSize:"10.5px",fontWeight:700,letterSpacing:"0.4px",border:"1px solid "+(active?"var(--st-teal)":"var(--st-line-hi)"),background:active?"var(--st-teal-soft)":"#fff",color:active?"var(--st-teal-deep)":"var(--st-ink-soft)",borderRadius:"12px",cursor:"pointer"},

  }, text);

  const setAttack = (k, v) => { _studioUI.attack[k] = v; rerender(); };

  const fire = () => {
    if (!skill) return;
    // Use studioRollSkill with totalMod as the modifier, but synthesize a custom name.
    const customName = (weapon ? weapon.name : "Unarmed") + " · " + skill.name;
    // Compose a manual roll so the log entry mentions the weapon.
    const roll = EP2.rollD100();
    const res = EP2.evaluate(roll, target);
    dispatch(s => {
      if (!Array.isArray(s.play.log)) s.play.log = [];
      s.play.log.unshift({
        id: Math.random().toString(36).slice(2),
        t: Date.now(), kind: "roll", text: customName,
        target, modifier: totalMod, roll: roll.value, doubles: roll.doubles,
        outcome: res.outcome, result: res.label, mos: res.mos, success: res.success,
        aptitude: skill ? skill.aptitude : "REF",
        dv: weapon && weapon.weapon ? (weapon.weapon.dv + modeDV) : "1d10"
      });
      s.play.log = s.play.log.slice(0, 50);
    });
    _studioUI.rollFlash = { ...res, roll: roll.value, doubles: roll.doubles, target, text: customName, modifier: totalMod };

  const panel = h("div", { style:{border:"1.5px solid var(--st-red)",borderTop:"3px solid var(--st-red)",borderRadius:"4px",padding:"10px",display:"flex",flexDirection:"column",gap:"8px",background:"#fff"} });
  panel.appendChild(h("div", { style:{display:"flex",alignItems:"baseline",justifyContent:"space-between"} },
    h("span", { style:{fontSize:"12px",fontWeight:800,color:"var(--st-red)",letterSpacing:"1.4px"} }, "ATTACK"),
    h("button", {
      style:{background:"transparent",border:"none",color:"var(--st-ink-mute)",cursor:"pointer",fontSize:"11px",fontFamily:'"Share Tech Mono", ui-monospace, monospace'},
      onClick: () => { _studioUI.attack = null; rerender(); }
    }, "✕ cancel")
  ));
  // Weapon picker — C2: surface a hint when no weapons are equipped so the
  // player knows the panel isn't broken, just unarmed.
  if (weapons.length === 0) {
    panel.appendChild(h("div", {
      style:{
        fontSize:"10.5px", color:"var(--st-ink-mute)", fontStyle:"italic",
        padding:"4px 8px", background:"rgba(220,53,69,0.06)",

    }, "no equipped weapons — using unarmed (DV 1d10)"));
  }
  const weaponRow = h("div", { style:{display:"flex",gap:"4px",flexWrap:"wrap"} });
  weapons.forEach((w, i) => weaponRow.appendChild(
    chip(a.weaponIdx === i, () => setAttack("weaponIdx", i), w.name + " " + (w.weapon ? "DV " + w.weapon.dv : ""))
  ));
  weaponRow.appendChild(chip(a.weaponIdx === -1, () => setAttack("weaponIdx", -1), "Unarmed · DV 1d10"));
  panel.appendChild(weaponRow);
  // Range (ranged only)
  if (!isMelee) {
    panel.appendChild(h("div", null, Lbl("RANGE"),
      h("div", { style:{display:"flex",gap:"4px",flexWrap:"wrap"} },
        chip(a.range==="point",  () => setAttack("range","point"),  "Point-Blank +10"),
        chip(a.range==="close",  () => setAttack("range","close"),  "Close ±0"),
        chip(a.range==="range",  () => setAttack("range","range"),  "Range −10"),
        chip(a.range==="beyond", () => setAttack("range","beyond"), "Beyond −20")

    ));
    panel.appendChild(h("div", null, Lbl("MODE"),
      h("div", { style:{display:"flex",gap:"4px",flexWrap:"wrap"} },

        chip(a.mode==="bf", () => setAttack("mode","bf"), "Burst +10 / +1d10"),

      )

  panel.appendChild(h("div", null, Lbl("AIM"),
    h("div", { style:{display:"flex",gap:"4px",flexWrap:"wrap"} },

      chip(a.aim==="quick",   () => setAttack("aim","quick"),   "Quick +10"),
      chip(a.aim==="complex", () => setAttack("aim","complex"), "Complex +30")

  ));
  panel.appendChild(h("div", null, Lbl("TARGET COVER"),
    h("div", { style:{display:"flex",gap:"4px",flexWrap:"wrap"} },
      chip(a.cover==="none",     () => setAttack("cover","none"),     "None"),
      chip(a.cover==="minor",    () => setAttack("cover","minor"),    "Minor −10"),
      chip(a.cover==="moderate", () => setAttack("cover","moderate"), "Moderate −20"),
      chip(a.cover==="major",    () => setAttack("cover","major"),    "Major −30")
    )
  ));
  panel.appendChild(h("div", { style:{display:"flex",alignItems:"center",gap:"8px"} },
    Lbl("OTHER"),
    h("input", {
      type:"number", value: a.adhoc,
      style:{width:"60px",padding:"2px 6px",fontSize:"11px",border:"1px solid var(--st-line-hi)",borderRadius:"2px",fontFamily:'"Share Tech Mono", ui-monospace, monospace'},
      onInput: (ev) => { _studioUI.attack.adhoc = parseInt(ev.target.value || "0", 10) || 0; }
    }),

    h("div", { style:{fontFamily:'"Share Tech Mono", ui-monospace, monospace',fontSize:"11px"} },
      h("div", { style:{color:"rgba(255,255,255,0.65)",fontSize:"9.5px",letterSpacing:"1.4px"} }, "TARGET"),

      )
    ),
    h("button", {

      style:{background:"#4fd4e0",color:"#06141a",border:"none",borderRadius:"3px",padding:"8px 16px",cursor:skill?"pointer":"not-allowed",fontSize:"12px",fontWeight:800,letterSpacing:"1.4px",fontFamily:'"Share Tech Mono", ui-monospace, monospace'},
      onClick: fire
    }, "ROLL ATTACK ▸")
  ));
  return panel;
}

/* ── TurnCoach — composes the combat scaffold ── */
function buildStudioTurnCoach(pc) {
  // Auto-applied modifier total
  const woundPen = (pc.woundsTaken || 0) * -10;
  const traumaPen = (pc.traumasTaken || 0) * -10;
  const statusPen = (pc.statuses || []).reduce((s, st) => s + (st.modifier || 0), 0);
  const total = woundPen + traumaPen + statusPen;
  const fray = pc.skills.find(s => s.name === "Fray");
  const guns = pc.skills.find(s => s.name === "Guns");
  const perc = pc.skills.find(s => s.name === "Perceive");
  // C1 — aptitude bases for untrained fallbacks (REF for dodge, INT for perceive).
  const refBase = (STATE.ego.aptitudes && STATE.ego.aptitudes.REF) || 0;
  const intBase = (STATE.ego.aptitudes && STATE.ego.aptitudes.INT) || 0;
  const wrap = h("div", { style:{display:"flex",flexDirection:"column",gap:"10px"} });
  // Modifier strip
  wrap.appendChild(buildStudioModifierStrip(pc));
  // Action economy
  wrap.appendChild(buildStudioActionEconomy());
  // Big buttons OR Attack panel
  if (_studioUI.attack) {
    wrap.appendChild(buildStudioAttackPanel(pc, total));
  } else {
    const t = _studioGetTurn();
    wrap.appendChild(h("div", { style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"6px"} },
      buildStudioBigBtn({
        color: "#dc2626", label: "ATTACK", sub: "complex action" + (t.complex ? " · spent" : ""),
        disabled: t.complex,
        onClick: () => { _studioUI.attack = null; _studioGetAttack(pc); rerender(); }
      }),
      // C1: When Fray/Perceive aren't on the sheet, fall back to aptitude × 3
      // (book-standard untrained check). Sub-label shows the fallback target so
      // the player isn't surprised by where the number came from.
      buildStudioBigBtn({
        color: "#2563eb", label: "DODGE",
        sub: fray ? "Fray " + fray.total : "REF×3 " + (refBase * 3) + " · untrained",
        onClick: () => fray ? studioRollSkill("Fray", total) : studioRollAptitude("REF", total)
      }),
      buildStudioBigBtn({
        color: "#16a34a", label: "DODGE RANGED",
        sub: fray ? "Fray÷2 " + Math.floor(fray.total / 2) : "(REF×3)÷2 " + Math.floor(refBase * 3 / 2) + " · untrained",
        onClick: () => (function() {
          // Custom roll so the log shows "Dodge ranged (Fray÷2)" — uses Fray
          // when present, else (REF × 3) ÷ 2 as the trained-half fallback.
          const baseTotal = fray ? fray.total : (refBase * 3);
          const roll = EP2.rollD100();
          const target = Math.max(0, Math.floor(baseTotal / 2) + total);
          const res = EP2.evaluate(roll, target);
          const label = fray ? "Dodge ranged (Fray÷2)" : "Dodge ranged ((REF×3)÷2 · untrained)";
          dispatch(s => {
            if (!Array.isArray(s.play.log)) s.play.log = [];
            s.play.log.unshift({
              id: Math.random().toString(36).slice(2),
              t: Date.now(), kind:"roll", text: label,
              target, modifier: total, roll: roll.value, doubles: roll.doubles,
              outcome: res.outcome, result: res.label, mos: res.mos, success: res.success,
              aptitude: "REF"
            });
            s.play.log = s.play.log.slice(0, 50);
          });
          _studioUI.rollFlash = { ...res, roll: roll.value, doubles: roll.doubles, target, text: label, modifier: total };
          rerender();
        })()
      }),
      buildStudioBigBtn({
        color: "#9333ea", label: "PERCEIVE",
        sub: perc ? String(perc.total) : "INT×3 " + (intBase * 3) + " · untrained",
        onClick: () => perc ? studioRollSkill("Perceive", total) : studioRollAptitude("INT", total)
      })
    ));
  }
  // Pool tactics
  wrap.appendChild(buildStudioPoolTactics(pc));
  return wrap;
}

/* ── Top-level Studio sheet — composes the whole layout ── */
function buildStudioSheet() {
  const pc = studioPcFromState();
  const sheet = h("div", { class: "studio-sheet" });

  // HERO ROW: Identity column + Right rail (Vitals + Aptitudes + Reputation + ...)
  const rightRail = h("div", { style:{display:"flex",flexDirection:"column",gap:"10px",minHeight:0} });

  rightRail.appendChild(buildStudioSection({ key:"aptitudes", title:"Aptitudes & Derived", color:"var(--st-teal)", icon:"aptitudes" },

  rightRail.appendChild(buildStudioSection({ key:"reputation", title:"Reputation", color:"var(--st-teal)", icon:"reputation" },

  ));

  // Hero row layout: in chargen mode the sheet shares width with the wizard
  // (~300px wide), so we stack vertically. In play mode the sheet takes full
  // width and the original 1.05fr / 1.5fr Studio split applies.
  const heroCols = isPlay ? "1.05fr 1.5fr" : "1fr";
  sheet.appendChild(h("div", { class:"studio-row-hero", style:{display:"grid",gridTemplateColumns:heroCols,gap:"14px",alignItems:"stretch"} },
    buildStudioIdentityHero(pc),
    rightRail
  ));

  // ROUND TRACKER (full width below hero) — initiative + statuses, always visible.
  sheet.appendChild(buildStudioSection({ key:"roundTracker", title:"Round Tracker", color:"var(--st-teal)", icon:"combat", kicker:"initiative · statuses",
    panelStyle:{display:"grid",gridTemplateColumns:"auto 1fr",gap:"16px",alignItems:"center"} },
    buildStudioInitiative(pc),
    h("div", { style:{borderLeft:"1px dashed var(--st-line)",paddingLeft:"16px"} },
      h("div", { style:{fontSize:"10px",color:"var(--st-ink-mute)",fontWeight:800,letterSpacing:"1.2px",marginBottom:"4px"} }, "STATUSES"),
      buildStudioStatusBar(pc)
    )
  ));

  // SKILLS ROW (2 cols in play, stacked in chargen)
  const active = pc.skills.filter(s => !s.name.startsWith("Know") && !s.name.startsWith("Medicine"));
  const knowledge = pc.skills.filter(s => s.name.startsWith("Know") || s.name.startsWith("Medicine"));
  const skillsCols = isPlay ? "1fr 1fr" : "1fr";
  const skillsRow = h("div", { class:"studio-row-2col", style:{display:"grid",gridTemplateColumns:skillsCols,gap:"12px"} });
  const activeKids = active.length === 0
    ? [h("div", { style:{fontSize:"12px",color:"var(--st-ink-mute)",fontStyle:"italic"} }, "No skills allocated yet.")]
    : active.map(s => buildStudioSkillRow(s));
  const knowKids = knowledge.length === 0
    ? [h("div", { style:{fontSize:"12px",color:"var(--st-ink-mute)",fontStyle:"italic"} }, "No knowledge skills yet.")]
    : knowledge.map(s => buildStudioSkillRow(s));
  skillsRow.appendChild(buildStudioSection({ key:"skills-active", title:"Skills · Active", color:"var(--st-teal)", icon:"active", kicker: active.length + " entries" }, ...activeKids));
  skillsRow.appendChild(buildStudioSection({ key:"skills-know", title:"Skills · Knowledge", color:"var(--st-teal)", icon:"knowledge", kicker: knowledge.length + " entries" }, ...knowKids));
  sheet.appendChild(skillsRow);

  // GEAR ROW — group items by pack
  const packs = {};
  pc.gear.forEach(g => { (packs[g.pack] = packs[g.pack] || []).push(g); });
  const packNames = Object.keys(packs);
  if (packNames.length > 0) {
    const gearCols = (packNames.length === 1 || !isPlay) ? "1fr" : "1fr 1fr";
    const gearRow = h("div", { class:"studio-row-2col", style:{display:"grid",gridTemplateColumns:gearCols,gap:"12px"} });
    packNames.forEach(p => {
      const items = packs[p];
      const icon = /firewall/i.test(p) ? "combat" : (/genehacker|lab|medic|forens/i.test(p) ? "lab" : "gear");
      const key = "gear-" + p.toLowerCase().replace(/[^a-z0-9]+/g, "-");
      gearRow.appendChild(buildStudioSection({ key, title: "Gear · " + p, color:"var(--st-teal)", icon },
        ...items.map(g => buildStudioGearItem(g))
      ));
    });
    sheet.appendChild(gearRow);
  }

  // v0.8 — Gear Guide: loadout brief, GP/Complexity primer, fabrication detection.
  // Makes existing affordances discoverable. Counts weapons/armor/apps; detects
  // fabber and surfaces what the character can craft in play.
  // v0.9.1: hoisted out of `packNames > 0` gate so imported PCs (which may have
  // no gear yet) still see the GP/Complexity primer + fab guidance.
  sheet.appendChild(buildStudioGearGuide(pc));

  // v0.9 — The Mesh: every PC's mesh access made legible.
  // Surfaces Muse, OPSEC stack, hacking dice (Infosec/Interface/Program),
  // mesh apps, common actions, privilege ladder, and mesh-relevant ware.
  // Pure projection — no schema change, derives everything from existing STATE.
  // v0.9.1: hoisted out of `packNames > 0` gate. Mesh access derives from morph
  // ware + skills, not gear — every PC needs this section even pre-gear.
  sheet.appendChild(buildStudioMesh(pc));

  // ── DOSSIER · OFF-FEED ──────────────────────────────────────────
  // Below the live mechanics, the sheet switches into narrative territory:
  // campaign brief + character backstory (parallel lore tabs), then a
  // session-notes textarea for at-table jotting.
  sheet.appendChild(buildStudioFeedBreak({ label: "// DOSSIER · OFF-FEED" }));
  // Campaign brief picks an automatic tab-right badge from the faction (or
  // "Sunward Ops" if firewall is the active campaign).
  const factionId = STATE.ego.faction;
  const factionName = factionId && RULEBOOK_DATA.factions[factionId] ? RULEBOOK_DATA.factions[factionId].name : null;
  const campaignBadge = (STATE.meta.campaignType === "firewall")
    ? "FIREWALL"
    : (factionName ? factionName.toUpperCase() : null);
  const loreCols = isPlay ? "1fr 1fr" : "1fr";
  const loreRow = h("div", { class:"studio-row-2col", style:{ display:"grid", gridTemplateColumns: loreCols, gap:"14px" } });
  // Title is short ("BRIEF") so the protruding left tab + right campaign-type
  // badge both fit in 2-col play mode (~340px panel width) without overlapping.
  loreRow.appendChild(buildStudioLoreSection({
    title: "BRIEF",
    tabRight: campaignBadge,
    accent: "#4fd4e0",
    kicker: factionName ? "// faction · " + factionName : null,
    value: pc.teamBrief,
    onCommit: (v) => studioSetIn(["ego","narrative","teamBrief"], v),
    placeholder: "Mission shape, contact, cell quirks. The brief your character would file before stepping out the airlock."
  }));
  loreRow.appendChild(buildStudioLoreSection({
    title: "BACKSTORY",
    tabRight: pc.background ? pc.background.toUpperCase() : null,
    accent: "#ffa657",
    kicker: pc.career ? "// career · " + pc.career : null,
    value: pc.backstory,
    onCommit: (v) => studioSetIn(["ego","narrative","backstory"], v),
    placeholder: "Where they came from, who they lost, what they want, who they are when no one's watching."
  }));
  sheet.appendChild(loreRow);

  // Session Notes — full-width Studio Section bound to STATE.play.notes.
  sheet.appendChild(buildStudioSection({ key:"sessionNotes", title:"Session Notes", color:"var(--st-teal)", icon:"notes", kicker:"at-table jotting" },
    buildStudioSessionNotes(pc)
  ));

  // Floating RollFlash overlay (if active)
  if (_studioUI.rollFlash) {
    sheet.appendChild(buildStudioRollFlash(_studioUI.rollFlash));
  }
  return sheet;
}

function buildPreviewNarr() {
  const e = STATE.ego;
  const pane = h("div", {class:"preview-narr"});
  pane.appendChild(h("h3", null, "Concept"));
  pane.appendChild(h("div", {class:"concept-show"}, e.narrative.concept || h("span", {class:"muted",style:{fontWeight:"normal",fontSize:"13px",fontStyle:"italic"}}, "(no concept yet)")));

  const id = e.narrative.identity;
  const hasIdentity = id.morphRelationship || id.resleeveStance || id.fallStory || id.factionNuance || id.taboo || id.memoryGapsOrForks;
  if (hasIdentity) {
    pane.appendChild(h("h3", null, "Who You Are"));
    const wrap = h("div", {style:{fontSize:"12px",lineHeight:"1.5"}});
    if (id.morphRelationship) wrap.appendChild(h("div", null, h("b", {style:{color:"var(--fg-3)"}}, "morph: "), id.morphRelationship));
    if (id.resleeveStance) wrap.appendChild(h("div", null, h("b", {style:{color:"var(--fg-3)"}}, "resleeving: "), id.resleeveStance));
    if (id.factionNuance) wrap.appendChild(h("div", null, h("b", {style:{color:"var(--fg-3)"}}, "faction: "), id.factionNuance.replace(/_/g," ")));
    if (id.taboo) wrap.appendChild(h("div", null, h("b", {style:{color:"var(--fg-3)"}}, "won't cross: "), id.taboo));
    if (id.fallStory) wrap.appendChild(h("div", null, h("b", {style:{color:"var(--fg-3)"}}, "the Fall: "), id.fallStory));
    if (id.memoryGapsOrForks) wrap.appendChild(h("div", null, h("b", {style:{color:"var(--fg-3)"}}, "gaps/forks: "), id.memoryGapsOrForks));
    pane.appendChild(wrap);
  }

  const qa = Object.entries(e.narrative.backstoryAnswers).filter(([k,v]) => v && v.trim());
  if (qa.length) {
    pane.appendChild(h("h3", null, "Backstory (" + qa.length + " answered)"));
    // v0.5.1 — show full backstory answers, no slice or 80-char truncation.
    // Backstory is narrative content the player wrote deliberately; truncating
    // it in the Review pane defeats the purpose of having a Review pane.
    // The Review's job is to surface everything so the player can verify the
    // full character before locking in CHARGEN and toggling to PLAY.
    const ans = h("div", {style:{fontSize:"12px",lineHeight:"1.55"}});
    qa.forEach(([k, v]) => {
      ans.appendChild(h("div", {style:{marginBottom:"8px",fontStyle:"italic",color:"var(--fg-2)"}}, "\"" + v + "\""));
    });
    pane.appendChild(ans);
  }

  const q = e.narrative.quirks;
  if (q.mannerism || q.catchphrase || q.style) {
    pane.appendChild(h("h3", null, "Quirks"));
    const wrap = h("div", {style:{fontSize:"12px"}});
    if (q.mannerism) wrap.appendChild(h("div", null, h("b", {style:{color:"var(--fg-3)"}}, "does: "), q.mannerism));
    if (q.catchphrase) wrap.appendChild(h("div", null, h("b", {style:{color:"var(--fg-3)"}}, "says: "), "\"" + q.catchphrase + "\""));
    if (q.style) wrap.appendChild(h("div", null, h("b", {style:{color:"var(--fg-3)"}}, "looks: "), q.style));
    pane.appendChild(wrap);
  }

  if (e.narrative.connections.length) {
    pane.appendChild(h("h3", null, "Connections"));
    const wrap = h("div", {style:{fontSize:"12px"}});
    e.narrative.connections.forEach(c => {
      wrap.appendChild(h("div", null, h("b", {style:{color:"var(--fg-3)"}}, c.withPcName + " — " + c.kind + ": "), c.text));
    });
    pane.appendChild(wrap);
  }

  if (e.motivations.length) {
    pane.appendChild(h("h3", null, "Motivations"));
    const wrap = h("div", {style:{fontSize:"12px"}});
    e.motivations.forEach(m => wrap.appendChild(h("div", null, m)));
    pane.appendChild(wrap);
  }

  return pane;
}

function buildStepView() {

  view.appendChild(h("input", {class:"concept-input", type:"text", placeholder:"One-sentence concept (e.g. \"cynical ex-cop who can't stop helping people\")", value: STATE.ego.narrative.concept,
    onChange: (ev) => dispatch(s => { s.ego.narrative.concept = ev.target.value; })}));

function buildStepNav() {
  const row = h("div", {class:"btn-row"});
  if (STATE.step > 1) row.appendChild(h("button", {class:"btn secondary", onClick: () => dispatch(s => { s.step--; window.scrollTo(0,0); })}, "◀ Back"));
  if (STATE.step < TOTAL_STEPS) row.appendChild(h("button", {class:"btn", onClick: () => dispatch(s => { s.step++; window.scrollTo(0,0); })}, "Continue ▶ Step " + (STATE.step+1) + ": " + STEP_TITLES[STATE.step+1]));
  else if (STATE.step === TOTAL_STEPS) row.appendChild(h("button", {class:"btn", onClick: () => dispatch(s => { s.step = 14; window.scrollTo(0,0); })}, "Review ▶"));
  else if (STATE.step === 14) row.appendChild(h("button", {class:"btn secondary", onClick: () => dispatch(s => { s.step = 1; window.scrollTo(0,0); })}, "◀ Back to Step 1"));
  return row;
}

// Reusable: guiding question block. Returns empty fragment if nothing to show.
function gqBlock(questions, answerKey) {
  if (!questions || !questions.length) return document.createDocumentFragment();
  return h("div", null, questions.map(q => {
    const id = q.id || (answerKey + ":" + (q.q || "").slice(0,30));
    return h("div", {class:"gq"},
      h("div", {class:"q"}, q.q),
      h("textarea", {placeholder:"…(skip if you like)", value: STATE.ego.narrative.backstoryAnswers[id] || "",
        onChange: (ev) => dispatch(s => { s.ego.narrative.backstoryAnswers[id] = ev.target.value; })}),
      q.ex ? h("div", {class:"ex"}, "ex: " + q.ex) : null
    );
  }));
}

// Reusable: lifepath card-pick (background/career/interest)
// Renders skill grants WITH the actual field options visible (book-style),
// so the player can make an informed pick before committing.
function describeSkill(sk) {
  if (sk.skill === "_OR_") {
    // "Fray or Melee 20" — show as a clear branch
    return sk.options.map(o => o.skill).join(" or ") + " " + sk.options[0].value;
  }
  let label = sk.skill;
  if (sk.field) {
    if (sk.field.fixed) {
      label += ": " + sk.field.fixed;
    } else if (sk.field.common && sk.field.common.length) {
      label += " (" + sk.field.common.join(" / ") + ")";
    } else if (sk.field.choose) {
      label += " (any)";
    }
  }
  return label + " " + sk.value;
}

function lifepathCards(catalog, selectedId, onPick, questionMap) {
  const cards = h("div", {class:"cards"});
  const entries = Object.values(catalog);
  entries.forEach(item => {
    if (item.tier === "advanced" && !STATE.meta.advancedMode) return;
    const card = h("div", {class: "card" + (item.id === selectedId ? " selected" : ""), onClick: () => onPick(item.id)});
    card.appendChild(h("div", {class:"name"}, item.name, item.tier === "advanced" ? h("span", {class:"tier advanced"}, "advanced") : null));
    card.appendChild(h("div", {class:"blurb"}, item.blurb));
    if (item.skills) {
      const g = h("div", {class:"grants"});
      item.skills.forEach(sk => {
        g.appendChild(h("span", {class:"g"}, describeSkill(sk)));
      });
      card.appendChild(g);
    }
    if (item.seeds && item.seeds.length) {
      card.appendChild(h("div", {class:"seeds"}, "seeds: " + item.seeds.join(" · ")));
    }
    cards.appendChild(card);
  });
  // Show toggle hint if advanced exist and hidden
  const hasAdvanced = entries.some(it => it.tier === "advanced");
  if (hasAdvanced && !STATE.meta.advancedMode) {
    cards.appendChild(h("div", {class:"muted", style:{gridColumn:"1/-1",fontSize:"12px",fontStyle:"italic",marginTop:"6px"}}, "Some advanced options are hidden. Toggle 'Advanced' in the header to see them."));
  }
  return cards;
}

// Reusable: field-skill choosers for the picked package. Returns empty fragment if nothing to show.
function fieldChooserBlock(catalog, selectedId, sourceKey) {
  if (!selectedId) return document.createDocumentFragment();
  const item = catalog[selectedId];
  if (!item || !item.skills) return document.createDocumentFragment();
  const block = h("div", {style:{marginTop:"12px"}});
  let any = false;
  item.skills.forEach((sk, idx) => {
    let actualSpec = sk;
    if (sk.skill === "_OR_") {
      any = true;
      const chosenIdx = STATE.ego.orChoices[sourceKey + "." + idx] || 0;
      const opts = sk.options;
      block.appendChild(h("div", {class:"field-pick"},
        h("span", {class:"label"}, "Choose:"),
        ...opts.map((o, oi) => h("button", {class: "chip" + (oi === chosenIdx ? " active" : ""),
          onClick: () => dispatch(s => { s.ego.orChoices[sourceKey + "." + idx] = oi; })}, o.skill + " " + o.value))
      ));
      actualSpec = opts[chosenIdx];
    }
    if (actualSpec.field && actualSpec.field.choose && actualSpec.field.common) {
      any = true;
      const k = sourceKey + "." + idx;
      const chosen = STATE.ego.fieldChoices[k] || "";
      // Show the offering — both the skill and the curated theme of options — so the player
      // can see WHAT they're picking from without re-reading the book.
      const themeHint = actualSpec.field.common.join(" · ");
      block.appendChild(h("div", {class:"field-pick"},
        h("span", {class:"label"}, actualSpec.skill + " " + actualSpec.value + " — pick one:"),
        h("select", {onChange: (ev) => dispatch(s => { s.ego.fieldChoices[k] = ev.target.value; })},
          h("option", {value:""}, "(defer to play)"),
          ...actualSpec.field.common.map(f => h("option", {value:f, selected: f === chosen ? true : false}, f)),
          h("option", {value:"__other__"}, "Other…")
        ),
        chosen === "__other__" ? h("input", {type:"text", placeholder:"custom field…", onChange:(ev)=>dispatch(s=>{s.ego.fieldChoices[k]=ev.target.value;})}) : null,
        h("span", {class:"muted", style:{fontSize:"11px",flexBasis:"100%",marginTop:"2px"}}, "common: " + themeHint)
      ));
    } else if (actualSpec.field && actualSpec.field.choose && !actualSpec.field.common) {
      any = true;
      const k = sourceKey + "." + idx;
      const chosen = STATE.ego.fieldChoices[k] || "";
      // For "any field" Know slots, surface book-suggested common Know fields so the player
      // isn't staring at a blank text input with no scaffolding.
      const skillDef = RULEBOOK_DATA.skills[actualSpec.skill] || {};
      const suggested = skillDef.commonFields || [];
      block.appendChild(h("div", {class:"field-pick"},
        h("span", {class:"label"}, actualSpec.skill + " " + actualSpec.value + " — any field:"),
        suggested.length
          ? h("select", {onChange: (ev) => dispatch(s => { s.ego.fieldChoices[k] = ev.target.value === "__other__" ? "" : ev.target.value; })},
              h("option", {value:""}, "(defer to play)"),
              ...suggested.map(f => h("option", {value:f, selected: f === chosen ? true : false}, f)),
              h("option", {value:"__other__"}, "Other…")
            )
          : h("input", {type:"text", placeholder:"any field (blank to defer)", value:chosen, onChange:(ev)=>dispatch(s=>{s.ego.fieldChoices[k]=ev.target.value;})}),
        suggested.length ? h("span", {class:"muted", style:{fontSize:"11px",flexBasis:"100%",marginTop:"2px"}}, "common: " + suggested.join(" · ")) : null
      ));
    }
  });
  if (!any) return document.createDocumentFragment();
  block.insertBefore(h("h2", null, "Field Choices"), block.firstChild);
  return block;
}

/* === Step 4: Faction === */
function step4Faction() {
  const frag = h("div");
  frag.appendChild(h("h1", null, "Step 4 — Faction"));
  frag.appendChild(h("p", {class:"lead"}, "Pick a faction (or skip — the book allows this). Your faction grants Know:[Faction] 30 and a first motivation."));
  frag.appendChild(h("div", {class:"why"}, "Why this matters: faction sets your political/cultural context — and rep affinities. You can defer this and decide in play, or explicitly choose 'factionless'."));
  const factionsCatalog = clone(RULEBOOK_DATA.factions);
  factionsCatalog.factionless = {id:"factionless",name:"Factionless",tier:"common",blurb:"Not everyone picks sides. Choose your own motivation and any Know skill at 30 instead."};
  const cards = h("div", {class:"cards"});
  Object.values(factionsCatalog).forEach(item => {
    if (item.tier === "advanced" && !STATE.meta.advancedMode) return;
    const isSel = (item.id === "factionless" && STATE.ego.factionless) || STATE.ego.faction === item.id;
    const card = h("div", {class:"card" + (isSel ? " selected" : ""), onClick: () => dispatch(s => {
      if (item.id === "factionless") { s.ego.factionless = true; s.ego.faction = null; s.ego.factionDeferred = false; }
      else { s.ego.faction = item.id; s.ego.factionless = false; s.ego.factionDeferred = false; }
    })});
    card.appendChild(h("div", {class:"name"}, item.name, item.tier === "advanced" ? h("span", {class:"tier advanced"}, "advanced") : null));
    card.appendChild(h("div", {class:"blurb"}, item.blurb));
    if (item.id !== "factionless") {
      // Surface mechanical grants on every card so they're visible at decision-time
      const grants = h("div", {class:"grants"});
      grants.appendChild(h("span", {class:"g"}, "Know: " + item.name + " 30"));
      grants.appendChild(h("span", {class:"g"}, "motivation: +" + item.name + " Interests"));
      if (item.repAffinity) grants.appendChild(h("span", {class:"g"}, "rep: " + item.repAffinity.join(", ")));
      card.appendChild(grants);
    }
    // Show the nuance-stance options as a hint — these apply to ALL factions, so the player
    // sees from the listing that 'pick faction' isn't 'pick zealotry' — you can be a dissident.
    card.appendChild(h("div", {class:"seeds"},
      item.id === "factionless"
        ? "you'll be asked: why no faction?"
        : "stance options: " + IDENTITY_OPTIONS.factionNuance.slice(0,4).map(s => s.replace(/_/g," ")).join(" · ") + "…"
    ));
    cards.appendChild(card);
  });
  frag.appendChild(cards);
  frag.appendChild(h("div", {style:{marginTop:"12px"}},
    h("button", {class:"btn ghost", onClick: () => dispatch(s => { s.ego.factionDeferred = true; s.ego.faction = null; s.ego.factionless = false; })}, STATE.ego.factionDeferred ? "✓ Deferred — decide in play" : "Skip & decide in play →")
  ));
  if (STATE.ego.faction) {
    frag.appendChild(h("h2", null, "Your Story"));
    frag.appendChild(gqBlock(QUESTIONS.faction[STATE.ego.faction], "faction"));
    // Faction nuance picker
    frag.appendChild(h("div", {class:"gq"},
      h("div", {class:"q"}, "Your stance toward your faction:"),
      h("div", null, ...IDENTITY_OPTIONS.factionNuance.map(opt =>

          onClick: () => dispatch(s => { s.ego.narrative.identity.factionNuance = opt; })}, opt.replace(/_/g, " "))))
    ));

/* === Step 5: Aptitude Template === */
function step5Aptitudes() {
  const frag = h("div");
  frag.appendChild(h("h1", null, "Step 5 — Aptitude Template"));
  frag.appendChild(h("p", {class:"lead"}, "Pick a template to set your six aptitudes (COG/INT/REF/SAV/SOM/WIL). You can redistribute points after — no aptitude below 5 or above 30."));
  frag.appendChild(h("div", {class:"why"}, "Why this matters: aptitudes set the base values for all your skills (Fray and Perceive get aptitude × 2). The math in Step 6 takes care of itself once you pick a template."));
  const cards = h("div", {class:"cards"});
  // "Good for" hint — surface the archetype implied by the aptitude distribution so
  // the player isn't doing the derivation themselves while staring at 6 numbers.
  const APT_ROLE = { COG:"research", INT:"perception", REF:"dexterity", SAV:"social", SOM:"physical", WIL:"willpower" };
  const goodFor = (apts) => {
    const high = Object.entries(apts).filter(([k,v]) => v >= 18).map(([k]) => APT_ROLE[k]);
    if (high.length === 0) return "balanced / versatile";
    return high.join(" / ");
  };
  Object.values(RULEBOOK_DATA.aptitudeTemplates).forEach(t => {
    const card = h("div", {class:"card" + (t.id === STATE.ego.aptitudeTemplate ? " selected" : ""), onClick: () => dispatch(s => {
      s.ego.aptitudeTemplate = t.id;
      s.ego.aptitudes = clone(t.aptitudes);
    })});
    card.appendChild(h("div", {class:"name"}, t.name));
    card.appendChild(h("div", {class:"blurb"}, t.blurb));
    const g = h("div", {class:"grants"});
    Object.entries(t.aptitudes).forEach(([k,v]) => g.appendChild(h("span", {class:"g"}, k+" "+v)));
    card.appendChild(g);
    card.appendChild(h("div", {class:"seeds"}, "good for: " + goodFor(t.aptitudes)));
    cards.appendChild(card);
  });
  frag.appendChild(cards);
  // Redistribute UI
  if (STATE.ego.aptitudeTemplate) {
    frag.appendChild(h("h2", null, "Redistribute"));
    frag.appendChild(h("p", {class:"muted", style:{fontSize:"13px"}}, "Adjust within the template. Range is 5–30. Total points must stay equal to template total (90)."));
    const redist = h("div", {style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:"8px"}});
    ["COG","INT","REF","SAV","SOM","WIL"].forEach(k => {
      const v = STATE.ego.aptitudes[k];
      redist.appendChild(h("div", {class:"bucket", style:{margin:0,padding:"8px"}},
        h("div", {style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},
          h("b", null, k),
          h("div", {class:"ctrl"},
            h("button", {onClick: () => dispatch(s => { if (s.ego.aptitudes[k] > 5) s.ego.aptitudes[k]--; }), disabled: v <= 5}, "−"),
            h("span", {class:"val"}, String(v)),
            h("button", {onClick: () => dispatch(s => { if (s.ego.aptitudes[k] < 30) s.ego.aptitudes[k]++; }), disabled: v >= 30}, "+")
          )
        )
      ));
    });
    frag.appendChild(redist);
    const total = Object.values(STATE.ego.aptitudes).reduce((s,n)=>s+n,0);
    if (total !== 90) frag.appendChild(h("div", {class:"warn-banner"}, "Aptitude total is " + total + " (expected 90). The book says swap one-for-one — increases here should be paid for by decreases elsewhere."));
  }
  return frag;
}

const STEP_RENDERERS = {
  1: step1Background,
  2: step2Career,
  3: step3Interest,
  4: step4Faction,
