};

/* === Step 6: Total Skills === */
function step6TotalSkills() {
  const frag = h("div");
  frag.appendChild(h("h1", null, "Step 6 — Total Skills"));
  frag.appendChild(h("p", {class:"lead"}, "Your three packages, your aptitudes, and the cap of 80 all interact here. The math has already been done — your job is to spend any surplus."));
  frag.appendChild(h("div", {class:"why"}, "Each skill is shown with its aptitude base + package value + CP-bought points = final (capped at 80). The overflow from packages+aptitudes IS your surplus budget — clicking +5 spends it down."));
  const fs = derived.finalSkills();
  if (fs.skills.length === 0) {
    frag.appendChild(h("div", {class:"warn-banner"}, "No skills yet — pick a Background, Career, and Interest first."));
    return frag;
  }

  // Surplus pool — now correctly shows remaining = initial - spent
  frag.appendChild(h("div", {class:"counter-bar"},
    h("div", {class:"top"},
      h("span", null, "Surplus Pool (remaining)"),
      h("span", null, h("b", null, String(fs.surplus.active)), " active · ", h("b", null, String(fs.surplus.know)), " know")
    ),
    h("div", {class:"muted", style:{fontSize:"11px"}},
      "Initial budget from package overflow: " + fs.initialSurplus.active + " active · " + fs.initialSurplus.know + " know. " +
      "Spent so far: " + fs.spent.active + " active · " + fs.spent.know + " know. " +
      "Active points can go anywhere; Know points only to Know skills."
    )
  ));

  // Loud warning for overspending (existing saves may have over-allocated under the old buggy semantics)
  if (fs.overspent.active > 0 || fs.overspent.know > 0) {
    frag.appendChild(h("div", {class:"error-banner"},
      "⚠ You've spent more than your initial budget. Overspent by " +
      fs.overspent.active + " active · " + fs.overspent.know + " know. " +
      "Reduce allocations below until the pool reads ≥ 0 in both columns. ",
      h("button", {class:"btn ghost", style:{marginLeft:"6px"},
        onClick: () => { if (confirm("Clear all Step-6 reassignments? (CP-bought skills stay.)")) dispatch(s => {
          s.ego.slotAllocations = {};
          s.ego.customSlots = [];
          s.ego.customSlotCounter = 0;
        }); }
      }, "Clear all reassignments")
    ));
  }
  // Warning for wasted points (allocations into already-capped skills)
  if (fs.wasted.active > 0 || fs.wasted.know > 0) {
    frag.appendChild(h("div", {class:"warn-banner"},
      "Some allocations went into skills that hit the 80 cap. Wasted: " +
      fs.wasted.active + " active · " + fs.wasted.know + " know. Skills below marked with ⚠."
    ));
  }

  // Skill rows — operate on SLOTS, not bucket keys. Each row has a primary slot
  // (the one that receives +5) and a slot that yields -5 (the one with positive
  // allocation, else nothing).
  const table = h("div", {style:{marginTop:"10px"}});
  fs.skills.forEach(s => {
    const isKnow = s.knowOnly;
    const headroom = Math.max(0, 80 - s.preAllocRaw - s.fromCP - (s.reassigned > 0 ? s.reassigned : 0));
    // §A2: active points can go to any skill; know points only to know skills.
    // Buttons only need the appropriate pool to be ≥ 5.
    const canSpend5 = isKnow ? (fs.surplus.know >= 5) : (fs.surplus.active >= 5);
    const canAdd = headroom > 0 && canSpend5;

    // Primary slot for +5: first slot in this bucket (any will do — math equivalent)
    const targetSlot = s.slots[0];
    // Slot to deduct from on -5: a slot in this bucket with positive allocation
    const deductSlot = s.slots.find(sl => (sl.allocation || 0) >= 5) ||
                       s.slots.find(sl => (sl.allocation || 0) > 0);

    const wasted = s.reassigned > 0 ? Math.max(0, s.reassigned - Math.max(0, 80 - s.preAllocRaw - s.fromCP)) : 0;

    const displayName = s.skill + (s.field ? ": " + s.field : (s.deferred ? ": (pick field →)" : ""));

    const row = h("div", {style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"4px 0",borderBottom:"1px dashed var(--border)",gap:"6px",fontSize:"13px",flexWrap:"wrap"}});
    row.appendChild(h("div", {style:{flex:"1",minWidth:"140px"}}, displayName));
    row.appendChild(h("div", {style:{fontFamily:"var(--mono)",fontSize:"11px",color:"var(--fg-3)"}},
      "apt " + s.aptBase + " + pkg " + s.fromPackages + (s.reassigned ? " + reas " + s.reassigned : "") + (s.fromCP ? " + CP " + s.fromCP : "")
    ));
    row.appendChild(h("div", {style:{fontFamily:"var(--mono)",minWidth:"60px",textAlign:"right",fontSize:"14px", color: s.isCapped ? "var(--warn)" : "var(--fg)"}},
      String(s.final) + (s.isCapped ? " (cap)" : "") + (wasted > 0 ? " ⚠" + wasted : "")
    ));
    row.appendChild(h("button", {class:"chip",
      disabled: !canAdd || !targetSlot,
      title: !canSpend5 ? "Not enough surplus" : (headroom <= 0 ? "Already at 80 cap" : "Spend 5 from surplus"),
      onClick: () => {
        if (!canAdd || !targetSlot) return;
        dispatch(st => {
          st.ego.slotAllocations[targetSlot.source] = (st.ego.slotAllocations[targetSlot.source] || 0) + 5;
        });
      }}, "+5"));
    if (deductSlot) {
      row.appendChild(h("button", {class:"chip", onClick: () => dispatch(st => {
        const v = (st.ego.slotAllocations[deductSlot.source] || 0) - 5;
        if (v <= 0) delete st.ego.slotAllocations[deductSlot.source];
        else st.ego.slotAllocations[deductSlot.source] = v;
      })}, "−5"));
    }
    table.appendChild(row);
  });
  frag.appendChild(table);
  // Add new skill suggester — surface common fields when applicable (book-style scaffolding)
  frag.appendChild(h("h2", null, "Add a new skill from surplus"));
  const newSkillBlock = h("div", {style:{display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap"}});
  const skillNames = Object.keys(RULEBOOK_DATA.skills);
  const selSkill = h("select", null,
    h("option", {value:""}, "(pick skill)"),
    ...skillNames.map(n => h("option", {value:n}, n))
  );
  const fieldSelect = h("select", {style:{minWidth:"160px"}});
  const fieldText = h("input", {type:"text", placeholder:"custom field", style:{maxWidth:"160px",display:"none"}});
  const updateFieldChooser = () => {
    fieldSelect.innerHTML = "";
    fieldText.style.display = "none";
    fieldText.value = "";
    const sk = selSkill.value;
    if (!sk) { fieldSelect.style.display = "none"; return; }
    const def = RULEBOOK_DATA.skills[sk];
    if (def && def.field) {
      fieldSelect.style.display = "inline-block";
      const opts = (def.commonFields || []).slice();
      const blank = document.createElement("option"); blank.value = ""; blank.textContent = def.freeForm ? "(any — type below)" : "(pick field)";
      fieldSelect.appendChild(blank);
      opts.forEach(f => { const o = document.createElement("option"); o.value = f; o.textContent = f; fieldSelect.appendChild(o); });
      const other = document.createElement("option"); other.value = "__other__"; other.textContent = "Other…";
      fieldSelect.appendChild(other);
    } else {
      fieldSelect.style.display = "none";
    }
  };
  selSkill.addEventListener("change", updateFieldChooser);
  fieldSelect.addEventListener("change", () => {
    if (fieldSelect.value === "__other__") fieldText.style.display = "inline-block";
    else fieldText.style.display = "none";
  });
  fieldSelect.style.display = "none";
  newSkillBlock.appendChild(selSkill);
  newSkillBlock.appendChild(fieldSelect);
  newSkillBlock.appendChild(fieldText);
  newSkillBlock.appendChild(h("button", {class:"btn secondary", onClick: () => {
    const sk = selSkill.value; if (!sk) return;
    const def = RULEBOOK_DATA.skills[sk];
    const isKnow = def && def.knowOnly;
    if (isKnow && fs.surplus.know < 5) { alert("Need 5+ know surplus."); return; }
    if (!isKnow && fs.surplus.active < 5) { alert("Need 5+ active surplus."); return; }
    let field = null;
    if (def && def.field) {
      if (fieldSelect.value === "__other__") field = fieldText.value.trim() || null;
      else field = fieldSelect.value || null;
      if (!field && !def.freeForm) { alert("Pick a field for " + sk + "."); return; }
    }
    // Find existing slot with same (skill, field) — if it exists, add to it; otherwise create a custom slot.
    dispatch(st => {
      const existingSlot = derived.allSlots().find(sl => sl.skill === sk && sl.field === field);
      if (existingSlot) {
        st.ego.slotAllocations[existingSlot.source] = (st.ego.slotAllocations[existingSlot.source] || 0) + 5;
      } else {
        st.ego.customSlotCounter = (st.ego.customSlotCounter || 0) + 1;
        const source = "custom." + st.ego.customSlotCounter;
        st.ego.customSlots.push({ source, skill: sk, field });
        st.ego.slotAllocations[source] = 5;
      }
    });
  }}, "+5"));
  frag.appendChild(newSkillBlock);
  return frag;
}

/* === Step 7: Languages === */
function step7Languages() {
  const frag = h("div");
  frag.appendChild(h("h1", null, "Step 7 — Languages"));
  frag.appendChild(h("p", {class:"lead"}, "You start with 2 languages free. If your COG + INT is 35+, add 1 more. If 45+, add 2 more."));
  const ds = derived.derivedStats();
  const cogInt = ds.apt.COG + ds.apt.INT;
  let allowed = 2;
  if (cogInt >= 45) allowed = 4;
  else if (cogInt >= 35) allowed = 3;
  frag.appendChild(h("div", {class:"why"}, "Your COG + INT = " + cogInt + " → " + allowed + " free languages."));
  const block = h("div", {style:{display:"flex",flexWrap:"wrap",gap:"4px",marginTop:"10px"}});
  RULEBOOK_DATA.languages.forEach(lang => {
    const sel = STATE.ego.languages.indexOf(lang) >= 0;
    block.appendChild(h("button", {class:"chip" + (sel ? " active" : ""), onClick: () => dispatch(s => {
      const i = s.ego.languages.indexOf(lang);
      if (i >= 0) s.ego.languages.splice(i,1);
      else if (s.ego.languages.length < allowed) s.ego.languages.push(lang);
    })}, lang));
  });
  frag.appendChild(block);
  // Custom add
  frag.appendChild(h("div", {style:{marginTop:"10px",display:"flex",gap:"6px",alignItems:"center"}},
    h("input", {type:"text", placeholder:"custom language…", style:{maxWidth:"200px"}, onKeyDown:(ev)=>{
      if (ev.key === "Enter" && ev.target.value.trim()) {
        dispatch(s => { if (s.ego.languages.length < allowed) s.ego.languages.push(ev.target.value.trim()); });
        ev.target.value = "";
      }
    }}),
    h("span", {class:"muted",style:{fontSize:"12px"}}, "press Enter to add")
  ));
  frag.appendChild(h("div", {style:{marginTop:"10px"}},
    h("button", {class:"btn ghost", onClick: () => dispatch(s => { s.ego.languagesDeferred = !s.ego.languagesDeferred; })},
      STATE.ego.languagesDeferred ? "✓ Deferred — decide in play" : "Skip & decide in play →")
  ));
  return frag;
}

        )
      )
    ));
  });
  frag.appendChild(h("div", {style:{marginTop:"10px"}},

      STATE.ego.repDeferred ? "✓ Deferred — decide in play" : "Skip & decide in play →")
  ));
  return frag;
}

Object.assign(STEP_RENDERERS, { 6: step6TotalSkills, 7: step7Languages, 8: step8Flex, 9: step9Rep });

        h("button", {disabled: lvl <= 0, onClick: () => dispatch(s => {

        })}, "−"),
        h("span", {class:"val"}, lvl ? "L" + lvl : "—"),
        h("button", {disabled: lvl >= maxLvl || cp.remaining < (nextCost||999), onClick: () => dispatch(s => {
          const i = s.ego.cp.positiveTraits.findIndex(b => b.id === t.id);
          if (i < 0) s.ego.cp.positiveTraits.push({id:t.id, level:1});
          else s.ego.cp.positiveTraits[i].level++;
        })}, "+")
      )
    ));
  });
  define.appendChild(h("h3", {style:{color:"var(--warn)"}}, "Negative traits (refund)"));
  Object.values(RULEBOOK_DATA.egoTraits.negative).forEach(t => {
    const bought = STATE.ego.cp.negativeTraits.find(b => b.id === t.id);
    const lvl = bought ? bought.level : 0;

    define.appendChild(h("div", {class:"line"},
      h("div", {class:"lbl"}, h("b", null, t.name), " — ", h("span", {class:"muted",style:{fontSize:"12px"}}, t.effect), h("span", {class:"cost",style:{color:"var(--warn)"}}, " [+" + t.bonus.join("/+") + " CP]")),
      h("div", {class:"ctrl"},
        h("button", {disabled: lvl <= 0, onClick: () => dispatch(s => {
          const i = s.ego.cp.negativeTraits.findIndex(b => b.id === t.id);
          if (i < 0) return;
          if (s.ego.cp.negativeTraits[i].level > 1) s.ego.cp.negativeTraits[i].level--;
          else s.ego.cp.negativeTraits.splice(i,1);
        })}, "−"),
        h("span", {class:"val"}, lvl ? "L" + lvl : "—"),
        h("button", {disabled: lvl >= maxLvl, onClick: () => dispatch(s => {
          const i = s.ego.cp.negativeTraits.findIndex(b => b.id === t.id);
          if (i < 0) s.ego.cp.negativeTraits.push({id:t.id, level:1});
          else s.ego.cp.negativeTraits[i].level++;
        })}, "+")
      )
    ));
    // Information-at-decision-time: the guided question is what makes a negative trait
    // *narratively load-bearing* — show it on the listing BEFORE commit so the player
    // chooses with eyes open. After commit, expand to a textarea for the actual answer.
    if (t.guidedQ) {
      const qid = "negtrait:" + t.id;
      if (lvl > 0) {
        define.appendChild(h("div", {class:"gq"},
          h("div", {class:"q"}, t.guidedQ),
          h("textarea", {placeholder:"…(skip if you like)", value: STATE.ego.narrative.backstoryAnswers[qid] || "",
            onChange: (ev) => dispatch(s => { s.ego.narrative.backstoryAnswers[qid] = ev.target.value; })})
        ));
      } else {
        // Preview hint — shown to ALL listings, not just bought ones
        define.appendChild(h("div", {style:{fontSize:"11px",color:"var(--narrative)",fontStyle:"italic",padding:"0 0 8px 8px",borderLeft:"2px dashed var(--narrative)",marginLeft:"2px"}},
          "if taken, you'll be asked: " + t.guidedQ
        ));
      }
    }

  frag.appendChild(define);

  return frag;
}

/* === Step 12: Morph + Gear === */
function step12Morph() {
  const frag = h("div");
  frag.appendChild(h("h1", null, "Step 12 — Morph & Gear"));
  const econ = derived.mpEconomy();
  frag.appendChild(h("p", {class:"lead"}, "Pick a starting morph. Default budget: 6 MP" + (econ.resourcesLvl ? " (+" + econ.resourcesLvl + " from Resources)" : "") + " = " + econ.budget + " MP."));
  frag.appendChild(h("div", {class:"why"}, "Each morph is a body — biological, synthetic, digital, or pod. Filter by what you can afford and what kind of work it does. Leftover MP becomes Flex at 2:1 (max 3 Flex)."));

  // v0.6: filter UX — the catalog grew to 43+ morphs (corebook canonical), so the
  // picker now categorizes, counts, sorts by cost ascending, and surfaces a live
  // affordability badge. Filter state lives in STATE.meta.morphFilter (default ALL).
  const currentFilter = STATE.meta.morphFilter || "ALL";
  const allMorphs = Object.values(RULEBOOK_DATA.morphs).filter(m => m.tier === "common" || STATE.meta.advancedMode);
  const categorize = (m) => {
    if (m.type === "infomorph") return "INFOMORPH";
    if (m.type === "pod") return "POD";
    if (m.subtype === "uplift") return "UPLIFT";
    if (m.subtype === "flexbot") return "FLEXBOT";
    if (m.type === "synthmorph") return "SYNTH";
    return "BIOMORPH";
  };
  const counts = { ALL: allMorphs.length };
  allMorphs.forEach(m => { const c = categorize(m); counts[c] = (counts[c] || 0) + 1; });
  const affordable = allMorphs.filter(m => m.cost <= econ.budget).length;

  // MP-budget status strip
  frag.appendChild(h("div", {style:{
    display:"flex", alignItems:"center", gap:"14px", flexWrap:"wrap",
    padding:"8px 14px", marginBottom:"10px",
    background:"linear-gradient(180deg, #0a242c 0%, #07181d 100%)",
    border:"1px solid var(--accent)", borderRadius:"2px",
    fontFamily:'"Share Tech Mono", ui-monospace, monospace',
    fontSize:"11px", letterSpacing:"1.6px", color:"rgba(220,235,238,0.85)"
  }},
    h("span", {style:{color:"#7fd4e2"}}, "// YOUR BUDGET:"),
    h("b", {style:{color:"#fff",fontSize:"14px"}}, econ.budget + " MP"),
    h("span", {style:{color:"rgba(220,235,238,0.4)"}}, "·"),
    h("span", null, "AFFORDABLE:"),
    h("b", {style:{color:"var(--good)",fontSize:"14px"}}, affordable + " / " + allMorphs.length + " MORPHS"),
    h("span", {style:{color:"rgba(220,235,238,0.4)"}}, "·"),
    h("span", {style:{color:"rgba(220,235,238,0.55)"}}, "sorted by cost ▾")
  ));

  // Category filter pills
  const filterRow = h("div", {style:{display:"flex",gap:"6px",flexWrap:"wrap",marginBottom:"12px",overflowX:"auto",paddingBottom:"2px"}});
  const categories = ["ALL", "BIOMORPH", "UPLIFT", "POD", "SYNTH", "FLEXBOT", "INFOMORPH"];
  categories.forEach(cat => {
    const active = currentFilter === cat;
    const n = counts[cat] || 0;
    if (cat !== "ALL" && n === 0) return;
    filterRow.appendChild(h("button", {
      style: {
        padding: "6px 12px",
        background: active ? "#1d8493" : "#0a242c",
        color: active ? "#06141a" : "rgba(220,235,238,0.85)",
        border: "1px solid " + (active ? "#7fd4e2" : "#1d8493"),
        borderRadius: "2px",
        fontFamily: '"Share Tech Mono", ui-monospace, monospace',
        fontSize: "11px", letterSpacing: "1.8px", fontWeight: 700,
        textTransform: "uppercase", cursor: "pointer", flex: "0 0 auto",
        boxShadow: active ? "0 0 12px rgba(127,212,226,0.35)" : "none"
      },
      onClick: () => dispatch(s => { s.meta.morphFilter = cat; })
    }, cat + " (" + n + ")"));
  });
  frag.appendChild(filterRow);

  // Filter + sort by cost ascending. Empty-state for filters with no matches.
  const filteredMorphs = currentFilter === "ALL" ? allMorphs : allMorphs.filter(m => categorize(m) === currentFilter);
  const sortedMorphs = [...filteredMorphs].sort((a, b) => a.cost - b.cost);

  const grid = h("div", {style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:"10px"}});
  if (sortedMorphs.length === 0) {
    grid.appendChild(h("div", {style:{padding:"20px",textAlign:"center",color:"rgba(220,235,238,0.5)",fontStyle:"italic"}}, "No morphs in this category. Try ALL or toggle advancedMode."));
  }
  sortedMorphs.forEach(m => {
    const overBudget = m.cost > econ.budget;
    const sel = STATE.morph.chosen === m.id;
    const card = h("div", {class: "morph-card" + (sel ? " selected" : "") + (overBudget ? " over-budget" : ""), onClick: () => dispatch(s => { s.morph.chosen = m.id; })});
    card.appendChild(h("div", {class:"head"},
      h("div", {class:"name"}, m.name),
      h("div", {class:"cost"}, m.cost + " MP")
    ));
    card.appendChild(h("div", {style:{fontSize:"11px",color:"var(--fg-3)"}}, m.type + (m.subtype ? " · " + m.subtype : "")));
    card.appendChild(h("div", {class:"stats"},
      h("div", null, "WT " + m.WT),
      h("div", null, "DUR " + m.DUR),
      h("div", null, "DR " + m.DR),
      h("div", null, m.vibes ? m.vibes.join(" · ") : "")
    ));
    card.appendChild(h("div", {class:"pools-mini"},
      "I" + m.pools.Insight + " · M" + m.pools.Moxie + " · V" + m.pools.Vigor + " · F" + m.pools.Flex
    ));
    card.appendChild(h("div", {style:{fontSize:"11px",color:"var(--fg-2)",fontStyle:"italic"}}, m.blurb));
    // Information-at-decision-time: surface body specifics on the card itself
    if (m.movement && m.movement !== "—") card.appendChild(h("div", {style:{fontSize:"11px",color:"var(--fg-3)"}}, "movement: " + m.movement));
    if (m.ware && m.ware.length) {
      const wareStr = m.ware.length > 5 ? m.ware.slice(0,5).join(", ") + " + " + (m.ware.length-5) + " more" : m.ware.join(", ");
      card.appendChild(h("div", {style:{fontSize:"11px",color:"var(--fg-3)"}}, "ware: " + wareStr));
    }
    if (m.traits && m.traits.length) {
      card.appendChild(h("div", {style:{fontSize:"11px",color:"var(--warn)"}},
        "traits: " + m.traits.map(t => t.name + (t.level ? " " + t.level : "")).join(", ")
      ));
    }
    // "For you" bullets
    const fy = [];
    if (m.cost <= econ.budget) fy.push("✓ fits budget");
    else fy.push("⚠ " + (m.cost - econ.budget) + " MP over budget");
    if (m.vibes) {
      const apt = derived.derivedStats().apt;
      if (m.vibes.includes("smart") && apt.COG >= 18) fy.push("synergy: high COG");
      if (m.vibes.includes("social") && apt.SAV >= 18) fy.push("synergy: high SAV");
      if (m.vibes.includes("combat") && apt.SOM >= 18) fy.push("synergy: high SOM");
    }
    card.appendChild(h("div", {class:"for-you"}, fy.join(" · ")));
    grid.appendChild(card);
  });
  frag.appendChild(grid);

  // MP economy
  if (STATE.morph.chosen) {
    const morph = RULEBOOK_DATA.morphs[STATE.morph.chosen];
    frag.appendChild(h("h2", null, "MP Economy"));
    frag.appendChild(h("div", {class:"bucket"},
      h("div", {class:"line"}, h("div", {class:"lbl"}, "Budget"), h("div", {class:"cost"}, econ.budget + " MP")),
      h("div", {class:"line"}, h("div", {class:"lbl"}, "Morph: " + morph.name), h("div", {class:"cost"}, "−" + morph.cost + " MP")),
      h("div", {class:"line"}, h("div", {class:"lbl"}, "Remaining"), h("div", {class:"cost"}, econ.remaining + " MP")),
      h("div", {class:"line"}, h("div", {class:"lbl"}, "→ Flex (2:1, max 3)"), h("div", {class:"cost"}, "+" + econ.flexFromMP + " temp Flex"))
    ));

    // Gear pack
    const career = STATE.ego.career ? RULEBOOK_DATA.careers[STATE.ego.career] : null;
    frag.appendChild(h("h2", null, "Gear Packs"));
    const camp = RULEBOOK_DATA.gearPacks.campaign[STATE.meta.campaignType];
    frag.appendChild(h("div", {class:"bucket"},
      h("div", {style:{marginBottom:"8px"}}, h("b", null, "Campaign: " + camp.name), " ", h("span", {class:"muted",style:{fontSize:"12px"}}, camp.description)),
      career ? h("div", null, h("b", null, "Career (" + career.name + "): "), h("span", {class:"muted",style:{fontSize:"12px"}}, RULEBOOK_DATA.gearPacks.profession[career.gearPackId] || "—")) : null,
      h("div", {class:"muted",style:{fontSize:"11px",marginTop:"6px"}}, "GM can swap items of equal complexity. Default: use as-is.")
    ));

    // Morph-relationship guiding question
    frag.appendChild(h("h2", null, "Your Body, Your Story"));
    const mtype = morph.type;
    const mq = QUESTIONS.morph[morph.subtype === "uplift" ? "uplift" : mtype] || QUESTIONS.morph.biomorph;
    frag.appendChild(gqBlock(mq, "morph"));
    // Relationship picker
    frag.appendChild(h("div", {class:"gq"},
      h("div", {class:"q"}, "Your relationship to this body:"),
      h("div", null, ...IDENTITY_OPTIONS.morphRelationship.map(opt =>
        h("button", {class:"chip" + (STATE.ego.narrative.identity.morphRelationship === opt ? " active" : ""),
          onClick: () => dispatch(s => { s.ego.narrative.identity.morphRelationship = opt; })}, opt)))
    ));
  }
  return frag;
}

/* === Step 13: Motivations === */
function step13Motivations() {
  const frag = h("div");
  frag.appendChild(h("h1", null, "Step 13 — Motivations"));
  frag.appendChild(h("p", {class:"lead"}, "Pick 3 motivations. First is auto-set from your faction; you can replace it. Use + (support) or − (oppose) prefix."));
  frag.appendChild(h("div", {class:"why"}, "Motivations drive Rez Point gain and help you cope with mental stress. They're short — a phrase, not an essay."));
  // Auto-suggest faction motivation
  if (STATE.ego.faction && RULEBOOK_DATA.factions[STATE.ego.faction]) {
    const factMot = "+" + RULEBOOK_DATA.factions[STATE.ego.faction].name + " Interests";
    if (!STATE.ego.motivations.includes(factMot)) {
      frag.appendChild(h("button", {class:"btn secondary",style:{marginBottom:"10px"}, onClick:() => dispatch(s => { s.ego.motivations.unshift(factMot); })}, "+ Add faction motivation: " + factMot));
    }
  }
  // Existing motivations
  STATE.ego.motivations.forEach((m, i) => {
    frag.appendChild(h("div", {class:"line",style:{padding:"6px 10px",background:"var(--bg-3)",border:"1px solid var(--border)",borderRadius:"var(--radius-sm)",marginBottom:"6px"}},
      h("input", {type:"text", value:m, style:{flex:"1",background:"transparent",border:"none"}, onChange: (ev) => dispatch(s => { s.ego.motivations[i] = ev.target.value; })}),
      h("button", {class:"btn ghost", onClick: () => dispatch(s => { s.ego.motivations.splice(i,1); })}, "remove")
    ));
  });
  // Add new
  if (STATE.ego.motivations.length < 5) {
    frag.appendChild(h("div", {style:{display:"flex",gap:"6px",alignItems:"center"}},
      h("input", {type:"text", placeholder:"+Motivation or −Motivation (Enter to add)", style:{flex:"1"}, onKeyDown:(ev)=>{
        if (ev.key === "Enter" && ev.target.value.trim()) {
          let v = ev.target.value.trim();
          if (!v.startsWith("+") && !v.startsWith("−") && !v.startsWith("-")) v = "+" + v;
          dispatch(s => { s.ego.motivations.push(v); });
          ev.target.value = "";
        }
      }})
    ));
  }
  // Suggestions
  frag.appendChild(h("h2", null, "Examples (click to add as +)"));
  const chips = h("div", null);
  RULEBOOK_DATA.motivationExamples.forEach(m => {
    chips.appendChild(h("button", {class:"chip", onClick: () => dispatch(s => { if (s.ego.motivations.length < 5) s.ego.motivations.push("+" + m); })}, m));
  });
  frag.appendChild(chips);

  // Final touches identity panel
  frag.appendChild(h("h2", null, "Final Touches — Identity"));
  frag.appendChild(h("p", {class:"muted",style:{fontSize:"13px"}}, "Optional. These never block finalization — they fill out the character for the table."));

  // The Fall
  frag.appendChild(h("div", {class:"gq"},
    h("div", {class:"q"}, "Where were you during the Fall? Who or what did you lose?"),
    h("textarea", {value: STATE.ego.narrative.identity.fallStory, onChange:(ev)=>dispatch(s=>{s.ego.narrative.identity.fallStory=ev.target.value;})})
  ));
  // Taboo
  frag.appendChild(h("div", {class:"gq"},
    h("div", {class:"q"}, "A line you won't cross. (Often the most useful note for actual play.)"),
    h("textarea", {value: STATE.ego.narrative.identity.taboo, onChange:(ev)=>dispatch(s=>{s.ego.narrative.identity.taboo=ev.target.value;})})
  ));
  // Memory gaps
  frag.appendChild(h("div", {class:"gq"},
    h("div", {class:"q"}, "Memory gaps or known forks of yourself elsewhere?"),
    h("textarea", {value: STATE.ego.narrative.identity.memoryGapsOrForks, onChange:(ev)=>dispatch(s=>{s.ego.narrative.identity.memoryGapsOrForks=ev.target.value;})})
  ));
  // Resleeve stance
  frag.appendChild(h("div", {class:"gq"},
    h("div", {class:"q"}, "Your resleeving stance:"),
    h("div", null, ...IDENTITY_OPTIONS.resleeveStance.map(opt =>
      h("button", {class:"chip" + (STATE.ego.narrative.identity.resleeveStance === opt ? " active" : ""),
        onClick: () => dispatch(s => { s.ego.narrative.identity.resleeveStance = opt; })}, opt)))
  ));
  // Quirks
  frag.appendChild(h("h2", null, "Quirks"));
  const q = STATE.ego.narrative.quirks;
  ["mannerism","catchphrase","style"].forEach(k => {
    const labels = {mannerism:"A mannerism (gesture, way of moving, tic)", catchphrase:"A catchphrase or verbal tic", style:"A style (clothing, carriage, signature look)"};
    frag.appendChild(h("div", {class:"gq"},
      h("div", {class:"q"}, labels[k]),
      h("input", {type:"text", value: q[k], style:{width:"100%"}, onChange:(ev)=>dispatch(s=>{s.ego.narrative.quirks[k]=ev.target.value;})})
    ));
  });

  // Connections (if party imports exist)
  if (STATE.partyImports.length) {
    frag.appendChild(h("h2", null, "Connections to other PCs"));
    frag.appendChild(h("p", {class:"muted",style:{fontSize:"13px"}}, "Is there a PC you have prior history with? Shared trauma, debt, hookup, rivalry, mentorship, fork-twin?"));
    STATE.partyImports.forEach(p => {
      const existing = STATE.ego.narrative.connections.find(c => c.withPcName === p.name);
      frag.appendChild(h("div", {class:"gq"},
        h("div", {class:"q"}, "With " + p.name + ":"),
        h("input", {type:"text", placeholder:"kind (history / debt / hookup / rivalry / mentorship)", value: existing ? existing.kind : "",
          onChange: (ev) => dispatch(s => {
            let c = s.ego.narrative.connections.find(c => c.withPcName === p.name);
            if (!c) { c = {withPcName:p.name, kind:"", text:""}; s.ego.narrative.connections.push(c); }
            c.kind = ev.target.value;
          })}),
        h("textarea", {placeholder:"describe the connection", value: existing ? existing.text : "",
          onChange: (ev) => dispatch(s => {
            let c = s.ego.narrative.connections.find(c => c.withPcName === p.name);
            if (!c) { c = {withPcName:p.name, kind:"", text:""}; s.ego.narrative.connections.push(c); }
            c.text = ev.target.value;
          })})
      ));
    });
  }

  frag.appendChild(h("div", {style:{marginTop:"10px"}},
    h("button", {class:"btn ghost", onClick: () => dispatch(s => { s.ego.motivationsDeferred = !s.ego.motivationsDeferred; })},
      STATE.ego.motivationsDeferred ? "✓ Deferred — decide in play" : "Skip motivations & decide in play →")
  ));

  return frag;
}

/* === Review === */
function stepReview() {
  const frag = h("div");
  frag.appendChild(h("h1", null, "Review"));
  const val = derived.validate();
  if (val.errors.length === 0) frag.appendChild(h("div", {class:"success-banner"}, "✓ Mechanically ready. " + (val.warns.length ? val.warns.length + " warnings — not blocking." : "")));
  else {
    val.errors.forEach(e => frag.appendChild(h("div", {class:"error-banner"}, "Step " + e.step + ": " + e.msg)));
  }
  val.warns.forEach(w => frag.appendChild(h("div", {class:"warn-banner"}, "Step " + w.step + ": " + w.msg)));
  if (val.promptsNarr.length) {
    frag.appendChild(h("h2", null, "Narrative prompts (optional)"));
    val.promptsNarr.forEach(p => frag.appendChild(h("div", {style:{padding:"8px 12px",background:"rgba(255,166,87,0.06)",borderLeft:"3px solid var(--narrative)",borderRadius:"0 var(--radius-sm) var(--radius-sm) 0",fontSize:"13px",margin:"6px 0",fontStyle:"italic",color:"var(--narrative)"}}, p)));
  }

  frag.appendChild(h("h2", null, "Export & Share"));
  frag.appendChild(h("div", {style:{display:"flex",gap:"6px",flexWrap:"wrap"}},
    h("button", {class:"btn", onClick: () => exportJSON()}, "Download JSON"),
    h("button", {class:"btn secondary", onClick: () => triggerImport(true)}, "Load Another PC (party member)")
  ));
  frag.appendChild(h("p", {class:"muted",style:{fontSize:"12px",marginTop:"8px"}}, "Share your JSON file with the GM. Load other players' files here to see party coverage and add connections."));

  return frag;
}

Object.assign(STEP_RENDERERS, { 10: step10CP, 11: step11Derived, 12: step12Morph, 13: step13Motivations, 14: stepReview });

/* =================================================================
   TOOLTIPS — pedagogical hover/tap explanations from RULEBOOK_REFERENCE.
   Event-delegated on document; reads data-tip="category.id" attributes.
   ================================================================= */
// Slugify identical to the gear-render path; keep in sync.
const _slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

function lookupTip(key) {
  if (!key) return null;
  const dot = key.indexOf(".");
  if (dot < 0) return RULEBOOK_REFERENCE[key] || null;
  const cat = key.slice(0, dot);
  const id = key.slice(dot + 1);
  const bucket = RULEBOOK_REFERENCE[cat];
  if (cat === "rep" && bucket && id) {
    const networkBlurb = bucket.networks && bucket.networks[id];
    if (networkBlurb) return {short:id + " — " + networkBlurb, used_for:bucket.used_for, page:bucket.page};
  }
  // Fallback for morphs: synthesize from RULEBOOK_DATA when not pre-curated
  if (cat === "morphs" && id) {
    const m = RULEBOOK_DATA.morphs && RULEBOOK_DATA.morphs[id];
    if (m) {
      const pageByType = {biomorph:54, synthmorph:58, pod:62, infomorph:67, flexbot:58};
      return {
        name: m.name,
        short: m.blurb || (m.name + " — " + m.type),
        used_for: "A " + m.type + ". Cost " + m.cost + " MP. Hover the type label, individual ware, or traits for mechanical details.",
        page: pageByType[m.type] || 54
      };
    }
  }
  // Lifepath crumb fallbacks: backgrounds / careers / interests / factions all
  // have blurbs + seeds already authored in RULEBOOK_DATA. Synthesize a
  // tooltip per hover with the seeds as the "tangible inspiration" line.
  const lifepathMap = {backgrounds:38, careers:40, interests:42, factions:46};
  if (lifepathMap[cat] && id) {
    const item = RULEBOOK_DATA[cat] && RULEBOOK_DATA[cat][id];
    if (item) {
      const catLabel = cat.replace(/s$/, "");
      const entry = {
        name: item.name,
        short: item.blurb || (item.name + " — " + catLabel),
        page: lifepathMap[cat]
      };
      if (item.seeds && item.seeds.length) entry.examples = "Seeds: " + item.seeds.join(" · ");
      if (item.repAffinity && item.repAffinity.length) entry.fieldContext = "Rep affinity: " + item.repAffinity.join(", ");
      if (item.requiresPsi) entry.note = "Advanced: requires the Psi trait.";
      return entry;
    }
  }
  // Direct hit
  if (bucket && bucket[id]) return bucket[id];
  // Cross-bucket fallback: gear-pack items may live in `ware` (Enhanced Vision,
  // Muscle Augmentation, Medichines) or `morph_traits` (Direction Sense as imp).
  // The data-tip uses slugified display name; ware/trait keys are Title Case.
  // Walk the other buckets, slugify each key, return first match.
  // v0.5.1: also fire the fallback for `cat === "ware"` and `cat === "morph_traits"`
  // — direct lookup fails on these because data-tip slugifies the display name
  // (e.g. "ware.access-jacks") but the data keys are Title Case ("Access Jacks"),
  // so we need the same slug-match walk to find them.
  if ((cat === "gear_items" || cat === "ware" || cat === "morph_traits") && id) {
    const ware = RULEBOOK_REFERENCE.ware;
    if (ware) for (const k of Object.keys(ware)) if (_slug(k) === id) return ware[k];
    const traits = RULEBOOK_REFERENCE.morph_traits;
    if (traits) for (const k of Object.keys(traits)) if (_slug(k) === id) return traits[k];
  }
  return null;
}

/* LEXICON_TERMS: regex patterns for cross-reference detection in tooltip
   text. Keys are lexicon slugs; values are RegExp that match the term in
   prose. Carefully bounded to avoid false positives ("Fall" requires "the
   Fall"; "stack" requires "cortical stack"; "fork" requires ego context). */
const LEXICON_TERMS = [
  ["fall", /\bthe Fall\b/g],
  ["mesh", /\b(?:the Mesh|Mesh)\b/g],
  ["resleeving", /\b(?:resleeving|resleeved|resleeve|resleeves)\b/gi],
  ["forking", /\b(?:forking|forked an ego|ego forks?)\b/gi],
  ["cortical-stack", /\bcortical stacks?\b/gi],
  ["pandora-gates", /\bPandora gates?\b/gi],
  ["firewall", /\bFirewall\b/g],
  ["rep-economy", /\brep economy\b/gi],
  ["tqz", /\b(?:TQZ|TITAN Quarantine Zone)\b/g],
  ["exsurgent-virus", /\bexsurgent(?: virus)?\b/gi],
  ["async", /\b(?:async|asyncs)\b/gi],
  ["egocasting", /\b(?:egocast|egocasting|egocasts|egocasted)\b/gi]
];

/* appendTextWithLexLinks: append text to a parent element, wrapping any
   matched lexicon term in a <span class="lex-link"> for visual signaling.
   Tooltip pointer-events:none means these are not clickable in hover mode;
   the Lexicon button in chrome is the canonical destination. */
function appendTextWithLexLinks(parent, text) {
  if (!text) return;
  if (typeof text !== "string") { parent.appendChild(document.createTextNode(String(text))); return; }
  const matches = [];
  for (const [slug, pattern] of LEXICON_TERMS) {
    pattern.lastIndex = 0;
    let m;
    while ((m = pattern.exec(text)) !== null) {
      matches.push({ start: m.index, end: m.index + m[0].length, slug, surface: m[0] });
      if (m.index === pattern.lastIndex) pattern.lastIndex++;
    }
  }
  matches.sort((a, b) => a.start - b.start);
  // Drop overlaps; keep earlier match
  const filtered = [];
  let lastEnd = -1;
  for (const m of matches) {
    if (m.start >= lastEnd) { filtered.push(m); lastEnd = m.end; }
  }
  let cursor = 0;
  for (const m of filtered) {
    if (m.start > cursor) parent.appendChild(document.createTextNode(text.slice(cursor, m.start)));
    const span = document.createElement("span");
    span.className = "lex-link";
    span.setAttribute("data-lex", m.slug);
    span.title = "See Lexicon for full setting context";
    span.textContent = m.surface;
    parent.appendChild(span);
    cursor = m.end;
  }
  if (cursor < text.length) parent.appendChild(document.createTextNode(text.slice(cursor)));
}

function renderTipBody(entry) {
  if (!entry) return null;
  const wrap = document.createDocumentFragment();
  const textField = (val, cls, prefix) => {
    if (!val) return;
    const el = document.createElement("div");
    el.className = cls;
    if (prefix) el.appendChild(document.createTextNode(prefix));
    appendTextWithLexLinks(el, val);
    wrap.appendChild(el);
  };
  if (entry.name) {
    const h = document.createElement("div");
    h.className = "tt-name";
    h.textContent = entry.name;
    wrap.appendChild(h);
  }
  textField(entry.short, "tt-short");
  textField(entry.formula, "tt-formula", "Formula: ");
  textField(entry.used_for, "tt-used");
  textField(entry.examples, "tt-examples");
  textField(entry.fieldContext, "tt-field-context");
  textField(entry.note, "tt-note");
  if (entry.aptitude) {
    const a = document.createElement("div");
    a.className = "tt-meta";
    a.textContent = "Linked: " + entry.aptitude + (entry.type ? "  ·  " + entry.type : "");
    wrap.appendChild(a);
  }
  if (entry.linked_skills && entry.linked_skills.length) {
    const ls = document.createElement("div");
    ls.className = "tt-meta";
    ls.textContent = "Linked skills: " + entry.linked_skills.join(", ");
    wrap.appendChild(ls);
  }
  if (entry.page) {
    const p = document.createElement("div");
    p.className = "tt-page";
    p.textContent = "book p" + entry.page;
    wrap.appendChild(p);
  }
  return wrap;
}

let tooltipEl = null;
let tooltipPinned = false;
function ensureTooltipEl() {
  if (tooltipEl) return tooltipEl;
  tooltipEl = document.createElement("div");
  tooltipEl.className = "tooltip";
  tooltipEl.setAttribute("role", "tooltip");
  tooltipEl.style.display = "none";
  document.body.appendChild(tooltipEl);
  return tooltipEl;
}
function positionTooltip(target) {
  const tt = ensureTooltipEl();
  const rect = target.getBoundingClientRect();
  const ttRect = tt.getBoundingClientRect();
  const margin = 8;
  let left = rect.left + (rect.width / 2) - (ttRect.width / 2);
  let top = rect.bottom + margin;
  if (top + ttRect.height > window.innerHeight - 8) {
    top = rect.top - ttRect.height - margin;
  }
  if (left < 8) left = 8;
  if (left + ttRect.width > window.innerWidth - 8) left = window.innerWidth - ttRect.width - 8;
  tt.style.left = left + "px";
  tt.style.top = (top + window.scrollY) + "px";
}
// Title-case overrides for keys that titleize poorly. The titleize function
// works for keys like "cortical-stack" or "Athletics" or "action_economy",
// but mp → "Mp" and tqz → "Tqz" are awkward. List the rare exceptions here.
const TIP_NAME_OVERRIDES = {
  "mp": "Morph Points",
  "mp.rules_notes": "Morph Points — rules notes",
  "rep": "Reputation",
  "mode": "Mode",
  "mode.chargen": "Chargen Mode",
  "mode.play": "Play Mode",
  "tests": "Tests & Rolls",
  "tests.basic": "Basic Test",
  "tests.criticals": "Critical Result",
  "tests.superior_results": "Superior Result (33/66)",
  "tests.defaulting": "Defaulting on a Skill",
  "tests.teamwork": "Teamwork",
  "tests.opposed": "Opposed Test",
  "combat.action_economy": "Action Economy",
  "combat.superior_results": "Superior Result (33/66)",
  "aptitudeCheck": "Aptitude Check",
  "motivations": "Motivations",
  "gear_avail_cost": "Gear Availability & Cost",
  "gear_avail_cost.availability": "Availability Rating",
  "gear_avail_cost.gp_cost": "Gear Cost (GP) Rating",
  "gear_avail_cost.restricted": "Restricted Gear",
  "gear_packs": "Gear Packs",
  "gear_packs.campaign": "Campaign Gear Pack",
  "gear_packs.career": "Career Gear Pack",
  "derivedStats.WT": "Wound Threshold",
  "derivedStats.DUR": "Durability",
  "derivedStats.DR": "Death Rating",
  "derivedStats.TT": "Trauma Threshold",
  "derivedStats.LUC": "Lucidity",
  "derivedStats.IR": "Insanity Rating",
  "derivedStats.InfectionRating": "Infection Rating",
  "rep.@-rep": "@-rep (Autonomist)",
  "rep.c-rep": "c-rep (CivicNet)",
  "rep.f-rep": "f-rep (Fame)",
  "rep.g-rep": "g-rep (Guanxi)",
  "rep.i-rep": "i-rep (The Eye)",
  "rep.r-rep": "r-rep (Research Network)",
  "rep.x-rep": "x-rep (ExploreNet)"
};

function titleizeKey(s) {
  if (!s) return null;
  return s
    .replace(/([a-z])([A-Z])/g, "$1 $2")  // camelCase → camel Case
    .split(/[-_\s]+/)
    .filter(w => w.length > 0)
    .map(w => /^[A-Z]{1,4}$/.test(w) ? w : w.charAt(0).toUpperCase() + w.slice(1))
    .join(" ");
}

function deriveTipName(key) {
  if (!key) return null;
  if (TIP_NAME_OVERRIDES[key]) return TIP_NAME_OVERRIDES[key];
  const dot = key.indexOf(".");
  const cat = dot >= 0 ? key.slice(0, dot) : key;
  const id = dot >= 0 ? key.slice(dot + 1) : null;
  if (id == null) return TIP_NAME_OVERRIDES[cat] || titleizeKey(cat);
  // For id-bearing keys, prefer the id (Athletics, Cortical Stack) since
  // the category is usually a grouping noun (skills, ware) not the subject.
  return titleizeKey(id);
}

function showTooltip(target) {
  const key = target.getAttribute("data-tip");
  let entry = lookupTip(key);
  // v0.8 — Defensive UX: when an entry is missing, render a visible "⚠ Data Gap"
  // tooltip rather than silently failing. Makes Lexicon-coverage gaps discoverable
  // during play instead of invisible. The bug-reporting URL lets users help fix.
  if (!entry) {
    entry = {
      name: "⚠ Data Gap",
      short: "No Lexicon entry exists for this yet. The slug is shown below — please file an issue with it so we can add the description.",
      used_for: "data-tip key: " + (key || "(empty)") + "\nFile at: https://github.com/Uploaded-Intelligence/eclipse-phase-2-chargen/issues",
      _missing: true
    };
  }
  // Field-aware decoration: for Know/Hardware/Medicine/Pilot/Exotic with a
  // picked field ("Know: Dance"), prepend a field header AND merge in setting
  // context + roleplay hooks from RULEBOOK_REFERENCE.know_fields when available.
  const field = target.getAttribute("data-tip-field");
  if (field && key && key.startsWith("skills.")) {
    const skillName = key.slice("skills.".length);
    const fieldSlug = field.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    const fieldEntry = skillName === "Know"
      && RULEBOOK_REFERENCE.know_fields
      && RULEBOOK_REFERENCE.know_fields[fieldSlug];
    if (fieldEntry) {
      // We have curated setting content for this Know field — lead with it.
      entry = {
        name: skillName + ": " + (fieldEntry.name || field),
        short: fieldEntry.setting || ("Your " + skillName + " skill specialized in " + field + "."),
        examples: fieldEntry.hooks || undefined,
        used_for: entry.used_for,  // keep the generic mechanical rules
        note: entry.note,
        aptitude: entry.aptitude,
        type: entry.type,
        page: fieldEntry.page || entry.page
      };
    } else if (skillName === "Know") {
      // Faction-fallback: 16 factions auto-generate "Know:<Faction>" at Step 4
      // but aren't in any "common" array, so they're not in know_fields.
      // Synthesize from RULEBOOK_DATA.factions when the field matches a faction.
      // Frames the skill as INSIDER KNOWLEDGE distinct from MEMBERSHIP.
      let factionMatch = null;
      const factions = RULEBOOK_DATA.factions || {};
      for (const fid of Object.keys(factions)) {
        const f = factions[fid];
        if (f.name === field || fid === fieldSlug) { factionMatch = f; break; }
      }
      if (factionMatch) {
        entry = {
          name: "Know: " + factionMatch.name,
          short: "Insider knowledge of the " + factionMatch.name + " faction — how they work, who runs what, what they believe, who hates whom, how to read their codes. Distinct from MEMBERSHIP: this is the analyst's grasp.",
          used_for: factionMatch.blurb,
          examples: "Roleplay angles: the ex-member who left over a principle; the outside analyst who studies " + factionMatch.name + " for a rival faction; the operator with informants on the inside.",
          fieldContext: factionMatch.repAffinity && factionMatch.repAffinity.length
            ? "Faction's rep networks: " + factionMatch.repAffinity.join(", ")
            : undefined,
          page: 46
        };
      } else {
        // True unknown — generic decoration.
        entry = Object.assign({}, entry, {
          name: skillName + ": " + field,
          short: "Your " + skillName + " skill specialized in " + field + ". " + (entry.short || ""),
          fieldContext: "The mechanical rules for " + skillName + " apply to this specialty. The field (" + field + ") is your character's narrative claim on what they know — recall, lore, scenes, contacts, and Complementary Skill bonuses all key off it."
        });
      }
    } else {
      // Non-Know field skill (Hardware/Medicine/Pilot/Exotic) without curated content.
      entry = Object.assign({}, entry, {
        name: skillName + ": " + field,
        short: "Your " + skillName + " skill specialized in " + field + ". " + (entry.short || ""),
        fieldContext: "The mechanical rules for " + skillName + " apply to this specialty. The field (" + field + ") is your character's narrative claim on what they know — recall, lore, scenes, contacts, and Complementary Skill bonuses all key off it."
      });
    }
  }
  // Final name synthesis: every tooltip gets a blue header. If decorations
  // already set entry.name (Know-field path, faction fallback, etc.), keep it.
  // Otherwise derive a Title Case name from the data-tip key.
  if (!entry.name) {
    const derived = deriveTipName(key);
    if (derived) entry = Object.assign({}, entry, { name: derived });
  }
  const tt = ensureTooltipEl();
  tt.innerHTML = "";
  // v0.8 — apply data-gap warn styling when entry was synthesized as a fallback
  tt.classList.toggle("tip-warn", !!entry._missing);
  const body = renderTipBody(entry);
  if (!body) return;
  tt.appendChild(body);
  tt.style.display = "block";
  tt.style.left = "-9999px";
  void tt.offsetWidth;
  positionTooltip(target);
}
function hideTooltip() {
  if (tooltipEl) tooltipEl.style.display = "none";
  tooltipPinned = false;
}
function setupTooltips() {
  // Hover-based for pointer devices
  document.addEventListener("mouseover", (ev) => {
    if (tooltipPinned) return;
    const el = ev.target.closest("[data-tip]");
    if (!el) { hideTooltip(); return; }
    showTooltip(el);
  });
  document.addEventListener("mouseout", (ev) => {
    if (tooltipPinned) return;
    const el = ev.target.closest("[data-tip]");
    if (!el) return;
    const to = ev.relatedTarget && ev.relatedTarget.closest && ev.relatedTarget.closest("[data-tip]");
    if (to === el) return;
    hideTooltip();
  });
  // Tap-based for touch devices: tap to pin, tap outside to dismiss
  document.addEventListener("click", (ev) => {
    const el = ev.target.closest("[data-tip]");
    if (el) {
      if (tooltipPinned && tooltipEl && tooltipEl.dataset.forKey === el.getAttribute("data-tip")) {
        hideTooltip(); return;
      }
      showTooltip(el);
      tooltipPinned = true;
      if (tooltipEl) tooltipEl.dataset.forKey = el.getAttribute("data-tip");
    } else if (tooltipPinned && !ev.target.closest(".tooltip")) {
      hideTooltip();
    }
  });
  // Esc to dismiss
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") {
      hideTooltip();
      if (STATE.meta.lexiconOpen) dispatch(s => { s.meta.lexiconOpen = false; });
    }
  });
  // Reposition on scroll/resize
  window.addEventListener("scroll", () => { if (tooltipEl && tooltipEl.style.display === "block") hideTooltip(); }, {passive:true});
}

/* =================================================================
   BOOT
   ================================================================= */
function boot() {
  loadFromLocalStorage();
  rerender();
  setupTooltips();
  window.addEventListener("resize", debounce(() => rerender(), 200));
  // v0.7 — handle inbound share URLs after first render
  try { handleShareHash(); } catch(e) { console.warn("share hash handler failed:", e); }
  try { handleLiveParam(); } catch(e) { console.warn("live param handler failed:", e); }
  try { handleTeamParam(); } catch(e) { console.warn("team param handler failed:", e); }
  // v0.10.4: install AFK input trackers once. Idempotent; safe across reloads
  // (event listeners are per-document, document is fresh on each load).
  try { _installInputTrackers(); } catch(e) { console.warn("input tracker install failed:", e); }
  // v0.10 Wave D: if already in a team room from localStorage, resume polling
  if (STATE.team && STATE.team.roomId) {
    try { startTeamRoomPolling(); } catch(e) { console.warn("team poll resume failed:", e); }
  }
}
boot();
</script>
