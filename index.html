function buildStepRail() {
  const e = STATE.ego;
  const isDone = (n) => {
    switch(n) {
      case 1: return !!e.background;
      case 2: return !!e.career;
      case 3: return !!e.interest;
      case 4: return !!e.faction || e.factionDeferred || e.factionless;
      case 5: return !!e.aptitudeTemplate;
      case 6: return !!e.aptitudeTemplate; // step 6 is reconciliation; "done" once apt template set
      case 7: return e.languages.length >= 2 || e.languagesDeferred;
      case 8: return true; // auto
      case 9: return Object.values(e.rep).some(v=>v>0) || e.repDeferred;
      case 10: return derived.cpRemaining().spent > 0;
      case 11: return !!e.aptitudeTemplate;
      case 12: return !!STATE.morph.chosen;
      case 13: return e.motivations.length >= 3 || e.motivationsDeferred;
      default: return false;
    }
  };
  const isDeferred = (n) => (n===4 && e.factionDeferred) || (n===7 && e.languagesDeferred) || (n===9 && e.repDeferred) || (n===13 && e.motivationsDeferred);
  const buttons = [];
  for (let i=1; i<=TOTAL_STEPS; i++) {
    const cls = (i === STATE.step ? "current" : (isDeferred(i) ? "deferred" : (isDone(i) ? "done" : "")));
    buttons.push(h("button", {class:cls, onClick: () => dispatch(s => { s.step = i; })}, i + ". " + STEP_TITLES[i]));
  }
  buttons.push(h("button", {class: STATE.step === 14 ? "current" : "", onClick: () => dispatch(s => { s.step = 14; })}, "Review"));
  return h("div", {class:"rail"}, ...buttons);
}

function buildLayout() {
  const layout = h("div", {class:"layout"});
  const colNarr = h("div", {class:"col col-narr"}, buildPreviewNarr());
  const colCenter = h("div", {class:"col col-center"}, buildStepView());
  const colMech = h("div", {class:"col col-mech"}, buildPreviewMech());

  // Tabbed preview for mobile / medium screens (hidden via CSS on wide)
  if (window.innerWidth < 1200) {
    const tabs = h("div", {class:"preview-tabs"},
      h("button", {class: STATE.meta.previewTab === "mech" ? "active" : "", onClick: () => dispatch(s => s.meta.previewTab = "mech")}, "Sheet"),
      h("button", {class: STATE.meta.previewTab === "narr" ? "active" : "", onClick: () => dispatch(s => s.meta.previewTab = "narr")}, "Story")
    );
    const previewWrap = h("div", {class:"col col-preview"}, tabs, STATE.meta.previewTab === "mech" ? (STATE.meta.mode === "play" ? buildPlaySheet() : buildPreviewMech()) : buildPreviewNarr());
    layout.appendChild(colCenter);
    layout.appendChild(previewWrap);
  } else {
    layout.appendChild(colNarr);
    layout.appendChild(colCenter);
    layout.appendChild(colMech);
  }
  return layout;
}

/* Vital Signs card — play-mode dashboard.
   Renders damage and stress as bar gauges with chip arrays (W1..Wn, T1..Tn)
   and book-true penalty banners. Both wounds AND traumas apply -10 per to all
   actions AND -1 per to initiative (book p220, p222).

   State convention: STATE.play.wounds and .stress are TOTAL damage / stress
   accumulated, NOT counts. Counts are derived: woundCount = floor(damage/WT). */
function buildVitalSignsCard(ds, ms) {
  const damage = STATE.play.wounds || 0;
  const stress = STATE.play.stress || 0;
  // v0.6: swarm morphs (Swarmanoid) take distributed damage — no discrete wounds.
  // WT is stored as 0 on swarmanoid; we use 1 as divisor sentinel and force woundCount/Cap = 0/1
  // so the wound math doesn't NaN and the wound penalty chain (×-10 each) is bypassed downstream.
  const isSwarm = !!(ms.morph && ms.morph.swarm);
  const WT = isSwarm ? 1 : (ms.morph.WT || 1);
  const DUR = ms.morph.DUR || 0;
  const DR  = ms.morph.DR  || 0;
  const TT  = ds.traumaThreshold || 1;
  const LUC = ds.lucidity || 0;
  const IR  = ds.insanityRating || 0;

  const woundCount   = isSwarm ? 0 : Math.floor(damage / WT);
  const traumaCount  = Math.floor(stress / TT);
  const woundCap     = isSwarm ? 1 : ((DUR > 0) ? Math.max(1, Math.floor(DUR / WT)) : 4);
  const traumaCap    = (LUC > 0) ? Math.max(1, Math.floor(LUC / TT)) : 4;

  const damageState = damage >= DR ? "danger" : (damage >= DUR ? "warn" : "");
  const stressState = stress >= IR ? "danger" : (stress >= LUC ? "warn" : "");

  const section = h("div", {class:"play-section"});
  section.appendChild(h("div", {class:"play-section-header"},
    h("span", {class:"ps-marker"}, "VITAL SIGNS"),
    h("span", {class:"ps-meta"}, "body · mind · book p220-222")
  ));
  const body = h("div", {class:"play-section-body"});

  // Damage gauge
  body.appendChild(h("div", {class:"play-gauge", "data-tip":"derivedStats.DUR"},
    h("span", {class:"play-gauge-label"}, "Damage"),
    h("div", {class:"play-gauge-controls"},
      h("button", {title:"-1 damage",
        onClick: () => dispatch(s => { s.play.wounds = Math.max(0, (s.play.wounds||0) - 1); })}, "−"),
      h("button", {title:"+1 damage",
        onClick: () => dispatch(s => { s.play.wounds = (s.play.wounds||0) + 1; })}, "+")
    ),
    h("div", {class:"play-gauge-track"},
      h("div", {class:"play-gauge-fill " + damageState,
        style:{width: Math.min(100, (damage / Math.max(1, DR)) * 100) + "%"}})),
    h("span", {class:"play-gauge-val"}, damage + " / " + DUR),
    h("span", {class:"play-gauge-secondary", "data-tip":"derivedStats.DR"}, "(DR " + DR + ")")
  ));

  // Wound chips
  const wChips = h("div", {class:"play-chip-array"});
  for (let i = 1; i <= woundCap; i++) {
    wChips.appendChild(h("span", {class:"pc" + (i <= woundCount ? " on" : "")}, "W" + i));
  }
  if (woundCount > woundCap) {
    wChips.appendChild(h("span", {class:"pc warn"}, "+" + (woundCount - woundCap) + " past down"));
  }
  body.appendChild(wChips);

  // Wound penalty banner
  if (woundCount > 0) {
    const cls = damage >= DUR ? "" : " warn";
    body.appendChild(h("div", {class:"play-penalty-banner" + cls},
      h("b", null, "⚠ " + woundCount + " wound" + (woundCount === 1 ? "" : "s")),
      " · " + (woundCount * 10) + " to all actions · −" + woundCount + " init" +
      (damage >= DR ? " · ⚰ DEAD" : (damage >= DUR ? " · MORPH DOWN" : ""))
    ));
  }

  // Stress gauge
  body.appendChild(h("div", {class:"play-gauge", style:{marginTop:"12px"}, "data-tip":"derivedStats.LUC"},
    h("span", {class:"play-gauge-label"}, "Stress"),
    h("div", {class:"play-gauge-controls"},
      h("button", {title:"-1 stress",
        onClick: () => dispatch(s => { s.play.stress = Math.max(0, (s.play.stress||0) - 1); })}, "−"),
      h("button", {title:"+1 stress",
        onClick: () => dispatch(s => { s.play.stress = (s.play.stress||0) + 1; })}, "+")
    ),
    h("div", {class:"play-gauge-track"},
      h("div", {class:"play-gauge-fill " + stressState,
        style:{width: Math.min(100, (stress / Math.max(1, IR)) * 100) + "%"}})),
    h("span", {class:"play-gauge-val"}, stress + " / " + LUC),
    h("span", {class:"play-gauge-secondary", "data-tip":"derivedStats.IR"}, "(IR " + IR + ")")
  ));

  // Trauma chips
  const tChips = h("div", {class:"play-chip-array"});
  for (let i = 1; i <= traumaCap; i++) {
    tChips.appendChild(h("span", {class:"pc" + (i <= traumaCount ? " on" : "")}, "T" + i));
  }
  if (traumaCount > traumaCap) {
    tChips.appendChild(h("span", {class:"pc warn"}, "+" + (traumaCount - traumaCap) + " past breakdown"));
  }
  body.appendChild(tChips);

  // Trauma penalty banner
  if (traumaCount > 0) {
    const cls = stress >= LUC ? "" : " warn";
    body.appendChild(h("div", {class:"play-penalty-banner" + cls},
      h("b", null, "⚠ " + traumaCount + " trauma" + (traumaCount === 1 ? "" : "s")),
      " · −" + (traumaCount * 10) + " to all actions · −" + traumaCount + " init" +
      (stress >= IR ? " · ⚠ PERMANENTLY INSANE" : (stress >= LUC ? " · MENTAL BREAKDOWN" : ""))
    ));
  }

  // Clear button
  body.appendChild(h("button", {class:"reset-pools", style:{marginTop:"12px"},
    onClick: () => dispatch(s => { s.play.wounds = 0; s.play.durability = 0; s.play.stress = 0; s.play.lucidity = 0; })},
    "↻ Clear damage + stress"));

  section.appendChild(body);
  return section;
}

/* =================================================================
   STUDIO BUILDERS  —  v0.3 living-character-sheet visual primitives.

   the h() helper. Each builder returns a DOM node. Mutations route
   through dispatch via the studio<X> wrappers defined earlier.

/* Module-level UI scratch state. NOT persisted — purely visual ephemera
   (per-section collapse flags, currently-displayed roll-flash entry).

/* ── Banner ─────────────────────────────────────────────────────

function buildStudioBanner({ color, title, icon, side, tabRight }) {

}

/* ── Section ────────────────────────────────────────────────────
   Banner + collapsible white panel. Collapse state lives in _studioUI.collapse[key].
   The whole header row is clickable to toggle. */
function buildStudioSection({ key, title, color, icon, kicker, tabRight, defaultOpen, panelStyle, action }, ...children) {
  const collapsed = _studioUI.collapse[key] === true || (_studioUI.collapse[key] == null && defaultOpen === false);
  const open = !collapsed;

  const headerBtn = h("button", {

  const chevronBtn = h("button", {

  }, _svg('<svg width="11" height="11" viewBox="0 0 10 10"><path d="M1 3l4 4 4-4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>'));

    headerBtn,

/* Helper: inject raw SVG markup as a child (for icons + chevrons). */
function _svg(svgText) {
  const wrap = document.createElement("span");
  wrap.style.display = "inline-flex";
  wrap.innerHTML = svgText;
  return wrap;
}

/* ── EditableText ───────────────────────────────────────────────
   Click-to-edit inline span. format='int' parses to int on blur (NaN→revert).
   Uses dispatch via the provided onCommit callback so the change persists. */
function buildStudioEditableText({ value, onCommit, format, multiline, placeholder, style, className }) {
  const display = (value === "" || value == null)
    ? (placeholder || "—")
    : String(value);
  const isPlaceholder = (value === "" || value == null);
  const span = h("span", {
    class: ((className || "") + " studio-editable").trim(),
    style: { ...(style||{}), ...(isPlaceholder ? { opacity: 0.4, fontStyle: "italic" } : {}) },
    title: onCommit ? "Click to edit" : null,
    onClick: (ev) => {
      if (!onCommit) return;
      ev.stopPropagation();
      const el = ev.currentTarget;
      el.classList.remove("studio-editable");
      el.classList.add("studio-editing");
      el.contentEditable = "true";
      // Replace placeholder with empty if currently showing placeholder.
      if (isPlaceholder) el.textContent = "";
      // Place caret at end.
      el.focus();
      try {
        const r = document.createRange();
        r.selectNodeContents(el);
        r.collapse(false);
        const s = window.getSelection();
        s.removeAllRanges(); s.addRange(r);
      } catch(e) {}
      const commit = () => {
        let raw = el.innerText || "";
        let next = raw;
        if (format === "int") {
          const n = parseInt(raw, 10);
          next = Number.isFinite(n) ? n : value;
        }
        el.contentEditable = "false";
        el.classList.remove("studio-editing");
        el.classList.add("studio-editable");
        if (next !== value) onCommit(next);
      };
      const onBlur = () => { commit(); el.removeEventListener("blur", onBlur); el.removeEventListener("keydown", onKey); };
      const onKey = (e) => {
        if (e.key === "Escape") {
          el.contentEditable = "false";
          el.classList.remove("studio-editing");
          el.classList.add("studio-editable");
          el.textContent = display;
          el.removeEventListener("blur", onBlur);
          el.removeEventListener("keydown", onKey);
          el.blur();
        } else if (!multiline && e.key === "Enter") {
          e.preventDefault();
          commit();
          el.removeEventListener("blur", onBlur);
          el.removeEventListener("keydown", onKey);
          el.blur();
        }
      };
      el.addEventListener("blur", onBlur);
      el.addEventListener("keydown", onKey);
    }
  }, display);
  return span;
}

    + '<g fill="' + inner + '" stroke="' + inner + '" stroke-width="0.6" stroke-linejoin="round">'
    + '<path d="M13 35 L15 12 L19 12 L18 35 Z"/>'
    + '<path d="M21 35 L22 8 L26 8 L25 35 Z"/>'
    + '<path d="M28 35 L30 10 L34 11 L32 35 Z"/>'
    + '<rect x="11" y="32" width="24" height="6" rx="1"/>'
    + '</g>'
    + close);
  if (k === "flex") return _svg(open
    + '<polygon points="24,2 46,24 24,46 2,24" fill="' + color + '"/>'
    + '<g fill="' + inner + '">'
    + '<path d="M24 11 L26 22 L37 24 L26 26 L24 37 L22 26 L11 24 L22 22 Z"/>'
    + '<circle cx="24" cy="24" r="1.8" fill="' + color + '"/>'
    + '</g>'
    + '<g fill="none" stroke="' + inner + '" stroke-width="1.8" stroke-linecap="round">'
    + '<path d="M16 14l2.5 2.5M32 14l-2.5 2.5M16 34l2.5-2.5M32 34l-2.5-2.5"/>'
    + '</g>'
    + close);
  return _svg(open + close);
}

/* ── PoolMeter — segmented sliding bar ──────────────────────────
   v0.10.5: opts.readOnly disables interaction (used by team-card render
   for FILE imports — the player owns their own pool state on /api/share).
   v0.10.8: restored Claude Design's iconography — watermark glyph at top-right,
   inline glyph at left of header, subtle tone-tinted background gradient.
   The gradient + border tinting use `tone + "10"` / `tone + "55"` literal
   string concatenation, which is why `tone` MUST be a literal hex (not a
   var() ref) — see v0.10.7 changelog for the failure mode. */
function buildStudioPoolMeter({ label, k, pool, tone, source, readOnly }) {
  const segs = Math.max(pool.max, 1);
  const remaining = Math.max(0, pool.max - pool.spent);
  const meter = h("div", {
    class: "studio-pool-meter" + (readOnly ? " studio-readonly" : ""),
    style: {
      color: tone,
      // tone+"10" = 6% alpha tone on top of paper → subtle tinted background
      // (only valid because tone is now a literal hex; see v0.10.7).
      background: "linear-gradient(180deg, " + tone + "10 0%, var(--st-paper) 60%)",
      // tone+"55" = 33% alpha outer border, softer than the full-saturation
      // border-left accent stripe.
      border: "1px solid " + tone + "55"
    },
    "data-tip": "pools." + (label[0].toUpperCase() + label.slice(1).toLowerCase())
  });
  // Watermark glyph — large faded silhouette anchored to the top-right.
  // Echoes the rulebook iconography quietly behind the data. The pool's
  // frame-shape (Insight circle, Moxie pentagon, Vigor hexagon, Flex diamond)
  // is recognisable even at 12% opacity. Per Claude Design's PoolMeter.
  meter.appendChild(h("div", {
    style: { position:"absolute", right:"-10px", top:"-6px", opacity:"0.12", color: tone, pointerEvents:"none" }
  }, buildStudioPoolGlyph(k, 64, tone)));
  // Header row — inline glyph (26px) + label/source block + remaining/max counter.
  meter.appendChild(h("div", { class: "studio-pool-head" },
    buildStudioPoolGlyph(k, 26, tone),
    h("div", { style: { flex: 1, minWidth: 0 } },
      h("div", { class: "studio-pool-label", style: { color: tone } }, label),
      h("div", { class: "studio-pool-source" }, source || "")
    ),
    h("div", { class: "studio-pool-val" },
      String(remaining),
      h("span", { class: "studio-pool-max" }, "/" + pool.max)
    )
  ));
  const segContainer = h("div", { class: "studio-pool-segs" });
  for (let i = 0; i < segs; i++) {
    const filled = i < remaining;
    const segProps = {
      class: "studio-pool-seg" + (filled ? " on" : ""),
      disabled: pool.max === 0 || readOnly,
      title: readOnly ? label + " " + remaining + "/" + pool.max : (filled ? "Spend 1 " + label : "Refund 1 " + label)
    };
    if (!readOnly) segProps.onClick = () => studioSpendPool(k, filled ? 1 : -1);
    segContainer.appendChild(h("button", segProps));
  }
  if (pool.max === 0) {
    segContainer.appendChild(h("span", { style:{fontSize:"10px",color:"var(--st-ink-mute)",alignSelf:"center",marginLeft:"6px"} }, "none"));
  }
  meter.appendChild(segContainer);
  return meter;
}

/* ── PoolRow — all 4 pools side-by-side ────────────────────────
   v0.10.5: opts.readOnly forwards to each PoolMeter. */
function buildStudioPoolRow(pc, opts) {
  opts = opts || {};
  const row = h("div", { style:{display:"grid",gridTemplateColumns:"repeat(4, 1fr)",gap:"10px"} });
  // v0.10.8: literal hex tones (not var() refs) so PoolMeter's `tone + "10"`
  // / `tone + "55"` alpha-concat patterns produce valid 8-digit hex. Hexes
  // here match the global `--insight` / `--moxie` / `--vigor` / `--flex`
  // CSS variables (line 30) exactly — same palette, just inlined to dodge
  // the var()+suffix token-merge bug documented in v0.10.7.
  const pools = [
    { label:"INSIGHT", k:"insight", tone:"#2563eb", source:"COG · INT" },
    { label:"MOXIE",   k:"moxie",   tone:"#9333ea", source:"SAV · WIL · REP" },
    { label:"VIGOR",   k:"vigor",   tone:"#dc2626", source:"REF · SOM" },
    { label:"FLEX",    k:"flex",    tone:"#0f9d58", source:"Ego Flex" }
  ];
  pools.forEach(p => row.appendChild(buildStudioPoolMeter({ ...p, pool: pc.pools[p.k], readOnly: opts.readOnly })));
  return row;
}

/* ── VitalityBar — generic engine for damage + mind tracks ─────
   v0.10.5: readOnly skips ± buttons and editable text — used by team-card
   render for FILE imports. The bar visual stays so live HP is at-a-glance. */
function buildStudioVitalityBar({ label, doneLabel, deadLabel, value, ticks, down, dead, tickLabel, tickTaken, setValue, setTicks, accent, dyingAccent, extra, dataTip, readOnly }) {
  const pct = Math.min(100, (value / Math.max(1, dead)) * 100);
  const downPct = (down / Math.max(1, dead)) * 100;
  const isDown = value >= down;
  // v0.10.7: tone must be a literal hex (not a `var(--st-X)` ref) because it's
  // concatenated with alpha suffixes ("cc", "55", "ee") below. CSS Custom
  // Properties Level 1 specifies var() substitution at the token level — the
  // substituted #RRGGBB token does NOT merge with an adjacent suffix string
  // into a single 8-digit hex. The token stream becomes `HASH IDENT`, which is
  // invalid as a color-stop, so the whole gradient is dropped. Was the cause
  // of two months of "HP visualisation broken" complaints — the damage bar's
  // fill never rendered. Mind bar always worked because it passes a literal
  // hex `#6b9eff` as accent.
  const tone = isDown ? "#c0392b" : (value >= down * 0.6 ? "#c97b25" : accent);

  const fillBg = isDown
    ? "linear-gradient(90deg, #c97b25cc 0%, #c97b25cc " + ((down/Math.max(1,value))*100) + "%, #c0392b " + (((down/Math.max(1,value))*100) + 1) + "%, #c0392bee 100%)"
    : "linear-gradient(90deg, " + tone + "cc, " + tone + ")";

  const wrap = h("div", { class: "studio-vbar" + (readOnly ? " studio-readonly" : ""), "data-tip": dataTip || null });

  // Header — value + ticks + extra slot
  const head = h("div", { class: "studio-vbar-head" });
  // Value block
  const valBlock = h("div");
  valBlock.appendChild(h("div", { class: "studio-vbar-mini-label" }, label));
  const valStack = h("div", { class: "studio-vbar-stack" });
  if (!readOnly) valStack.appendChild(h("button", { class: "studio-vbar-step", style:{color:tone}, onClick: () => setValue(value - 1) }, "−"));
  valStack.appendChild(readOnly
    ? h("span", { style: { fontSize:"36px",fontWeight:800,color:isDown?"var(--st-red)":"var(--st-ink)",lineHeight:1,fontFamily:'"Share Tech Mono", ui-monospace, monospace',fontVariantNumeric:"tabular-nums",minWidth:"50px",textAlign:"center",display:"inline-block"} }, String(value))
    : buildStudioEditableText({ value, format: "int", onCommit: (v) => setValue(v), style: { fontSize:"36px",fontWeight:800,color:isDown?"var(--st-red)":"var(--st-ink)",lineHeight:1,fontFamily:'"Share Tech Mono", ui-monospace, monospace',fontVariantNumeric:"tabular-nums",minWidth:"50px",textAlign:"center",display:"inline-block"} })
  );
  valStack.appendChild(h("span", { class: "studio-vbar-of" }, "/ " + dead));
  if (!readOnly) valStack.appendChild(h("button", { class: "studio-vbar-step", style:{color:tone}, onClick: () => setValue(value + 1) }, "+"));
  valBlock.appendChild(valStack);
  head.appendChild(valBlock);
  // Extra slot (e.g. Armor chip in damage bar)
  if (extra) head.appendChild(extra);
  // Ticks block
  const ticksBlock = h("div", { style:{textAlign:"right"} });
  ticksBlock.appendChild(h("div", { class: "studio-vbar-mini-label" }, tickLabel));
  const tickStack = h("div", { class: "studio-vbar-stack", style:{justifyContent:"flex-end"} });
  if (!readOnly) tickStack.appendChild(h("button", { class: "studio-vbar-step", style:{color:dyingAccent}, onClick: () => setTicks(ticks - 1) }, "−"));
  tickStack.appendChild(readOnly
    ? h("span", { style: { fontSize:"36px",fontWeight:800,color:ticks>0?dyingAccent:"var(--st-ink)",lineHeight:1,fontFamily:'"Share Tech Mono", ui-monospace, monospace',fontVariantNumeric:"tabular-nums",minWidth:"30px",textAlign:"center",display:"inline-block"} }, String(ticks))
    : buildStudioEditableText({ value: ticks, format: "int", onCommit: (v) => setTicks(v), style: { fontSize:"36px",fontWeight:800,color:ticks>0?dyingAccent:"var(--st-ink)",lineHeight:1,fontFamily:'"Share Tech Mono", ui-monospace, monospace',fontVariantNumeric:"tabular-nums",minWidth:"30px",textAlign:"center",display:"inline-block"} })
  );
  if (!readOnly) tickStack.appendChild(h("button", { class: "studio-vbar-step", style:{color:dyingAccent}, onClick: () => setTicks(ticks + 1) }, "+"));
  ticksBlock.appendChild(tickStack);
  head.appendChild(ticksBlock);
  wrap.appendChild(head);

  // Track + zones + markers
  const track = h("div", { class: "studio-vbar-track" });
  // Safe zone (operational) — covers danger stripes up to downPct
  track.appendChild(h("div", { class: "studio-vbar-track-safe", style:{width: downPct+"%"} }));
  // Fill
  track.appendChild(h("div", { class: "studio-vbar-fill", style: { width: pct+"%", background: fillBg, boxShadow: "inset 0 0 8px " + tone + "55" } }));
  // Tick markers (wound/trauma thresholds)
  const numTicks = Math.ceil(dead / Math.max(1, tickTaken));
  for (let i = 0; i < numTicks; i++) {
    const x = ((i + 1) * tickTaken) / dead * 100;
    if (x >= 100 || x >= downPct - 1) continue;
    const passed = value >= (i + 1) * tickTaken;
    const marker = h("div", { class: "studio-vbar-marker" + (passed ? " passed" : ""), style:{left:x+"%"} },
      h("span", { class: "studio-vbar-marker-label" }, tickLabel[0] + (i+1))
    );
    track.appendChild(marker);
  }
  // Down marker
  track.appendChild(h("div", { class: "studio-vbar-down-marker", style:{left:downPct+"%"} },
    h("span", { class: "studio-vbar-down-label", style:{left:(doneLabel.length > 4 ? -22 : -16) + "px"} }, doneLabel)
  ));
  // Dead marker
  track.appendChild(h("div", { class: "studio-vbar-dead-marker", title: deadLabel + " " + dead }));
  wrap.appendChild(track);

  // Footer
  wrap.appendChild(h("div", { class: "studio-vbar-foot" },
    h("span", null, h("b", { style:{color:accent} }, "0"), " · operational"),
    h("span", { style:{color:"var(--st-red)"} },
      h("b", null, String(down)), " " + doneLabel.toLowerCase() + " · ",
      h("b", null, String(dead)), " " + deadLabel.toLowerCase()
    )
  ));

  return wrap;
}

/* ── DamageBar — HP specialization + Armor chip + auto-warnings ──
   v0.10.5: opts.readOnly forwards to vitalityBar (hides ± controls);
   banner copy no longer says "Tick a wound" — auto-tick already happens. */
/* ── VbarSectionHead — major sub-section label for Vital Signs ──
   v0.10.10: replaces the v0.10.9 FeedBreak between damage and stress bars.
   The FeedBreak was sized for a quiet "channel switch" marker (dossier
   off-feed) — too small for what's actually a major Eclipse Phase system
   boundary. Now used as TWO parallel headers: MORPH above the damage bar
   (body · form · durability) and EGO above the stress bar (self · mind ·
   lucidity), echoing the EP2-canonical vocabulary the user is teaching
   themselves as a newbie GM. Visual: bold uppercase label in the section's
   accent colour, optional italic kicker, accent underline. */
function buildStudioVbarSectionHead({ label, kicker, accent }) {

function buildStudioDamageBar(pc, opts) {
  opts = opts || {};
  const dt = pc.damageTaken || 0;
  const wt = pc.derived.wound_threshold || 1;
  const dur = pc.derived.durability || 0;
  const dr = pc.derived.death_rating || 0;
  const woundCrossed = dt >= wt;
  const isDown = dt >= dur;
  const nearDeath = dt >= dr * 0.85;

  const armorChip = h("div", null,
    h("div", { class: "studio-vbar-mini-label", style:{marginBottom:"4px"} }, "ARMOR"),
    h("div", { style:{background:"var(--st-teal-soft)",border:"1.5px solid var(--st-teal)",borderRadius:"3px",padding:"6px 12px",display:"inline-flex",alignItems:"center",gap:"8px",boxShadow:"0 2px 6px rgba(0,0,0,0.15)"} },
      h("div", { style:{fontWeight:800,fontSize:"22px",color:"var(--st-ink)",fontFamily:'"Share Tech Mono", ui-monospace, monospace',fontVariantNumeric:"tabular-nums",lineHeight:1} },
        (pc.morph.armor?.energy ?? 0) + "/" + (pc.morph.armor?.kinetic ?? 0)
      ),
      h("div", { style:{fontSize:"8px",color:"var(--st-ink-mute)",letterSpacing:"0.5px",textAlign:"left",lineHeight:1.15,fontWeight:700} },
        "ENERGY", h("br"), "KINETIC"
      )
    )
  );

  const wrap = h("div");
  wrap.appendChild(buildStudioVitalityBar({
    label: "DAMAGE TAKEN", doneLabel: "DOWN", deadLabel: "DEAD",
    value: dt, ticks: pc.woundsTaken,
    tickLabel: "WOUNDS", tickTaken: wt, down: dur, dead: dr || 1,
    setValue: (v) => studioSetDamage(v),
    setTicks: (v) => studioSetWounds(v),
    // v0.10.7: literal hex (not var() refs) so `tone + "cc"` in buildStudioVitalityBar
    // produces a valid 8-digit hex. var()-with-suffix was the root cause of the
    // never-rendering green fill on the damage bar across the entire app.
    accent: "#3a9c64", dyingAccent: "#c0395a",
    extra: armorChip,
    dataTip: "derivedStats.DUR",
    readOnly: !!opts.readOnly
  }));
  // v0.10.9: ALWAYS append the warning slot — height is reserved via the
  // .studio-vbar-warning { min-height: 36px } CSS rule. When no warning
  // condition is active, render an empty placeholder (visibility:hidden via
  // --placeholder class) so the vitals embed height is identical across
  // every team-card. Was: conditional render → SMOKED's MORPH DOWN banner
  // shifted UNNA's/PUFT's aptitudes/coverage rows down by ~40px per banner.
  const showWarning = isDown || woundCrossed || pc.woundsTaken > 0;
  wrap.appendChild(h("div", {
    class: "studio-vbar-warning" + (isDown ? " dead" : "") + (showWarning ? "" : " studio-vbar-warning--placeholder"),
    "aria-hidden": showWarning ? null : "true"
  },
    showWarning && isDown ? h("span", null, "⚠ MORPH DOWN · INCAPACITATED · " + (nearDeath ? "DEATH IMMINENT" : "stabilize to revive")) : null,
    showWarning && !isDown && woundCrossed ? h("span", null, h("b", null, "DAMAGE ≥ WOUND THRESHOLD."), " // auto-ticked at WT.") : null,
    showWarning && pc.woundsTaken > 0 ? h("span", { style:{opacity:0.85} }, pc.woundsTaken + " wound" + (pc.woundsTaken > 1 ? "s" : "") + " · " + (pc.woundsTaken*-10) + " to all actions") : null
  ));
  return wrap;
}

/* ── MindBar — mental analogue, mirrors DamageBar exactly ──────
   v0.10.5: opts.readOnly forwards to vitalityBar; banner copy no longer
   says "Tick a trauma" — WIL check reminder stays. */
function buildStudioMindBar(pc, opts) {
  opts = opts || {};
  const st = pc.stressTaken || 0;
  const tt = pc.derived.trauma_threshold || 1;
  const luc = pc.derived.lucidity || 0;
  const ir = pc.derived.insanity_rating || 0;
  const traumaCrossed = st >= tt;
  const isBroken = st >= luc;
  const nearMeltdown = st >= ir * 0.85;

  const wrap = h("div");
  wrap.appendChild(buildStudioVitalityBar({
    label: "STRESS TAKEN", doneLabel: "BREAKDOWN", deadLabel: "INSANE",
    value: st, ticks: pc.traumasTaken,
    tickLabel: "TRAUMAS", tickTaken: tt, down: luc, dead: ir || 1,
    setValue: (v) => studioSetStress(v),
    setTicks: (v) => studioSetTraumas(v),
    accent: "#6b9eff", dyingAccent: "#9333ea",
    dataTip: "derivedStats.LUC",
    readOnly: !!opts.readOnly
  }));
  // v0.10.9: symmetric with DamageBar — always-rendered warning slot with
  // --placeholder class when no condition is active. Cross-card vitals
  // embed height stays consistent.
  const showMindWarning = isBroken || traumaCrossed || pc.traumasTaken > 0;
  wrap.appendChild(h("div", {
    class: "studio-vbar-warning stress" + (isBroken ? " dead" : "") + (showMindWarning ? "" : " studio-vbar-warning--placeholder"),
    "aria-hidden": showMindWarning ? null : "true"
  },
    showMindWarning && isBroken ? h("span", null, "⚠ MENTAL BREAKDOWN · CATATONIC 1d6 HRS · " + (nearMeltdown ? "EGO MELTDOWN IMMINENT" : "shock state")) : null,
    showMindWarning && !isBroken && traumaCrossed ? h("span", null, h("b", null, "STRESS ≥ TRAUMA THRESHOLD."), " // auto-ticked · WIL check vs disorientation.") : null,
    showMindWarning && pc.traumasTaken > 0 ? h("span", { style:{opacity:0.85} }, pc.traumasTaken + " trauma" + (pc.traumasTaken > 1 ? "s" : "") + " · " + (pc.traumasTaken*-10) + " to actions · −" + pc.traumasTaken + " init") : null
  ));
  return wrap;
}

/* ── RollFlash — full-screen result modal ─────────────────────── */
function buildStudioRollFlash(entry) {

    )

    (entry.text || "") + (entry.modifier ? (" · mod " + (entry.modifier > 0 ? "+" : "") + entry.modifier) : "")
  ));
  body.appendChild(h("div", { style:{display:"flex",alignItems:"baseline",gap:"12px"} },

/* Wrap studioRollSkill/Aptitude to also surface the RollFlash modal. */
const _baseRollSkill = studioRollSkill;
studioRollSkill = function(skillName, modifier) {

const _baseRollAptitude = studioRollAptitude;

/* =================================================================
   STUDIO COMPOSITION  —  Wave 3. Each builder takes the studioPcFromState
   projection and returns the corresponding DOM tree. They preserve data-tip
   attributes so the tooltip pedagogy keeps firing on every element.
   ================================================================= */

/* ── SkillRow — click whole row to roll; inner editables stop propagation ── */
/* C3 — Auto-modifier from play.woundsTaken / traumasTaken / statuses.
   Same math as buildStudioTurnCoach uses; broken out so regular skill-row
   clicks also pick it up. In chargen mode these fields are all 0 so the
   modifier is 0 — no special-case needed for non-play. */
function _studioAutoModifier() {
  const woundPen = (STATE.play.woundsTaken || 0) * -10;
  const traumaPen = (STATE.play.traumasTaken || 0) * -10;
  const statusPen = (STATE.play.statuses || []).reduce((s, st) => s + (st.modifier || 0), 0);
  return woundPen + traumaPen + statusPen;
}

function buildStudioSkillRow(skill) {
  const apt = skill.aptitude;
  const aptTone = (EP2.APTITUDES[apt] && EP2.APTITUDES[apt].tone) || "var(--st-teal)";
  // Detect Know:X / Medicine:X for field-aware tooltip
  const colonIdx = skill.name.indexOf(":");
  const skillRoot = colonIdx > 0 ? skill.name.slice(0, colonIdx).trim() : skill.name;
  const skillField = colonIdx > 0 ? skill.name.slice(colonIdx + 1).trim() : null;
  const tipKey = "skills." + skillRoot;
  const row = h("button", {
    class: "studio-skill-row",
    "data-tip": tipKey,
    "data-tip-field": skillField,
    onClick: (ev) => {
      // Skip roll if click came from an editable child
      if (ev.target && ev.target.classList && ev.target.classList.contains("studio-editing")) return;
      // C3: thread the wound/trauma/status auto-modifier into row clicks too.
      studioRollSkill(skill.name, _studioAutoModifier());
    }
  });
  row.appendChild(buildStudioAptitudeChip(apt));
  row.appendChild(h("span", { class: "studio-skill-name", onClick:(e)=>e.stopPropagation() }, skill.name));
  row.appendChild(h("span", { class: "studio-skill-total", onClick:(e)=>e.stopPropagation() }, String(skill.total)));
  // Mini-bar visualizes skill % up to 100
  row.appendChild(h("span", { class: "studio-skill-bar" },
    h("span", { class: "studio-skill-bar-fill", style:{ width: Math.min(100, skill.total) + "%", background: aptTone } })
  ));
  row.appendChild(h("span", { class: "studio-skill-dice", title:"Roll d100 vs " + skill.total },
    _svg('<svg width="12" height="12" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="5.5" cy="5.5" r="1" fill="currentColor"/><circle cx="10.5" cy="5.5" r="1" fill="currentColor"/><circle cx="8" cy="8" r="1" fill="currentColor"/><circle cx="5.5" cy="10.5" r="1" fill="currentColor"/><circle cx="10.5" cy="10.5" r="1" fill="currentColor"/></svg>')
  ));
  return row;
}

/* ── v0.8 Gear Guide — loadout brief + GP/Complexity primer + fabrication detection.
   Makes the existing GP/Complexity Lexicon content discoverable in context.
   Detects whether the character carries a fabber/tool kit; surfaces what they can craft. ── */
function characterHasFabber(pc) {
  if (!pc || !Array.isArray(pc.gear)) return null;
  for (const g of pc.gear) {
    const n = (g.name || "").toLowerCase();
    if (/fabber/.test(n)) {
      if (/medium/.test(n)) return "medium";
      if (/large/.test(n)) return "large";
      if (/compact|small/.test(n)) return "compact";
      return "fabber";
    }
  }
  return null;
}

function buildStudioGearGuide(pc) {
  // Categorize gear by lexical pattern on names. Imperfect but useful at a glance.
  const cats = { Weapons:[], Armor:[], Implants:[], Apps:[], Tools:[], Misc:[] };
  (pc.gear || []).forEach(g => {
    const name = (g.name || "").toLowerCase();
    if (g.weapon) cats.Weapons.push(g);
    else if (/armor|vest|helmet|carapace/i.test(name)) cats.Armor.push(g);
    else if (/implant|claws|eelware|biomod|cortical|cyberbrain|mesh insert|mnemonics/i.test(name)) cats.Implants.push(g);
    else if (/app$|tacnet|vpn|sniffer|tracker|virus/i.test(name)) cats.Apps.push(g);
    else if (/kit|fabber|tool|cable|repair/i.test(name)) cats.Tools.push(g);
    else cats.Misc.push(g);

  const fab = characterHasFabber(pc);
  const fabHasToolKit = (pc.gear || []).some(g => /tool kit/i.test(g.name || ""));

  const wrap = h("div", { class:"studio-section", style:{marginTop:"14px",padding:"14px",background:"linear-gradient(180deg, #0a242c 0%, #07181d 100%)",border:"1px solid var(--accent)",borderRadius:"3px",color:"rgba(220,235,238,0.9)",fontFamily:"var(--font)"} });
  wrap.appendChild(h("div", { style:{fontFamily:'"Share Tech Mono", ui-monospace, monospace',fontSize:"11px",letterSpacing:"1.8px",color:"var(--accent-2)",fontWeight:800,textTransform:"uppercase",marginBottom:"10px"} }, "▾ Gear Guide · Loadout · GP · Fabrication"));

      h("div", { style:{fontSize:"11px",color:"rgba(220,235,238,0.7)",lineHeight:1.5} }, items.slice(0,4).map(g => g.name).join(", ") + (items.length > 4 ? ", +" + (items.length - 4) + " more" : ""))
    ));
  });
  wrap.appendChild(loadoutGrid);

  // GP & Complexity primer
  wrap.appendChild(h("div", { style:{paddingTop:"10px",borderTop:"1px dashed rgba(127,212,226,0.2)",marginBottom:"10px"} },
    h("div", { style:{fontFamily:"var(--mono)",fontSize:"9.5px",letterSpacing:"1.4px",color:"rgba(220,235,238,0.7)",fontWeight:800,textTransform:"uppercase",marginBottom:"4px"} }, "▸ Gear Points (GP) · Complexity", h("span", { "data-tip":"gear_avail_cost", style:{cursor:"help",color:"var(--accent-2)",marginLeft:"6px",fontSize:"11px"} }, "ⓘ")),
    h("div", { style:{fontSize:"11.5px",color:"rgba(220,235,238,0.78)",lineHeight:1.55} },
      "Every gear item has Complexity / GP ratings (",
      h("code", { style:{color:"var(--accent-2)",fontFamily:"var(--mono)",fontSize:"10.5px"} }, "Min/1"),
      ", ",
      h("code", { style:{color:"var(--accent-2)",fontFamily:"var(--mono)",fontSize:"10.5px"} }, "Mod/R/2"),
      ", etc.). Complexity = how hard to find or fabricate. GP = how much of your starting Gear Points it costs. Starting GP is set by your career & morph pack. ",
      h("em", { style:{color:"var(--st-ink-mute)"} }, "v0.9 will add live GP budget customization at chargen.")
    )
  ));

  // Fabrication panel
  const fabPanel = h("div", { style:{paddingTop:"10px",borderTop:"1px dashed rgba(127,212,226,0.2)"} });
  fabPanel.appendChild(h("div", { style:{fontFamily:"var(--mono)",fontSize:"9.5px",letterSpacing:"1.4px",fontWeight:800,textTransform:"uppercase",marginBottom:"6px",color:fab||fabHasToolKit ? "var(--good)" : "var(--warn)"} },
    fab ? "✓ Fabrication available · " + fab + " fabber detected"
    : fabHasToolKit ? "≈ Limited fab · tool kit only (no full nanofabber)"
    : "✗ No fab capability · pick up a Medium Fabber (Mod/1) for in-play crafting"
  ));
  fabPanel.appendChild(h("div", { style:{fontSize:"11.5px",color:"rgba(220,235,238,0.78)",lineHeight:1.55} },
    fab
      ? "Spend in-session time to craft from blueprints. " +
        (fab === "compact" ? "Compact fabber: items up to ~10cm; Min complexity only (apps, simple tools)."
        : fab === "medium" ? "Medium fabber: most weapons, armor, gear (Min + Mod complexity). 1 GP-equivalent per craft."
        : fab === "large" ? "Large fabber: implants, morph parts, vehicles (Maj complexity, hours-to-days). Requires blueprint and raw materials."

/* ── v0.9 The Mesh — onboarding section for EP2's biggest subsystem.
   Surfaces what's already in STATE (gear, ware, skills, muse) as a legible
   page about MESH access, OPSEC, hacking dice, apps, and common actions.
   No new state, no schema change — pure projection layer. ── */

function _wareNames(pc) {
  // studioPcFromState wraps ware as {name}; raw morph data has strings.
  // Tests use either shape. Normalize both.
  const ware = (pc && pc.morph && pc.morph.ware) || [];
  return ware.map(w => typeof w === "string" ? w : ((w && w.name) || "")).filter(Boolean);
}

function studioMeshAccess(pc) {
  const wareJoined = _wareNames(pc).join("|").toLowerCase();
  if (/ghostrider/.test(wareJoined)) return "ghostrider";
  if (/basic mesh inserts/.test(wareJoined)) return "basic-mesh-inserts";
  if (/mesh inserts/.test(wareJoined)) return "mesh-inserts";
  const gearHas = ((pc && pc.gear) || []).some(g => /\becto\b/i.test(g.name || ""));
  if (gearHas) return "ecto";
  return "none";
}

function studioMeshOpsec(pc) {
  const gear = (pc && pc.gear) || [];
  const hasAnon = gear.some(g => /anonymizer/i.test(g.name || ""));
  const hasVPN  = gear.some(g => /\bvpn\b/i.test(g.name || ""));
  const hasFakeID = gear.some(g => /fake.?(ego.?)?id/i.test(g.name || ""));
  const score = [hasAnon, hasVPN, hasFakeID].filter(Boolean).length;
  return {
    level: score >= 3 ? "GOOD" : score >= 1 ? "FAIR" : "POOR",
    hasAnon, hasVPN, hasFakeID, score
  };
}

function studioMeshApps(pc) {
  const APP_PATTERNS = [
    {key:"anonymizer",   regex:/anonymizer/i},
    {key:"vpn-app",      regex:/\bvpn(\s|-)?app/i},
    {key:"fake-ego-id",  regex:/fake.?(ego.?)?id/i},
    {key:"tacnet-app",   regex:/tacnet/i},
    {key:"sniffer-app",  regex:/sniffer/i},
    {key:"tracker-app",  regex:/tracker(\s|-)?app/i},
    {key:"exploit",      regex:/\bexploit\b/i},
    {key:"scout",        regex:/\bscout\s*(app)?\b/i},
    {key:"firewall-app", regex:/firewall(\s|-)?app/i}
  ];
  const results = [];
  const seen = new Set();
  ((pc && pc.gear) || []).forEach(g => {
    const name = g.name || "";
    for (const p of APP_PATTERNS) {
      if (p.regex.test(name) && !seen.has(p.key)) {
        seen.add(p.key);
        const ref = (RULEBOOK_REFERENCE.gear_items || {})[p.key];
        results.push({
          name: g.name,
          key: p.key,
          tipKey: "gear_items." + p.key,
          summary: (ref && (ref.used_for || ref.short)) || ""
        });
        return;
      }
    }
  });
  return results;
}

function studioMeshImplants(pc) {
  const ware = _wareNames(pc);
  const detect = [
    {pat:/basic mesh inserts/i, key:"basic-mesh-inserts", status:"ok",   summary:"default mesh access (every standard biomorph)"},
    {pat:/mnemonics/i,          key:"mnemonics",          status:"ok",   summary:"perfect recall — replay any moment in detail"},
    {pat:/ghostrider/i,         key:"ghostrider-module",  status:"ok",   summary:"can host a secondary ego or backup"},
    {pat:/access jacks/i,       key:"access-jacks",       status:"ok",   summary:"wired-mesh option (bypasses wireless attacks)"},
    {pat:/puppet sock/i,        key:"puppet-sock",        status:"warn", summary:"ego can be controlled via mesh — common synth flag"},
    {pat:/cyberbrain/i,         key:"cyberbrain",         status:"warn", summary:"brain is a hackable computer (synth + pod morphs)"},
    {pat:/enhanced security/i,  key:"enhanced-security",  status:"ok",   summary:"+20 Infosec defending vs intrusion (infomorph kit)"},
    {pat:/sniffer app/i,        key:"sniffer-app",        status:"ok",   summary:"+10 Interface for intercepting mesh traffic"},
    {pat:/tracker app/i,        key:"tracker-app",        status:"ok",   summary:"follow targets across the mesh"},
    {pat:/radio booster/i,      key:"radio-booster",      status:"ok",   summary:"extended mesh range — useful in fringe habs"},
    {pat:/e-?veil/i,            key:"e-veil",             status:"ok",   summary:"obscures mesh signature — running silent"},
    {pat:/copylock/i,           key:"copylock",           status:"warn", summary:"prevents your ego from being copied/forked"},
    {pat:/memory lock/i,        key:"memory-lock",        status:"warn", summary:"hides specific memories from mesh inspection"}
  ];
  // Special case: standard "Mesh Inserts" entry that isn't "basic"
  const hasFull = ware.some(w => /mesh inserts/i.test(w) && !/basic/i.test(w));
  const hasBasic = ware.some(w => /basic mesh inserts/i.test(w));
  const seen = new Set();
  const out = [];
  if (hasFull && !hasBasic) {
    out.push({key:"mesh-inserts", status:"ok", summary:"full mesh access + AR + muse hosting"});
    seen.add("mesh-inserts");
  }
  for (const w of ware) {
    for (const d of detect) {
      if (d.pat.test(w) && !seen.has(d.key)) {
        seen.add(d.key);
        out.push({key:d.key, status:d.status, summary:d.summary, source:w});
        break;
      }
    }
  }
  return out;
}

function _meshAccessLabel(code) {
  return ({
    "mesh-inserts":       "Mesh Inserts (full)",
    "basic-mesh-inserts": "Basic Mesh Inserts",
    "ghostrider":         "Ghostrider Module",
    "ecto":               "Ecto (handheld)",
    "none":               "Offline (no mesh access)"
  })[code] || code;
}

function _meshAccessTip(code) {
  return ({
    "mesh-inserts":       "ware.mesh-inserts",
    "basic-mesh-inserts": "ware.basic-mesh-inserts",
    "ghostrider":         "ware.ghostrider-module",
    "ecto":               "lexicon.ecto",
    "none":               "lexicon.mesh"
  })[code] || "lexicon.mesh";
}

function buildStudioMesh(pc) {
  const access = studioMeshAccess(pc);
  const opsec = studioMeshOpsec(pc);
  const apps = studioMeshApps(pc);
  const implants = studioMeshImplants(pc);
  // studioPcFromState produces pc.skills entries with `.total` (not `.value`).
  // Also handle "Program:<field>" — Program is keyed without a field, but the
  // skill display name may carry one. Match by skill prefix.
  const findSkill = (name) => {
    const list = ((pc && pc.skills) || []);
    const exact = list.find(sk => sk.name === name);
    if (exact) return exact.total || exact.value || 0;
    const prefix = list.find(sk => sk.name && sk.name.split(":")[0] === name);
    return prefix ? (prefix.total || prefix.value || 0) : 0;
  };
  const infosec = findSkill("Infosec");
  const iface   = findSkill("Interface");
  const program = findSkill("Program");
  const cog = (pc && pc.aptitudes && (pc.aptitudes.COG || pc.aptitudes.cog)) || 0;
  const museName = (pc && pc.muse) || "(unnamed muse)";

  // OPSEC tone
  const opsecTone = opsec.level === "GOOD" ? "var(--good, #6dd49f)"
                  : opsec.level === "FAIR" ? "var(--warn, #e8b75a)"
                  :                          "var(--st-red, #d96b6b)";
  const opsecBg   = opsec.level === "GOOD" ? "rgba(109,212,159,0.12)"
                  : opsec.level === "FAIR" ? "rgba(232,183,90,0.12)"
                  :                          "rgba(217,107,107,0.12)";

  const wrap = h("div", { class:"studio-section studio-mesh", style:{marginTop:"14px",padding:"14px",background:"linear-gradient(180deg, #0a242c 0%, #07181d 100%)",border:"1px solid var(--accent)",borderRadius:"3px",color:"rgba(220,235,238,0.9)",fontFamily:"var(--font)"} });
  wrap.appendChild(h("div", { style:{fontFamily:'"Share Tech Mono", ui-monospace, monospace',fontSize:"11px",letterSpacing:"1.8px",color:"var(--accent-2)",fontWeight:800,textTransform:"uppercase",marginBottom:"10px"} },
    "▾ Mesh Status · LIVE ",
    h("span", { "data-tip":"lexicon.mesh", style:{cursor:"help",color:"var(--accent-2)",marginLeft:"6px",fontSize:"11px",opacity:0.7} }, "ⓘ")
  ));

  // ── B1. Header strip: Mesh Access · OPSEC · Muse ──
  const headerStrip = h("div", { style:{display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(160px, 1fr))",gap:"8px",marginBottom:"12px"} });
  // Access chip
  headerStrip.appendChild(h("div", { "data-tip": _meshAccessTip(access), style:{padding:"8px 10px",background:"rgba(0,0,0,0.25)",border:"1px solid rgba(127,212,226,0.25)",borderRadius:"2px",cursor:"help"} },
    h("div", { style:{fontFamily:"var(--mono)",fontSize:"9.5px",letterSpacing:"1.4px",color:"var(--accent-2)",fontWeight:800,textTransform:"uppercase",marginBottom:"4px"} }, "▸ Mesh Access"),
    h("div", { style:{fontSize:"12px",color:"rgba(220,235,238,0.92)",fontWeight:600,lineHeight:1.3} }, _meshAccessLabel(access))
  ));
  // OPSEC chip
  headerStrip.appendChild(h("div", { "data-tip":"lexicon.opsec", style:{padding:"8px 10px",background:opsecBg,border:"1px solid "+opsecTone,borderRadius:"2px",cursor:"help"} },
    h("div", { style:{fontFamily:"var(--mono)",fontSize:"9.5px",letterSpacing:"1.4px",color:opsecTone,fontWeight:800,textTransform:"uppercase",marginBottom:"4px"} }, "▸ OPSEC"),
    h("div", { style:{fontSize:"14px",color:opsecTone,fontWeight:800,lineHeight:1.2,letterSpacing:"0.5px"} }, opsec.level)
  ));
  // Muse chip
  headerStrip.appendChild(h("div", { "data-tip":"lexicon.muse", style:{padding:"8px 10px",background:"rgba(0,0,0,0.25)",border:"1px solid rgba(127,212,226,0.25)",borderRadius:"2px",cursor:"help"} },
    h("div", { style:{fontFamily:"var(--mono)",fontSize:"9.5px",letterSpacing:"1.4px",color:"var(--accent-2)",fontWeight:800,textTransform:"uppercase",marginBottom:"4px"} }, "▸ Your Muse"),
    h("div", { style:{fontSize:"12px",color:"rgba(220,235,238,0.92)",fontWeight:600,lineHeight:1.3,fontStyle:museName === "(unnamed muse)" ? "italic" : "normal",opacity: museName === "(unnamed muse)" ? 0.6 : 1} }, museName)
  ));
  wrap.appendChild(headerStrip);

  // ── B2. Hacking Toolkit (skill tiles) ──
  const hackingPanel = h("div", { style:{paddingTop:"10px",borderTop:"1px dashed rgba(127,212,226,0.2)",marginBottom:"12px"} });
  hackingPanel.appendChild(h("div", { style:{fontFamily:"var(--mono)",fontSize:"9.5px",letterSpacing:"1.4px",color:"var(--accent-2)",fontWeight:800,textTransform:"uppercase",marginBottom:"8px"} },
    "▸ Hacking Toolkit · Cognition " + cog,
    h("span", { "data-tip":"lexicon.hacking-primer", style:{cursor:"help",marginLeft:"6px",fontSize:"11px",opacity:0.7} }, "ⓘ")
  ));
  const tiles = h("div", { style:{display:"grid",gridTemplateColumns:"repeat(3, 1fr)",gap:"8px"} });
  const mkTile = (label, val, sub, tip) => h("div", { "data-tip": tip, style:{padding:"10px",background:"rgba(0,0,0,0.3)",border:"1px solid rgba(127,212,226,0.3)",borderRadius:"3px",textAlign:"center",cursor:"help"} },
    h("div", { style:{fontFamily:"var(--mono)",fontSize:"9px",letterSpacing:"1.6px",color:"var(--accent-2)",fontWeight:800,textTransform:"uppercase",marginBottom:"4px"} }, label),
    h("div", { style:{fontSize:"24px",fontWeight:800,color:val > 0 ? "var(--st-ink)" : "var(--st-ink-mute)",fontFamily:'"Share Tech Mono", ui-monospace, monospace',fontVariantNumeric:"tabular-nums",lineHeight:1} }, val || "–"),
    h("div", { style:{fontSize:"9.5px",color:"rgba(220,235,238,0.6)",marginTop:"6px",lineHeight:1.3,fontStyle:"italic"} }, "// " + sub)
  );
  tiles.appendChild(mkTile("INFOSEC",   infosec, "intrusion · spoofing · subversion", "skills.Infosec"));
  tiles.appendChild(mkTile("INTERFACE", iface,   "device control · sniffing · navigation", "skills.Interface"));
  tiles.appendChild(mkTile("PROGRAM",   program, "code · exploits · app modification", "skills.Program"));
  hackingPanel.appendChild(tiles);
  wrap.appendChild(hackingPanel);

  // ── B3. OPSEC detail rows ──
  const opsecPanel = h("div", { style:{paddingTop:"10px",borderTop:"1px dashed rgba(127,212,226,0.2)",marginBottom:"12px"} });
  opsecPanel.appendChild(h("div", { style:{fontFamily:"var(--mono)",fontSize:"9.5px",letterSpacing:"1.4px",color:"var(--accent-2)",fontWeight:800,textTransform:"uppercase",marginBottom:"6px"} },
    "▸ OPSEC Stack · " + opsec.score + "/3 layers"
  ));
  const opsecRow = (label, present, tipKey) => h("div", { "data-tip": tipKey, style:{display:"flex",alignItems:"center",gap:"8px",padding:"4px 6px",fontSize:"11.5px",color: present ? "var(--good, #6dd49f)" : "rgba(220,235,238,0.5)",cursor:"help"} },
    h("span", { style:{width:"14px",fontWeight:800,fontFamily:"var(--mono)"} }, present ? "✓" : "○"),
    h("span", null, label)
  );
  opsecPanel.appendChild(opsecRow("Anonymizer — defeats casual tracing", opsec.hasAnon, "gear_items.anonymizer"));
  opsecPanel.appendChild(opsecRow("VPN App — encrypts your traffic",    opsec.hasVPN,  "gear_items.vpn-app"));
  opsecPanel.appendChild(opsecRow("Fake Ego ID — separate identity",     opsec.hasFakeID, "gear_items.fake-ego-id"));
  if (opsec.level !== "GOOD") {
    const missing = [];
    if (!opsec.hasAnon) missing.push("Anonymizer");
    if (!opsec.hasVPN) missing.push("VPN App");
    if (!opsec.hasFakeID) missing.push("Fake Ego ID");
    opsecPanel.appendChild(h("div", { style:{fontSize:"10.5px",color:"rgba(220,235,238,0.6)",marginTop:"4px",fontStyle:"italic"} },
      "Suggestion: acquire " + missing.join(" + ") + " to reach GOOD OPSEC."
    ));
  }
  wrap.appendChild(opsecPanel);

  // ── B4. Apps detected ──
  if (apps.length > 0) {
    const appsPanel = h("div", { style:{paddingTop:"10px",borderTop:"1px dashed rgba(127,212,226,0.2)",marginBottom:"12px"} });
    appsPanel.appendChild(h("div", { style:{fontFamily:"var(--mono)",fontSize:"9.5px",letterSpacing:"1.4px",color:"var(--accent-2)",fontWeight:800,textTransform:"uppercase",marginBottom:"6px"} },
      "▸ Mesh Toolkit · " + apps.length + " apps"

        h("div", { style:{color:"rgba(220,235,238,0.92)",fontWeight:600} }, a.name),
        h("div", { style:{color:"rgba(220,235,238,0.65)",fontStyle:"italic",lineHeight:1.4} }, "// " + (a.summary || "mesh app"))
      ));
    });
    wrap.appendChild(appsPanel);
  }

  // ── B5. Common mesh actions cheat sheet ──
  const actionsPanel = h("div", { style:{paddingTop:"10px",borderTop:"1px dashed rgba(127,212,226,0.2)",marginBottom:"12px"} });
  actionsPanel.appendChild(h("div", { style:{fontFamily:"var(--mono)",fontSize:"9.5px",letterSpacing:"1.4px",color:"var(--accent-2)",fontWeight:800,textTransform:"uppercase",marginBottom:"6px"} },
    "▸ Common Actions · what to roll",
    h("span", { "data-tip":"lexicon.mesh-actions-table", style:{cursor:"help",marginLeft:"6px",fontSize:"11px",opacity:0.7} }, "ⓘ")
  ));
  const ACTIONS = [
    {name:"Lurking",    skill:"Research / Infosec", primer:"gather info passively (no intrusion)", tip:"lexicon.lurking"},
    {name:"Intrusion",  skill:"Infosec",            primer:"break in (vs target's Firewall rating)", tip:"lexicon.intrusion"},
    {name:"Sniffing",   skill:"Interface",          primer:"intercept nearby mesh traffic",       tip:"lexicon.sniffing"},
    {name:"Spoofing",   skill:"Infosec",            primer:"send commands as authorized user",    tip:"lexicon.spoofing"},
    {name:"Subversion", skill:"Infosec",            primer:"do the thing once you're in",         tip:"lexicon.subversion"}
  ];
  ACTIONS.forEach(a => {
    actionsPanel.appendChild(h("div", { "data-tip": a.tip, style:{display:"grid",gridTemplateColumns:"100px 130px 1fr",gap:"10px",padding:"4px 6px",fontSize:"11.5px",borderBottom:"1px solid rgba(127,212,226,0.1)",cursor:"help",alignItems:"center"} },
      h("div", { style:{color:"rgba(220,235,238,0.92)",fontWeight:600} }, a.name),
      h("div", { style:{color:"var(--accent-2)",fontFamily:"var(--mono)",fontSize:"10.5px"} }, a.skill),
      h("div", { style:{color:"rgba(220,235,238,0.65)",fontStyle:"italic",lineHeight:1.4} }, "// " + a.primer)
    ));
  });
  wrap.appendChild(actionsPanel);

  // ── B6. Privilege ladder ──
  const privPanel = h("div", { style:{paddingTop:"10px",borderTop:"1px dashed rgba(127,212,226,0.2)",marginBottom:"12px"} });
  privPanel.appendChild(h("div", { style:{fontFamily:"var(--mono)",fontSize:"9.5px",letterSpacing:"1.4px",color:"var(--accent-2)",fontWeight:800,textTransform:"uppercase",marginBottom:"6px"} },
    "▸ Privilege Ladder · each step is a separate hack",
    h("span", { "data-tip":"lexicon.privileges", style:{cursor:"help",marginLeft:"6px",fontSize:"11px",opacity:0.7} }, "ⓘ")
  ));
  const ladder = h("div", { style:{display:"flex",flexWrap:"wrap",gap:"4px",alignItems:"center",fontFamily:'"Share Tech Mono", ui-monospace, monospace',fontSize:"10.5px"} });
  const LEVELS = [
    {label:"Public",     tone:"rgba(220,235,238,0.5)"},
    {label:"User",       tone:"rgba(220,235,238,0.75)"},
    {label:"Read/Write", tone:"var(--accent-2)"},
    {label:"Admin",      tone:"var(--warn, #e8b75a)"},
    {label:"Security",   tone:"var(--st-orange, #e89a4f)"},
    {label:"Root",       tone:"var(--st-red, #d96b6b)"}
  ];
  LEVELS.forEach((l, i) => {
    ladder.appendChild(h("span", { style:{padding:"3px 8px",border:"1px solid "+l.tone,borderRadius:"10px",color:l.tone,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.8px"} }, l.label));
    if (i < LEVELS.length - 1) ladder.appendChild(h("span", { style:{color:"rgba(127,212,226,0.4)",fontSize:"11px"} }, "→"));
  });
  privPanel.appendChild(ladder);
  wrap.appendChild(privPanel);

  // ── B7. Mesh-aware implants ──
  if (implants.length > 0) {
    const impPanel = h("div", { style:{paddingTop:"10px",borderTop:"1px dashed rgba(127,212,226,0.2)"} });
    impPanel.appendChild(h("div", { style:{fontFamily:"var(--mono)",fontSize:"9.5px",letterSpacing:"1.4px",color:"var(--accent-2)",fontWeight:800,textTransform:"uppercase",marginBottom:"6px"} },
      "▸ Mesh-Aware Implants · " + implants.length
    ));
    implants.forEach(imp => {
      const tone = imp.status === "warn" ? "var(--warn, #e8b75a)" : "var(--good, #6dd49f)";
      const icon = imp.status === "warn" ? "⚠" : "✓";
      impPanel.appendChild(h("div", { "data-tip":"ware." + imp.key, style:{display:"flex",alignItems:"center",gap:"8px",padding:"4px 6px",fontSize:"11.5px",cursor:"help",borderBottom:"1px solid rgba(127,212,226,0.1)"} },
        h("span", { style:{width:"14px",color:tone,fontWeight:800,fontFamily:"var(--mono)"} }, icon),
        h("span", { style:{color:"rgba(220,235,238,0.92)",fontWeight:600,minWidth:"160px"} }, imp.key.replace(/-/g, " ").replace(/\b\w/g, c => c.toUpperCase())),
        h("span", { style:{color:"rgba(220,235,238,0.65)",fontStyle:"italic",fontSize:"11px",lineHeight:1.4} }, imp.summary)
      ));
    });
    wrap.appendChild(impPanel);
  }

  return wrap;
}

/* ── v0.11 Nanofab · Armaments Codex ──────────────────────────────────────
   Game-dev framing: weapons/grenades/missiles/explosives/mines/ammo/mods
   surface as a browseable codex (loadout + full library tabs), per
   [[feedback_game-dev-catalogs]]. Reuses RULEBOOK_REFERENCE.gear_items
   (any entry with `weapon != null`) + RULEBOOK_REFERENCE.weapon_traits.
   Type-discriminated rendering via weapon.type. Reuses characterHasFabber()
   for per-card fab badges. All additive — no schema-version bump. */

const ARMAMENT_CLASS_TONES = {
  firearm: "#c0392b",
  beam: "#3498db",
  spray: "#1abc9c",
  melee: "#e67e22",
  implant: "#27ae60",
  grenade: "#f39c12",
  missile: "#8e44ad",
  explosive: "#d35400",
  mine: "#7f8c8d",
  ammo: "#95a5a6",
  mod: "#16a085"
};

const ARMAMENT_CLASS_GROUPS = [
  { key: "firearm",  label: "KINETIC",     match: e => e.category === "Kinetic Weapons" || (e.weapon && e.weapon.type === "firearm" && e.category !== "Seeker Launchers") },
  { key: "beam",     label: "BEAM",        match: e => e.category === "Beam Weapons" },
  { key: "spray",    label: "SPRAY",       match: e => e.category === "Spray Weapons" },
  { key: "seeker",   label: "SEEKER",      match: e => e.category === "Seeker Launchers" },
  { key: "melee",    label: "MELEE",       match: e => e.category === "Melee Weapons" },
  { key: "implant",  label: "IMPLANT",     match: e => e.category === "Implant Weapons" },
  { key: "grenade",  label: "GRENADES",    match: e => e.weapon && e.weapon.type === "grenade" },
  { key: "missile",  label: "MISSILES",    match: e => e.weapon && e.weapon.type === "missile" },
  { key: "explosive",label: "EXPLOSIVES & MINES", match: e => e.weapon && (e.weapon.type === "explosive" || e.weapon.type === "mine") },
  { key: "ammo",     label: "AMMUNITION",  match: e => e.weapon && e.weapon.type === "ammo" },
  { key: "mod",      label: "MODS",        match: e => e.weapon && e.weapon.type === "mod" }
];

function studioArmamentEntries() {
  const items = (RULEBOOK_REFERENCE && RULEBOOK_REFERENCE.gear_items) || {};
  const out = [];
  Object.keys(items).forEach(key => {
    const e = items[key];
    if (e && e.weapon) out.push({ key, entry: e });
  });
  return out;
}

function studioArmamentClassOf(entry) {
  for (const g of ARMAMENT_CLASS_GROUPS) {
    if (g.match(entry)) return g.key;
  }
  return (entry.weapon && entry.weapon.type) || "firearm";
}

function studioArmamentOwnership(pc, entryKey, entry) {
  const gear = (pc && pc.gear) || [];
  // Match by id (slug equality) or by lowercased name slug.
  const owned = gear.find(g => {
    if (!g) return false;
    if (g.id === entryKey) return true;
    const nameSlug = (g.name || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    return nameSlug === entryKey;
  });
  if (owned) return owned.equipped ? "equipped" : "stowed";
  const cost = (entry && entry.cost) || "";
  if (/\/X(\/|$)/.test(cost)) return "illegal";
  if (/\/R(\/|$)/.test(cost)) return "restricted";
  return "available";
}

function studioArmamentFabReady(entry, pc) {
  const fab = (typeof characterHasFabber === "function") ? characterHasFabber(pc) : null;
  if (!fab) return false;
  const cost = (entry && entry.cost) || "";
  const complexity = cost.split("/")[0];
  if (fab === "compact") return complexity === "Min";
  if (fab === "medium") return complexity === "Min" || complexity === "Mod";
  if (fab === "large" || fab === "fabber") return true;
  return false;
}

function buildStudioWeaponTraitBadge(traitKey) {
  const traits = (RULEBOOK_REFERENCE && RULEBOOK_REFERENCE.weapon_traits) || {};
  const meta = traits[traitKey] || { label: traitKey, short: "" };
  return h("span", {
    class: "armament-trait-pill",
    "data-tip": "weapon_traits." + traitKey,
    style: { display:"inline-block", padding:"1px 7px", marginRight:"4px", marginBottom:"3px",
             fontFamily:'"Share Tech Mono", ui-monospace, monospace', fontSize:"9.5px",
             fontWeight:700, letterSpacing:"1.1px", textTransform:"uppercase",
             color:"rgba(220,235,238,0.8)", background:"rgba(127,212,226,0.10)",
             border:"1px solid rgba(127,212,226,0.30)", borderRadius:"2px", cursor:"help" }
  }, meta.label || traitKey);
}

function buildStudioWeaponOwnershipChip(state) {
  const conf = {
    equipped:   { label:"EQUIPPED",   color:"#4caf50", bg:"rgba(76,175,80,0.12)" },
    stowed:     { label:"IN LOADOUT", color:"#4fd4e0", bg:"rgba(79,212,224,0.12)" },
    available:  { label:"AVAILABLE",  color:"#9aa3a8", bg:"rgba(154,163,168,0.10)" },
    restricted: { label:"RESTRICTED", color:"#e6a23c", bg:"rgba(230,162,60,0.14)" },
    illegal:    { label:"ILLEGAL",    color:"#c0392b", bg:"rgba(192,57,43,0.14)" }
  }[state] || { label: state.toUpperCase(), color:"#9aa3a8", bg:"rgba(154,163,168,0.10)" };
  return h("span", {
    class: "armament-ownership-chip",
    "data-ownership": state,
    style: { padding:"2px 8px", fontFamily:'"Share Tech Mono", ui-monospace, monospace',
             fontSize:"9px", fontWeight:800, letterSpacing:"1.4px",
             color: conf.color, background: conf.bg,
             border:"1px solid " + conf.color + "55", borderRadius:"2px" }
  }, conf.label);
}

function buildStudioWeaponTierBadge(costStr) {
  const cost = costStr || "—";
  const parts = cost.split("/");
  const complexity = parts[0] || "—";
  const hasR = parts.some(p => p === "R");
  const hasX = parts.some(p => p === "X");
  const gp = parts.find(p => /^[0-9]+$/.test(p)) || "";
  const tone = hasX ? "#c0392b" : hasR ? "#e6a23c" : "#7fd4e2";
  const parts2 = [complexity];
  if (hasR) parts2.push("R");
  if (hasX) parts2.push("X");
  if (gp) parts2.push(gp + " GP");
  return h("span", {
    class: "armament-tier-badge",
    "data-cost": cost,
    style: { padding:"2px 7px", fontFamily:'"Share Tech Mono", ui-monospace, monospace',
             fontSize:"9px", fontWeight:700, letterSpacing:"1.2px",
             color: tone, background:"rgba(7,24,29,0.5)",
             border:"1px solid " + tone + "55", borderRadius:"2px" }
  }, parts2.join(" · "));
}

function buildStudioWeaponFabBadge(entry, pc) {
  const ready = studioArmamentFabReady(entry, pc);
  const fab = (typeof characterHasFabber === "function") ? characterHasFabber(pc) : null;
  const complexity = (entry && entry.cost || "").split("/")[0];
  const needed = complexity === "Min" ? "Compact Fabber+"
               : complexity === "Mod" ? "Medium Fabber+"
               : complexity === "Maj" || complexity === "X" ? "Large Fabber"
               : "Fabber";
  const conf = ready
    ? { label:"FABRICATABLE", color:"#4caf50", bg:"rgba(76,175,80,0.10)" }
    : { label: fab ? ("NEEDS " + needed.toUpperCase()) : ("NEEDS " + needed.toUpperCase()), color:"#9aa3a8", bg:"rgba(154,163,168,0.10)" };
  return h("span", {
    class: "armament-fab-badge",
    "data-fab-ready": ready ? "true" : "false",
    style: { padding:"2px 7px", fontFamily:'"Share Tech Mono", ui-monospace, monospace',
             fontSize:"9px", fontWeight:700, letterSpacing:"1.2px",
             color: conf.color, background: conf.bg,
             border:"1px solid " + conf.color + "55", borderRadius:"2px" }
  }, conf.label);
}

function buildStudioRangeBands(weapon) {
  if (!weapon) return null;
  const type = weapon.type || "firearm";
  if (!weapon.ranged || type === "melee" || type === "implant") {
    const reach = weapon.reach || "short";
    return h("div", { class:"armament-range-bands", style:{fontSize:"10.5px",color:"var(--st-ink-soft)",fontFamily:'"Share Tech Mono", ui-monospace, monospace',marginTop:"4px"} },
      "▾ Melee · Reach: " + reach + " · opposed Melee test");
  }
  const r = weapon.range || 30;
  return h("div", { class:"armament-range-bands", style:{fontSize:"10.5px",color:"var(--st-ink-soft)",fontFamily:'"Share Tech Mono", ui-monospace, monospace',marginTop:"4px",lineHeight:1.5} },
    "▾ Range bands: PB (≤2m) +10 · Close (≤" + Math.max(2, Math.floor(r/3)) + "m) 0 · At-Range (≤" + r + "m) −10 · Beyond −10 per +" + Math.max(10, Math.floor(r/2)) + "m");
}

function buildStudioArmamentDefenderResponse(weapon) {
  if (!weapon) return null;
  const type = weapon.type || "firearm";
  let text = null;
  if (type === "melee" || type === "implant") text = "▾ Defender response: opposed Melee or Fray ÷ 2";
  else if (type === "ammo" || type === "mod") text = null;
  else if (type === "grenade" || type === "missile" || type === "explosive" || type === "mine") text = "▾ Defender response: Fray ÷ 2 vs area effect (halves DV on success)";
  else if (weapon.ranged) text = "▾ Defender response: Fray ÷ 2 (ranged)";
  if (!text) return null;
  return h("div", { class:"armament-defender", style:{fontSize:"10.5px",color:"var(--st-ink-soft)",fontFamily:'"Share Tech Mono", ui-monospace, monospace',marginTop:"3px"} }, text);
}

function buildStudioArmamentStatChips(weapon) {
  if (!weapon) return [];
  const type = weapon.type || "firearm";
  const tone = ARMAMENT_CLASS_TONES[type] || "#4fd4e0";
  const mkChip = (label, value, accent) => h("span", {
    class: "armament-stat-chip",
    style: { display:"inline-block", padding:"3px 8px", marginRight:"6px", marginBottom:"4px",
             fontFamily:'"Share Tech Mono", ui-monospace, monospace', fontSize:"10.5px",
             fontWeight:700, letterSpacing:"0.6px",
             color: accent || "var(--st-ink)", background:"rgba(7,24,29,0.55)",
             border:"1px solid " + (accent || tone) + "55", borderRadius:"3px" }
  },
    h("span", { style:{opacity:0.55,marginRight:"4px",fontSize:"9px"} }, label),
    String(value)
  );
  const chips = [];
  if (weapon.nonLethal) {
    const k = (weapon.status && weapon.status.kind) || "non-lethal";
    chips.push(mkChip("STATUS", k.toUpperCase(), "#e6a23c"));
  } else if (weapon.dv && weapon.dv !== "—") {
    chips.push(mkChip("DV", weapon.dv, tone));
  } else if (type === "ammo" || type === "mod") {
    const m = weapon.modifies || {};
    const mods = [];
    if (m.dv) mods.push("DV " + m.dv);
    if (m.toHit) mods.push(m.toHit);
    if (m.armorPenetration) mods.push(m.armorPenetration);
    if (m.ammoCapacity) mods.push("Capacity " + m.ammoCapacity);
    if (m.range) mods.push("Range " + m.range);
    if (m.detect) mods.push(m.detect);
    if (m.conceal) mods.push("Conceal " + m.conceal);
    if (m.status) mods.push(m.status);
    if (m.note) mods.push(m.note);
    chips.push(mkChip("EFFECT", mods.join(" · ") || "—", tone));
  } else if (weapon.dv) {
    chips.push(mkChip("DV", weapon.dv, tone));
  }
  if (type === "grenade" || type === "missile" || type === "explosive" || type === "mine") {
    if (weapon.radius != null) chips.push(mkChip("BLAST", weapon.radius + "m"));
    if (weapon.delay) chips.push(mkChip("DELAY", weapon.delay));
    if (weapon.trigger) chips.push(mkChip("TRIGGER", weapon.trigger));
    if (weapon.payload) chips.push(mkChip("PAYLOAD", weapon.payload));
    if (weapon.throwRange) chips.push(mkChip("THROW", weapon.throwRange + "m"));
    if (weapon.placement) chips.push(mkChip("PLACE", weapon.placement));
  } else if (type === "ammo" || type === "mod") {
    /* no further chips for modifier blueprints */
  } else {
    if (weapon.range != null && weapon.ranged) chips.push(mkChip("RANGE", weapon.range + "m"));
    if (weapon.ammo != null && weapon.ammo !== null) chips.push(mkChip("AMMO", weapon.ammo));
    if (weapon.modes && weapon.modes.length) chips.push(mkChip("MODES", weapon.modes.join("/")));
    if (!weapon.ranged) chips.push(mkChip("REACH", weapon.reach || "short"));
  }
  return chips;
}

function buildStudioArmamentFooter(weapon) {
  if (!weapon) return null;
  const type = weapon.type || "firearm";
  const kids = [];
  if (weapon.nonLethal && weapon.status) {
    kids.push(h("div", { class:"armament-status-block", style:{padding:"6px 8px",marginTop:"6px",background:"rgba(230,162,60,0.08)",border:"1px solid rgba(230,162,60,0.35)",borderRadius:"3px"} },
      h("div", { style:{fontSize:"10px",color:"#e6a23c",fontFamily:'"Share Tech Mono", ui-monospace, monospace',fontWeight:800,letterSpacing:"1.4px",marginBottom:"3px"} }, "STATUS · " + (weapon.status.kind || "non-lethal").toUpperCase()),
      h("div", { style:{fontSize:"10.5px",color:"var(--st-ink-soft)",lineHeight:1.5} }, "▾ On hit: ", h("span", { style:{color:"var(--st-ink)"} }, weapon.status.save || "—")),
      h("div", { style:{fontSize:"10.5px",color:"var(--st-ink-soft)",lineHeight:1.5} }, "▾ Escape: ", h("span", { style:{color:"var(--st-ink)"} }, weapon.status.escape || "—")),
      weapon.status.notes ? h("div", { style:{fontSize:"10px",color:"var(--st-ink-mute)",fontStyle:"italic",marginTop:"2px"} }, weapon.status.notes) : null
    ));
  }
  const defender = buildStudioArmamentDefenderResponse(weapon);
  if (defender) kids.push(defender);
  const ranges = buildStudioRangeBands(weapon);
  if (ranges) kids.push(ranges);
  if (type === "missile" && weapon.launcherCompat && weapon.launcherCompat.length) {
    kids.push(h("div", { class:"armament-launcher-compat", style:{fontSize:"10px",color:"var(--st-ink-mute)",fontFamily:'"Share Tech Mono", ui-monospace, monospace',marginTop:"3px"} },
      "▾ Loads into: " + weapon.launcherCompat.join(" · ")));
  }
  if ((type === "ammo" || type === "mod") && weapon.compatibility && weapon.compatibility.length) {
    const verb = type === "ammo" ? "Loaded into" : "Attaches to";
    kids.push(h("div", { class:"armament-compat", style:{fontSize:"10px",color:"var(--st-ink-mute)",fontFamily:'"Share Tech Mono", ui-monospace, monospace',marginTop:"3px"} },
      "▾ " + verb + ": " + weapon.compatibility.join(" · ")));
  }
  if (kids.length === 0) return null;
  return h("div", { class:"armament-footer", style:{marginTop:"6px"} }, ...kids);
}

function buildStudioArmamentCard(entryKey, entry, opts) {
  opts = opts || {};
  const mode = opts.mode || "codex";  // "codex" | "loadout"
  const pc = opts.pc || null;
  const owned = opts.owned || (pc ? studioArmamentOwnership(pc, entryKey, entry) : "available");
  const weapon = (entry && entry.weapon) || {};
  const cls = studioArmamentClassOf(entry);
  const tone = ARMAMENT_CLASS_TONES[cls] || "#4fd4e0";
  const lethalAttr = weapon.nonLethal ? "non-lethal" : "lethal";
  const ownedAttr = (owned === "equipped" || owned === "stowed") ? "true" : "false";
  const fabReady = pc ? studioArmamentFabReady(entry, pc) : false;
  const headerRow = h("div", { class:"armament-card-header", style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:"8px",marginBottom:"4px",flexWrap:"wrap"} },
    h("div", null,
      h("span", { class:"armament-card-name", style:{fontSize:"13px",fontWeight:700,color:"var(--st-ink)"} }, entry.name || entryKey),
      h("span", { class:"armament-card-class", style:{marginLeft:"8px",fontSize:"9.5px",fontFamily:'"Share Tech Mono", ui-monospace, monospace',color:tone,letterSpacing:"1.4px",fontWeight:700,textTransform:"uppercase"} }, "· " + cls)
    ),
    buildStudioWeaponOwnershipChip(owned)
  );
  const statChipsRow = h("div", { class:"armament-card-stats", style:{marginBottom:"4px"} }, ...buildStudioArmamentStatChips(weapon));
  const modesLine = (weapon.skill || weapon.modes) ? h("div", { class:"armament-card-modeskill", style:{fontSize:"10.5px",color:"var(--st-ink-soft)",fontFamily:'"Share Tech Mono", ui-monospace, monospace',marginBottom:"4px"} },
    (weapon.modes && weapon.modes.length ? "Modes: " + weapon.modes.join(" / ") + "  ·  " : "") +
    (weapon.skill ? "Skill: " + weapon.skill : "")) : null;
  const traits = weapon.traits || [];
  const traitsRow = traits.length ? h("div", { class:"armament-card-traits", style:{marginBottom:"4px"} }, ...traits.map(t => buildStudioWeaponTraitBadge(t))) : null;
  const footer = buildStudioArmamentFooter(weapon);
  const tierFabRow = (mode === "codex") ? h("div", { class:"armament-card-tierfab", style:{display:"flex",gap:"6px",alignItems:"center",marginTop:"6px",flexWrap:"wrap"} },
    buildStudioWeaponTierBadge(entry.cost),
    buildStudioWeaponFabBadge(entry, pc)
  ) : null;
  const slug = entryKey;
  return h("div", {
    class: "armament-card",
    "data-class": cls,
    "data-lethal": lethalAttr,
    "data-owned": ownedAttr,
    "data-fab-ready": fabReady ? "true" : "false",
    "data-tip": "gear_items." + slug,
    style: { padding:"10px 12px", marginBottom:"8px", background:"linear-gradient(180deg, rgba(7,24,29,0.5), rgba(7,24,29,0.3))",
             borderLeft:"4px solid " + tone, border:"1px solid rgba(127,212,226,0.22)", borderLeftWidth:"4px",
             borderRadius:"3px" }
  }, headerRow, statChipsRow, modesLine, traitsRow, footer, tierFabRow);
}

function buildStudioArmaments(pc) {
  pc = pc || {};
  const wrap = h("div", {
    class:"armaments-panel",
    "data-armaments-tab":"codex",
    "data-filter-class":"all",
    "data-filter-lethal":"all",
    "data-filter-owned":"all",
    "data-filter-fab":"all"
  });
  // Tab toggle
  const tabRow = h("div", { class:"armaments-tabs", style:{display:"flex",gap:"4px",marginBottom:"10px"} });
  const tabCodex = h("button", { class:"armaments-tab armaments-tab--active", "data-tab":"codex",
    style:{flex:1,padding:"6px 10px",background:"rgba(79,212,224,0.18)",color:"var(--st-teal)",border:"1px solid rgba(127,212,226,0.55)",borderRadius:"3px",fontFamily:'"Share Tech Mono", ui-monospace, monospace',fontSize:"10.5px",fontWeight:800,letterSpacing:"1.4px",textTransform:"uppercase",cursor:"pointer"},
    onClick: () => { wrap.setAttribute("data-armaments-tab","codex"); tabCodex.classList.add("armaments-tab--active"); tabLoadout.classList.remove("armaments-tab--active"); tabCodex.style.background="rgba(79,212,224,0.18)"; tabLoadout.style.background="rgba(7,24,29,0.3)"; }
  }, "Codex · ", h("span", { style:{opacity:0.6} }, "blueprint library"));

/* Helper: temporarily swap global STATE so existing derived.*() functions
   compute against a different state (e.g. an imported party member's full).
   Synchronous; restores STATE on return. */
function withStateAs(stateOverride, fn) {
  const original = STATE;
  STATE = stateOverride;
  try { return fn(); } finally { STATE = original; }
}

/* Helper: format an ISO timestamp as a relative "X seconds ago" string. */
function partyRelativeTime(isoStr) {
  if (!isoStr) return "—";
  const t = Date.parse(isoStr);
  if (isNaN(t)) return "—";
  const diff = Math.max(0, Date.now() - t);
  const s = Math.floor(diff / 1000);
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}

/* Helper: compute card data for a member. For self, pass STATE. For an import,
   pass entry.full. Returns a normalized object the card renderer consumes. */
function partyComputeCardData(stateLike) {
  return withStateAs(stateLike, () => {
    const ego = stateLike.ego || {};
    const ds = derived.derivedStats();
    const ms = derived.morphStats();
    const fs = derived.finalSkills();
    const cov = derived.partyCoverage().self;
    const bgName = ego.background ? (RULEBOOK_DATA.backgrounds[ego.background] && RULEBOOK_DATA.backgrounds[ego.background].name) : "";
    const careerName = ego.career ? (RULEBOOK_DATA.careers[ego.career] && RULEBOOK_DATA.careers[ego.career].name) : "";
    const interestName = ego.interest ? (RULEBOOK_DATA.interests[ego.interest] && RULEBOOK_DATA.interests[ego.interest].name) : "";
    const factionName = (ego.faction && !ego.factionless) ? (RULEBOOK_DATA.factions[ego.faction] && RULEBOOK_DATA.factions[ego.faction].name) : (ego.factionless ? "Factionless" : "");
    const lifepath = [bgName, careerName, interestName].filter(Boolean).join(" / ");
    const topSkills = (fs && Array.isArray(fs.skills))
      ? fs.skills.filter(b => !b.deferred && b.final > 0)
                 .sort((a,b) => b.final - a.final)
                 .slice(0, 5)
                 .map(b => ({ name: b.field ? b.skill + ":" + b.field : b.skill, value: b.final }))
      : [];
    const WT = ms && ms.morph ? ms.morph.WT : 0;
    const DUR = ms && ms.morph ? ms.morph.DUR : 0;
    return {
      name: ego.name || "Unnamed",
      concept: (ego.narrative && ego.narrative.concept) || "",
      // v0.10: portrait for team cards — visceral team identity, not just a row.
      avatarDataUrl: (ego.narrative && ego.narrative.avatarDataUrl) || null,
      lifepath,
      faction: factionName,
      morph: ms && ms.morph ? { name: ms.morph.name, type: ms.morph.type } : null,
      aptitudes: ds.apt,
      topSkills,
      coverage: cov,
      reputation: ego.rep || {},
      wounds: (stateLike.play && stateLike.play.wounds) || 0,
      // v0.10: also surface play.woundsTaken / traumasTaken for auto-derive in Wave B
      woundsTaken: (stateLike.play && stateLike.play.woundsTaken) || 0,
      traumasTaken: (stateLike.play && stateLike.play.traumasTaken) || 0,
      stress: (stateLike.play && stateLike.play.stress) || 0,
      WT,
      DUR,
      // v0.10 B: derived ratios for read-only display on team cards
      maxWounds: (WT > 0) ? Math.max(1, Math.floor(DUR / WT)) : 0,
      lucidity: ds.lucidity || 0,
      traumaThreshold: ds.traumaThreshold || 0,
      isSwarm: ms && ms.morph ? !!ms.morph.swarm : false
    };
  });
}
