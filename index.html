/* Schema v1 -> v2 migrator. Old saves stored allocations keyed by bucket
   names like "Know:Fine Art" or the leaky synthetic "Know:_deferred_bg.6".
   Re-key them to slot IDs. */
function migrateV1ToV2(loaded) {
  if (!loaded || !loaded.ego) return loaded;
  const ego = loaded.ego;
  if (ego.slotAllocations) return loaded; // already v2-ish

  const slotAllocations = {};
  const customSlots = [];
  let customCounter = 0;

  // Build a map of all PACKAGE slots that exist in this character so we can
  // resolve old bucket-keyed allocations back to slots.
  const slotsByBucket = {}; // bucketKey -> [sourceId, ...]
  const slotsBySource = {}; // sourceId -> {skill, field}
  const addSlot = (source, skill, field) => {
    slotsBySource[source] = { skill, field };
    const fieldKey = (field && field !== "") ? field : null;
    const bk = fieldKey ? skill + ":" + fieldKey : skill;
    if (!slotsByBucket[bk]) slotsByBucket[bk] = [];
    slotsByBucket[bk].push(source);
  };

  const expandLocal = (catalog, id, prefix) => {
    if (!id || !catalog[id]) return;
    catalog[id].skills.forEach((spec, idx) => {
      let actual = spec;
      if (spec.skill === "_OR_") {
        const ci = (ego.orChoices || {})[prefix + "." + idx] || 0;
        actual = spec.options[ci];
      }
      let field = null;
      if (actual.field) {
        if (actual.field.fixed) field = actual.field.fixed;
        else field = (ego.fieldChoices || {})[prefix + "." + idx] || null;
      }
      addSlot(prefix + "." + idx, actual.skill, field);
    });
  };
  expandLocal(RULEBOOK_DATA.backgrounds, ego.background, "bg");
  expandLocal(RULEBOOK_DATA.careers, ego.career, "ca");
  expandLocal(RULEBOOK_DATA.interests, ego.interest, "in");
  if (ego.faction && !ego.factionDeferred && !ego.factionless) {
    const fname = RULEBOOK_DATA.factions[ego.faction]?.name;
    if (fname) addSlot("fa.0", "Know", fname);
  }

  // Walk old skillAllocations and re-key
  const oldAllocs = ego.skillAllocations || {};
  Object.entries(oldAllocs).forEach(([bucketKey, pts]) => {
    if (pts <= 0) return;
    // Detect leaky synthetic key: "Know:_deferred_bg.6"
    const synthMatch = bucketKey.match(/^([A-Za-z ]+):_deferred_(.+)$/);
    if (synthMatch) {
      const slotSource = synthMatch[2];
      if (slotsBySource[slotSource]) {
        slotAllocations[slotSource] = (slotAllocations[slotSource] || 0) + pts;
        return;
      }
      // Slot doesn't exist anymore (e.g., user changed background) — drop
      return;
    }
    // Otherwise try to match by bucket name
    const matched = slotsByBucket[bucketKey];
    if (matched && matched.length > 0) {
      // Put all the points on the first matching slot
      slotAllocations[matched[0]] = (slotAllocations[matched[0]] || 0) + pts;
      return;
    }
    // No matching package slot — must be a custom skill
    const colonIdx = bucketKey.indexOf(":");
    const skill = colonIdx >= 0 ? bucketKey.slice(0, colonIdx) : bucketKey;
    const field = colonIdx >= 0 ? bucketKey.slice(colonIdx + 1) : null;
    customCounter++;
    const source = "custom." + customCounter;
    customSlots.push({ source, skill, field: (field === "" ? null : field) });
    slotAllocations[source] = pts;
  });

  ego.slotAllocations = slotAllocations;
  ego.customSlots = customSlots;
  ego.customSlotCounter = customCounter;
  delete ego.skillAllocations;
  if (loaded.meta) loaded.meta.schemaVersion = 2;
  return loaded;
}

/* Schema v2 -> v3 migrator. Adds STATE.play (at-table state for the one-shot)
   and STATE.meta.mode (chargen/play toggle). Additive — never touches existing data. */
function migrateV2ToV3(loaded) {
  if (!loaded) return loaded;
  if (!loaded.play) {
    loaded.play = { pools:{Insight:null,Moxie:null,Vigor:null,Flex:null}, wounds:0, durability:0, stress:0, lucidity:0, log:[] };
  }
  if (loaded.meta && !loaded.meta.mode) {
    loaded.meta.mode = "chargen";
  }
  if (loaded.meta) loaded.meta.schemaVersion = 3;
  return loaded;
}

/* Schema v3 -> v4 migrator. Additive: extends play with interactive HUD state.
   - turn: per-turn action economy flags (complex/quick/move spent this turn).
   - combat: round counter, optional rolled-init d6 result, freeform status tags.
   - consumables: per-gear-id remaining-count for items with dose tracking.
   Idempotent: only initializes fields that are missing so manual state survives re-runs. */
function migrateV3ToV4(loaded) {
  if (!loaded) return loaded;
  if (!loaded.play) {
    loaded.play = { pools:{Insight:null,Moxie:null,Vigor:null,Flex:null}, wounds:0, durability:0, stress:0, lucidity:0, log:[] };
  }
  if (!loaded.play.turn) loaded.play.turn = { complex:false, quick:false, move:false };
  if (!loaded.play.combat) loaded.play.combat = { round:0, initiativeRolled:null, statuses:[] };
  if (!loaded.play.consumables) loaded.play.consumables = {};
  if (loaded.meta) loaded.meta.schemaVersion = 4;
  return loaded;
}

/* Schema v4 -> v5 migrator. Additive: extends play with Studio's living-sheet
   surface — explicit wound/trauma count overrides (default 0 = derive from raw),
   recharge cluster, session notes, statuses array, initiative tracker. Also adds
   ego.player/muse/quote so the Identity hero block has somewhere to write to.
   Idempotent: only initializes fields that are missing. */
function migrateV4ToV5(loaded) {
  if (!loaded) return loaded;
  if (!loaded.play) {
    loaded.play = { pools:{Insight:null,Moxie:null,Vigor:null,Flex:null}, wounds:0, durability:0, stress:0, lucidity:0, log:[] };
  }
  if (loaded.play.woundsTaken == null) loaded.play.woundsTaken = 0;
  if (loaded.play.traumasTaken == null) loaded.play.traumasTaken = 0;
  if (!loaded.play.recharge) loaded.play.recharge = { short1:false, short2:false, long:false };
  if (loaded.play.notes == null) loaded.play.notes = "";
  if (!Array.isArray(loaded.play.statuses)) loaded.play.statuses = [];
  if (!loaded.play.initiative) loaded.play.initiative = { round:0, position:null };
  if (loaded.ego) {
    if (loaded.ego.player == null) loaded.ego.player = "";
    if (loaded.ego.muse == null) loaded.ego.muse = "";
    if (loaded.ego.quote == null) loaded.ego.quote = "";
  }
  if (loaded.meta) loaded.meta.schemaVersion = 5;
  return loaded;
}

/* v6 — lore fields on ego.narrative for Studio sheet lore panels.
   Additive: teamBrief (campaign / Firewall cell context) and backstory
   (long-form character history). Both default to empty; the Studio adapter
   reads them with || fallbacks so v5 saves render fine even before edit. */
function migrateV5ToV6(loaded) {
  if (!loaded) return loaded;
  if (loaded.ego && loaded.ego.narrative) {
    if (loaded.ego.narrative.teamBrief == null) loaded.ego.narrative.teamBrief = "";
    if (loaded.ego.narrative.backstory == null) loaded.ego.narrative.backstory = "";
  }
  if (loaded.meta) loaded.meta.schemaVersion = 6;
  return loaded;
}

/* v7 — character identity (characterId, liveShareUrl) + party member shape additions
   (id, source, lastSyncedAt, gmNotes, syncUrl) for the Party Page + GM Command Centre.
   Additive: existing partyImports get default gmNotes, source="file" (file-imported
   was the only path before v7), lastSyncedAt = exportedAt or now. characterId on
   ego is set lazily on first share (not here) so deterministic tests stay green. */
function migrateV6ToV7(loaded) {
  if (!loaded) return loaded;
  if (loaded.ego) {
    if (!("characterId" in loaded.ego)) loaded.ego.characterId = null;
    if (!("liveShareUrl" in loaded.ego)) loaded.ego.liveShareUrl = null;
  }
  if (Array.isArray(loaded.partyImports)) {
    loaded.partyImports = loaded.partyImports.map(p => {
      if (!p || typeof p !== "object") return p;
      const next = Object.assign({}, p);
      if (!("id" in next)) next.id = null;
      if (!("source" in next)) next.source = "file";
      if (!("lastSyncedAt" in next)) {
        next.lastSyncedAt = (p.full && p.full.summary && p.full.summary.exportedAt) || new Date().toISOString();
      }
      if (!next.gmNotes || typeof next.gmNotes !== "object") {
        next.gmNotes = { wounds:0, stress:0, initiative:null, statusEffects:[], notes:"" };
      }
      if (!("syncUrl" in next)) next.syncUrl = null;
      return next;
    });
  }
  if (loaded.meta) loaded.meta.schemaVersion = 7;
  return loaded;
}

/* v0.9.2 — normalizePartyImportEntries: enforce v7 shape on every partyImports[i]
   regardless of how the entry was created. Runs unconditionally at the end of
   migrateToCurrent so any partial entry (legacy save, hand-edited JSON, bug)
   gets healed on load. Same field-backfill rules as migrateV6ToV7's partyImports
   step, plus gmNotes shape-patching for partial gmNotes objects. */
function normalizePartyImportEntries(loaded) {
  if (!loaded || !Array.isArray(loaded.partyImports)) return loaded;
  loaded.partyImports = loaded.partyImports.map(p => {
    if (!p || typeof p !== "object") return p;
    const next = Object.assign({}, p);
    if (!("id" in next)) next.id = null;
    if (!("source" in next) || typeof next.source !== "string") next.source = "file";
    if (!("lastSyncedAt" in next)) next.lastSyncedAt = new Date().toISOString();
    if (!next.gmNotes || typeof next.gmNotes !== "object") {
      next.gmNotes = { wounds:0, stress:0, initiative:null, statusEffects:[], notes:"" };
    } else {
      next.gmNotes = Object.assign(
        { wounds:0, stress:0, initiative:null, statusEffects:[], notes:"" },
        next.gmNotes
      );
    }
    if (!("syncUrl" in next)) next.syncUrl = null;
    return next;
  });
  return loaded;
}

/* v0.9.2 — buildPartyImportEntry: single source of truth for partyImports entry
   shape. Used by both importJSON (file) and importShareSnapshot (URL/QR/live).
   Produces a v7-complete entry; callers can overwrite individual fields
   (e.g. existing gmNotes on upsert) after the call. */
function buildPartyImportEntry(loaded, sourceLabel) {
  const summary = (loaded && loaded.summary) || {};
  const src = String(sourceLabel || "file").toLowerCase();
  return {
    id: (loaded && loaded.ego && loaded.ego.characterId) || null,
    name: summary.name || (loaded && loaded.ego && loaded.ego.name) || "Unnamed",
    concept: summary.concept || (loaded && loaded.ego && loaded.ego.narrative && loaded.ego.narrative.concept) || "",
    lifepath: summary.lifepath || "",
    coverage: summary.coverage || { combat:0, face:0, hacker:0, sci:0 },
    source: src.includes("live") ? "live" : src,
    lastSyncedAt: summary.exportedAt || new Date().toISOString(),
    gmNotes: { wounds:0, stress:0, initiative:null, statusEffects:[], notes:"" },
    syncUrl: null,
    full: loaded
  };
}

/* Compose migrations. Always run in order — v1 saves cascade v1→...→v7.
   v0.9.2: normalizePartyImportEntries runs unconditionally at the end so
   any path that calls migrateToCurrent benefits (loadFromLocalStorage,
   importJSON, importShareSnapshot). */
function migrateToCurrent(loaded) {
  if (!loaded || !loaded.meta) return loaded;
  if (loaded.meta.schemaVersion < 2) loaded = migrateV1ToV2(loaded);
  if (loaded.meta.schemaVersion < 3) loaded = migrateV2ToV3(loaded);
  if (loaded.meta.schemaVersion < 4) loaded = migrateV3ToV4(loaded);
  if (loaded.meta.schemaVersion < 5) loaded = migrateV4ToV5(loaded);
  if (loaded.meta.schemaVersion < 6) loaded = migrateV5ToV6(loaded);
  if (loaded.meta.schemaVersion < 7) loaded = migrateV6ToV7(loaded);
  loaded = normalizePartyImportEntries(loaded);
  // v0.9.2: keep toolVersion in sync with newState() default on every load,
  // so footer doesn't show stale "v0.7.0" forever for legacy localStorage saves.
  if (loaded.meta) loaded.meta.toolVersion = newState().meta.toolVersion;
  // v0.10: ensure STATE.team is always present (additive field; no schema bump).
  if (!loaded.team || typeof loaded.team !== "object") {
    loaded.team = { roomId:null, teamName:"", lastPolledAt:null };
  } else {
    if (!("roomId" in loaded.team)) loaded.team.roomId = null;
    if (typeof loaded.team.teamName !== "string") loaded.team.teamName = "";
    if (!("lastPolledAt" in loaded.team)) loaded.team.lastPolledAt = null;
  }
  return loaded;
}

/* =================================================================
   DERIVED  —  pure functions over STATE. No mutation.
   ================================================================= */
const skillKey = (skillName, field) => field ? skillName + ":" + field : skillName;

// Resolve a field choice from a package skill spec.
// Returns the field string if assigned (whether by .fixed or by player choice),
// or null if deferred. Per MATH-SPEC §B1: never use the literal "" string.
function resolveField(spec, slotSource) {
  if (!spec.field) return null;
  if (spec.field.fixed) return spec.field.fixed;
  const chosen = STATE.ego.fieldChoices[slotSource];
  return (chosen != null && chosen !== "") ? chosen : null;
}

// Expand a package (background/career/interest) into slots.
// Each slot has a stable, unique source ID like "bg.5", which is the key for
// slotAllocations. NEVER use derived bucket names as storage keys.
function expandPackage(packageObj, sourcePrefix) {
  const slots = [];
  packageObj.skills.forEach((spec, idx) => {
    let actualSpec = spec;
    if (spec.skill === "_OR_") {
      const chosen = STATE.ego.orChoices[sourcePrefix + "." + idx] || 0;
      actualSpec = spec.options[chosen];
    }
    const source = sourcePrefix + "." + idx;
    const field = actualSpec.field ? resolveField(actualSpec, source) : null;
    slots.push({
      source,
      skill: actualSpec.skill,
      field,
      basePackagePts: actualSpec.value,
      sourceLabel: sourcePrefix
    });
  });
  return slots;
}

const derived = {
  /* All package slots (Steps 1-4). Each slot has a stable source ID.
     Field is null when deferred (NOT "" — see MATH-SPEC §B1). */
  packageSlots() {
    const all = [];
    const e = STATE.ego;
    if (e.background && RULEBOOK_DATA.backgrounds[e.background]) all.push(...expandPackage(RULEBOOK_DATA.backgrounds[e.background], "bg"));
    if (e.career && RULEBOOK_DATA.careers[e.career]) all.push(...expandPackage(RULEBOOK_DATA.careers[e.career], "ca"));
    if (e.interest && RULEBOOK_DATA.interests[e.interest]) all.push(...expandPackage(RULEBOOK_DATA.interests[e.interest], "in"));
    if (e.faction && !e.factionDeferred && !e.factionless && RULEBOOK_DATA.factions[e.faction]) {
      all.push({
        source: "fa.0",
        skill: "Know",
        field: RULEBOOK_DATA.factions[e.faction].name,
        basePackagePts: 30,
        sourceLabel: "fa"
      });
    }
    return all;
  },
  /* All slots including custom (player-added) ones. */
  allSlots() {
    const pkg = this.packageSlots();
    const custom = (STATE.ego.customSlots || []).map(c => ({
      source: c.source,
      skill: c.skill,
      field: c.field || null,
      basePackagePts: 0,
      sourceLabel: "custom"
    }));
    return pkg.concat(custom);
  },
  /* Slot-based aggregation. See MATH-SPEC §A, §B, §C, §D.
     Allocations are read from slotAllocations (slot-keyed), never from
     bucket-keyed storage. Deferred field slots are each their own bucket
     (via per-slot bucketKey) so they never collide. */
  finalSkills() {
    const e = STATE.ego;
    const slots = this.allSlots();

    // Enrich each slot with its allocation and effective value
    slots.forEach(s => {
      s.allocation = e.slotAllocations[s.source] || 0;
      s.effective = Math.max(0, s.basePackagePts + s.allocation);
    });

    // Group slots into buckets — display unit. (§B4)
    //   - Resolved field: key = "skill:field"  (multiple slots with same (skill,field) stack here)
    //   - Deferred field: key = "skill@" + slot.source  (unique per slot — never collide)
    //   - No-field skill: key = "skill"
    const buckets = {};
    slots.forEach(s => {
      const isFieldSkill = !!(RULEBOOK_DATA.skills[s.skill]?.field);
      let bucketKey;
      let deferred = false;
      if (isFieldSkill && s.field == null) {
        bucketKey = s.skill + "@" + s.source;
        deferred = true;
      } else if (s.field) {
        bucketKey = s.skill + ":" + s.field;
      } else {
        bucketKey = s.skill;
      }
      if (!buckets[bucketKey]) {
        buckets[bucketKey] = {
          bucketKey, skill: s.skill, field: s.field, deferred,
          slots: [], basePkgPts: 0, totalEffectivePkgPts: 0
        };
      }
      buckets[bucketKey].slots.push(s);
      buckets[bucketKey].basePkgPts += s.basePackagePts;
      buckets[bucketKey].totalEffectivePkgPts += s.effective;
    });

    // Apply CP skillBumps as virtual additions to buckets (§A7)
    Object.entries(e.cp.skillBumps || {}).forEach(([k, ptsInCP]) => {
      const pts = ptsInCP * 5;
      if (!buckets[k]) {
        const [skill, field] = k.split(":");
        buckets[k] = {
          bucketKey: k, skill, field: field || null, deferred: false,
          slots: [], basePkgPts: 0, totalEffectivePkgPts: 0
        };
      }
      buckets[k].fromCP = pts;
    });

    // Compute initial surplus (§C1), spent, wasted, overspent (§C2-§C3)
    const initialSurplus = { active: 0, know: 0 };
    let activeSpent = 0, knowSpent = 0;
    let activeWasted = 0, knowWasted = 0;
    const results = [];

    for (const bk in buckets) {
      const b = buckets[bk];
      const skillDef = RULEBOOK_DATA.skills[b.skill] || {};
      const linked = skillDef.linked || null;
      const apt = linked && linked !== "varies" ? (e.aptitudes[linked] || 0) : 0;
      const aptBumps = (e.cp.aptitudeBumps[linked] || 0);
      const finalApt = (apt + aptBumps) * (skillDef.baseMultiplier || 1);
      const fromCP = b.fromCP || 0;

      // Pre-allocation raw = sum of basePackagePts + aptitude (no allocations, no CP).
      // This is the budget source per §C1.
      const preAllocRaw = b.basePkgPts + finalApt;
      if (preAllocRaw > 80) {
        const ov = preAllocRaw - 80;
        if (skillDef.knowOnly) initialSurplus.know += ov;
        else initialSurplus.active += ov;
      }

      const totalRaw = b.totalEffectivePkgPts + finalApt + fromCP;
      const final = Math.min(80, totalRaw);
      const isCapped = totalRaw > 80;

      // Sum positive allocations for this bucket (spend tracking, §C3)
      const allocSum = b.slots.reduce((acc, s) => acc + Math.max(0, s.allocation), 0);
      if (allocSum > 0) {
        const headroom = Math.max(0, 80 - b.basePkgPts - finalApt - fromCP);
        const effectiveAlloc = Math.min(allocSum, headroom);
        const wasted = allocSum - effectiveAlloc;
        if (skillDef.knowOnly) { knowSpent += allocSum; knowWasted += wasted; }
        else { activeSpent += allocSum; activeWasted += wasted; }
      }

      results.push({
        bucketKey: bk,
        skill: b.skill,
        field: b.field,
        deferred: b.deferred,
        slots: b.slots,
        fromPackages: b.basePkgPts,
        reassigned: b.totalEffectivePkgPts - b.basePkgPts,
        fromCP,
        aptBase: finalApt,
        preAllocRaw,
        raw: totalRaw,
        final,
        isCapped,
        knowOnly: !!skillDef.knowOnly
      });
    }

    results.sort((a, b) =>
      a.skill.localeCompare(b.skill) ||
      (a.deferred ? 1 : -1) - (b.deferred ? 1 : -1) ||
      (a.field || "").localeCompare(b.field || "") ||
      a.bucketKey.localeCompare(b.bucketKey)
    );

    const remaining = {
      active: initialSurplus.active - activeSpent,
      know: initialSurplus.know - knowSpent
    };
    return {
      skills: results,
      surplus: { active: Math.max(0, remaining.active), know: Math.max(0, remaining.know) },
      initialSurplus,
      spent: { active: activeSpent, know: knowSpent },
      wasted: { active: activeWasted, know: knowWasted },
      overspent: { active: Math.max(0, -remaining.active), know: Math.max(0, -remaining.know) }
    };
  },
  cpRemaining() {
    const e = STATE.ego;
    const negBonus = e.cp.negativeTraits.reduce((s, nt) => {
      const t = (RULEBOOK_DATA.egoTraits.negative[nt.id] || {});
      return s + ((t.bonus && t.bonus[(nt.level||1)-1]) || 0);
    }, 0);
    const refundCap = Math.min(negBonus, 6);
    const aptCost = Object.values(e.cp.aptitudeBumps).reduce((s,n)=>s+n,0);
    const skillCost = Object.values(e.cp.skillBumps).reduce((s,n)=>s+n,0);
    const specCost = e.cp.specializations.length;
    const langCost = e.cp.extraLangs.length;
    const repCost = Object.values(e.cp.repBumps).reduce((s,n)=>s+n,0);
    const psiCost = e.cp.psiSleights.length;
    const traitCost = e.cp.positiveTraits.reduce((s, t) => {
      const td = RULEBOOK_DATA.egoTraits.positive[t.id] || {};
      return s + ((td.cost && td.cost[(t.level||1)-1]) || 0);
    }, 0);
    const flexCost = Math.max(0, (e.flexEgo - 1)) * 2;
    const spent = aptCost + skillCost + specCost + langCost + repCost + psiCost + traitCost + flexCost;
    const budget = 20 + refundCap;
    return { budget, spent, remaining: budget - spent, refundCap, negBonus };
  },
  mpEconomy() {
    const m = STATE.morph;
    const e = STATE.ego;
    const resourcesTrait = e.cp.positiveTraits.find(t => t.id === "resources");
    const resourcesLvl = resourcesTrait ? resourcesTrait.level : 0;
    const budget = m.mpBudgetBase + resourcesLvl;
    const morph = m.chosen ? RULEBOOK_DATA.morphs[m.chosen] : null;
    const morphCost = morph ? morph.cost : 0;
    const traitCost = 0; // morph traits not yet implemented
    const used = morphCost + traitCost;
    const remaining = Math.max(0, budget - used);
    const flexFromMP = Math.min(3, Math.floor(remaining / 2));
    return { budget, used, remaining, flexFromMP, resourcesLvl };
  },
  derivedStats() {
    const e = STATE.ego;
    const apt = {};
    for (const k of ["COG","INT","REF","SAV","SOM","WIL"]) apt[k] = (e.aptitudes[k]||0) + (e.cp.aptitudeBumps[k]||0);
    const luc = apt.WIL * 2;
    const psi = e.cp.positiveTraits.find(t => t.id === "psi");
    const psiLvl = psi ? psi.level : 0;
    return {
      apt,
      initiative: Math.floor((apt.REF + apt.INT) / 5),
      aptChecks: { COG:apt.COG*3, INT:apt.INT*3, REF:apt.REF*3, SAV:apt.SAV*3, SOM:apt.SOM*3, WIL:apt.WIL*3 },
      lucidity: luc,
      traumaThreshold: Math.floor(luc / 5),
      insanityRating: luc * 2,
      infectionRating: psiLvl * 10
    };
  },
  morphStats() {
    const m = STATE.morph;
    if (!m.chosen) return null;
    const morph = RULEBOOK_DATA.morphs[m.chosen];
    if (!morph) return null;
    const e = STATE.ego;
    const econ = this.mpEconomy();
    const pools = {
      Insight: morph.pools.Insight,
      Moxie: morph.pools.Moxie,
      Vigor: morph.pools.Vigor,
      Flex: morph.pools.Flex + e.flexEgo + econ.flexFromMP
    };
    return { morph, pools, econ };
  },
  partyCoverage() {
    const fs = this.finalSkills().skills;
    const skillVal = (n) => { const r = fs.find(s => s.skill === n); return r ? r.final : 0; };
    const medMax = (() => { let m=0; fs.filter(s => s.skill==="Medicine").forEach(s => { if (s.final > m) m = s.final; }); return m; })();
    const hardMax = (() => { let m=0; fs.filter(s => s.skill==="Hardware").forEach(s => { if (s.final > m) m = s.final; }); return m; })();
    const knowMax = (() => { let m=0; fs.filter(s => s.skill==="Know").forEach(s => { if (s.final > m) m = s.final; }); return m; })();
    const bucket = (v) => v >= 80 ? "high" : v >= 60 ? "mid" : v >= 40 ? "low" : "low";
    const self = {
      combat: Math.max(skillVal("Guns"), skillVal("Melee"), skillVal("Fray")),
      face:   Math.max(skillVal("Persuade"), skillVal("Deceive"), skillVal("Kinesics"), skillVal("Provoke")),
      hacker: Math.max(skillVal("Infosec"), skillVal("Interface"), skillVal("Program")),
      sci:    Math.max(skillVal("Research"), medMax, hardMax, knowMax >= 60 ? knowMax : 0)
    };
    // Party = union (max of self + each partyImport)
    const party = Object.assign({}, self);
    (STATE.partyImports || []).forEach(p => {
      if (p && p.coverage) {
        party.combat = Math.max(party.combat, p.coverage.combat || 0);
        party.face = Math.max(party.face, p.coverage.face || 0);
        party.hacker = Math.max(party.hacker, p.coverage.hacker || 0);
        party.sci = Math.max(party.sci, p.coverage.sci || 0);
      }
    });
    return { self, party };
  },
  validate() {
    const errors = [];
    const warns = [];
    const promptsNarr = [];
    const e = STATE.ego;
    const fs = this.finalSkills();
    fs.skills.forEach(s => { if (s.final > 80) errors.push({step:6, msg:"Skill "+s.skill+" exceeds 80."}); });
    const cp = this.cpRemaining();
    if (cp.remaining < 0) errors.push({step:10, msg:"Customization Points overspent by "+(-cp.remaining)+"."});
    for (const k of ["COG","INT","REF","SAV","SOM","WIL"]) {
      const v = (e.aptitudes[k] || 0) + (e.cp.aptitudeBumps[k] || 0);
      if (e.aptitudeTemplate && (v < 5 || v > 30)) errors.push({step:5, msg:"Aptitude "+k+" out of range [5,30]: "+v});
    }
    if (e.languages.length < 2 && !e.languagesDeferred) warns.push({step:7, msg:"You typically start with 2 languages."});
    const bg = e.background ? RULEBOOK_DATA.backgrounds[e.background] : null;
    const intr = e.interest ? RULEBOOK_DATA.interests[e.interest] : null;
    if ((bg && bg.requiresPsi) || (intr && intr.requiresPsi)) {
      const hasPsi = e.cp.positiveTraits.some(t => t.id === "psi");
      if (!hasPsi) errors.push({step:10, msg:"Your Lost/Async path requires the Psi trait. Auto-add Psi Level 1?", remediation:"buyPsi"});
    }
    if (!e.faction && !e.factionDeferred && !e.factionless) warns.push({step:4, msg:"Faction not set — pick one, defer, or explicitly choose factionless."});
    if (e.motivations.length < 3 && !e.motivationsDeferred) warns.push({step:13, msg:"3 motivations recommended (you have "+e.motivations.length+")."});
    const repTotal = Object.values(e.rep).reduce((s,n)=>s+n,0);
    if (repTotal > 100 && !e.repDeferred) errors.push({step:9, msg:"Total rep "+repTotal+" exceeds starting 100."});
    Object.values(e.rep).forEach((v, i) => { if (v > 80) errors.push({step:9, msg:"Rep "+RULEBOOK_DATA.repNetworks[i]+" exceeds 80."}); });
    // Narrative prompts (gentle)
    if (!e.narrative.concept) promptsNarr.push("Want to write a one-sentence pitch? It helps everyone (including you) remember who this is.");
    if (!e.narrative.identity.taboo) promptsNarr.push("Optional, but a line your character won't cross is often the most useful note for the GM and the table.");
    return { errors, warns, promptsNarr };
  }
};

/* =================================================================
   DISPATCH + RENDER
   ================================================================= */
const STEP_TITLES = [
  null,
  "Background", "Career", "Interest", "Faction",
  "Aptitude Template", "Total Skills", "Languages", "Flex",
  "Reputation", "Customization", "Derived Stats", "Morph & Gear",
  "Motivations"
];
const TOTAL_STEPS = 13;

/* =================================================================
   EP2 HELPERS  —  dice + roll evaluation, ported from Claude Design's
   eclipse-data.js. Pure functions; no DOM, no STATE. Roll mechanics:
     • d100 read as tens × 10 + ones (00 = 100 = auto-success, 99 = auto-fail)
     • doubles (00/11/22/.../99) flip outcome to crit
     • else: roll <= target = success; mos = roll (success) or target - roll (fail)
   APTITUDES carry per-aptitude tone (used by AptitudeChip) and pool family.
   ================================================================= */
const EP2 = {
  APTITUDES: {
    COG: { label:"COG", full:"Cognition",  pool:"insight", tone:"#2563eb" },
    INT: { label:"INT", full:"Intuition",  pool:"insight", tone:"#38bdf8" },
    REF: { label:"REF", full:"Reflexes",   pool:"vigor",   tone:"#991b1b" },
    SOM: { label:"SOM", full:"Somatics",   pool:"vigor",   tone:"#f59e0b" },
    SAV: { label:"SAV", full:"Savvy",      pool:"moxie",   tone:"#ec4899" },
    WIL: { label:"WIL", full:"Willpower",  pool:"moxie",   tone:"#9333ea" }
  },
  SKILL_APTITUDE: {
    "Athletics":"SOM","Fray":"REF","Free Fall":"REF","Guns":"REF",
    "Hardware":"COG","Infiltrate":"REF","Interface":"COG","Kinesics":"SAV",
    "Medicine":"COG","Melee":"SOM","Perceive":"INT","Persuade":"SAV",
    "Pilot":"REF","Program":"COG","Provoke":"SAV","Psi":"WIL",
    "Research":"COG","Sneak":"REF","Survival":"INT","Know":"COG"
  },
  skillAptitude(name) {
    const root = (name || "").split(":")[0].trim();
    return this.SKILL_APTITUDE[root] || "COG";
  },
  rollD100() {
    const tens = Math.floor(Math.random() * 10);
    const ones = Math.floor(Math.random() * 10);
    return { tens, ones, value: tens * 10 + ones, doubles: tens === ones };
  },
  evaluate(roll, target) {
    const v = roll.value;
    if (v === 99) return { outcome:"crit-fail", label:"Critical Failure", mos:0, success:false };
    if (v === 0)  return { outcome:"crit-success", label:"Critical Success", mos:100, success:true };
    const success = v <= target;
    if (roll.doubles) {
      return success
        ? { outcome:"crit-success", label:"Critical Success", mos:v, success:true }
        : { outcome:"crit-fail",    label:"Critical Failure", mos:target - v, success:false };
    }
    return success
      ? { outcome:"success", label:"Success", mos:v, success:true }
      : { outcome:"failure", label:"Failure", mos:target - v, success:false };
  }
};

/* =================================================================
   STUDIO ADAPTER  —  read-only projection of our STATE into the shape
   Claude Design's Studio components expect. Computed every render (cheap;
   no caching). Mutations still go through dispatch().
   ================================================================= */
function studioPcFromState() {
  const e = STATE.ego;
  const ds = derived.derivedStats();
  const ms = derived.morphStats();
  const fs = derived.finalSkills();

  const WT = (ms && ms.morph && ms.morph.WT) || 1;
  const TT = ds.traumaThreshold || 1;

  // Lifepath names (resolve IDs → display strings)
  const bgName = e.background ? (RULEBOOK_DATA.backgrounds[e.background]?.name || "") : "";
  const careerName = e.career ? (RULEBOOK_DATA.careers[e.career]?.name || "") : "";
  const interestName = e.interest ? (RULEBOOK_DATA.interests[e.interest]?.name || "") : "";
  const factionName = (e.faction && !e.factionless) ? (RULEBOOK_DATA.factions[e.faction]?.name || "") : "";

  // Concept fallback: synthesize from career + faction if not user-set
  const conceptFallback = [factionName, careerName].filter(Boolean).join(" ");
  const concept = (e.narrative && e.narrative.concept) || conceptFallback || "";
  // Quote fallback: fallStory if set
  const quoteFallback = (e.narrative && e.narrative.identity && e.narrative.identity.fallStory) || "";

  // Pool shape: our STATE uses {Insight, Moxie, Vigor, Flex} keys with current
  // value (null = max). Studio uses {insight, moxie, vigor, flex} with {max, spent}.
  const poolSrc = { insight:"COG · INT", moxie:"SAV · WIL · REP", vigor:"REF · SOM", flex:"Ego Flex" };
  const pools = {};
  ["Insight","Moxie","Vigor","Flex"].forEach(K => {
    const lower = K.toLowerCase();
    const max = (ms && ms.pools) ? (ms.pools[K] || 0) : 0;
    const cur = STATE.play.pools[K] == null ? max : STATE.play.pools[K];
    pools[lower] = { max, spent: Math.max(0, max - cur), source: poolSrc[lower] };
  });

  // Damage/stress: play.wounds and play.stress are raw totals; counts derive
  // unless explicitly overridden via play.woundsTaken / play.traumasTaken.
  const damageTaken = STATE.play.wounds || 0;
  const stressTaken = STATE.play.stress || 0;
  const woundsTaken = STATE.play.woundsTaken || Math.floor(damageTaken / WT);
  const traumasTaken = STATE.play.traumasTaken || Math.floor(stressTaken / TT);

  // Skills: map finalSkills() result buckets → array of {name, total, aptitude}.
  // finalSkills() returns {skills: [bucket, ...], surplus, ...} — each bucket has
  // {skill, field, final, deferred, ...}. Bug fixed v0.5.3: prior code iterated
  // Object.keys(fs) treating the result as a flat name→value map, so pc.skills
  // was always empty. The Studio sheet's Skills · Active / Knowledge sections
  // showed "No skills allocated yet" for every character built since v0.3,
  // even when chargen filled in 20+ skills.
  // Skip deferred buckets (no resolved field name yet — they can't be rolled).
  // Compose display name as "skill:field" for resolved fields, else just skill.
  const skills = [];
  if (fs && Array.isArray(fs.skills)) {
    fs.skills.forEach(b => {
      if (b.deferred) return;
      if (!(b.final > 0)) return;
      const name = b.field ? b.skill + ":" + b.field : b.skill;
      skills.push({ name, total: b.final, aptitude: EP2.skillAptitude(b.skill) });
    });
    skills.sort((a, b) => a.name.localeCompare(b.name));
  }

  // Reputation: {key: number} → {key: {value, favors:[4]}}. Drop zeroes.
  const reputation = {};
  Object.keys(e.rep || {}).forEach(k => {
    if (e.rep[k] > 0) reputation[k] = { value: e.rep[k], favors: [false, false, false, false] };
  });

  // Morph: resolve from RULEBOOK_DATA.morphs[chosen]. Many morphs in our data
  // don't carry an .armor field — default to {energy:0, kinetic:0}.
  // v0.6: pass through notes, swarm flag, subtype, WT/DUR/DR for downstream readers.
  const morphId = STATE.morph.chosen;
  const morphData = morphId ? RULEBOOK_DATA.morphs[morphId] : null;
  const morph = morphData ? {
    id: morphId,
    name: morphData.name || morphId,
    type: (morphData.type || "morph").toUpperCase(),
    subtype: morphData.subtype || null,
    movementRate: morphData.movement || morphData.movementRate || "",
    ware: (morphData.ware || []).map(w => typeof w === "string" ? { name: w } : w),
    morphTraits: (morphData.traits || []).map(t => typeof t === "string"
      ? { name: t, level: 1 }
      : { name: t.name, level: t.level || 1 }),
    armor: morphData.armor || { energy: 0, kinetic: 0 },
    notes: morphData.notes || "",
    swarm: !!morphData.swarm,
    WT: morphData.WT,
    DUR: morphData.DUR,
    DR: morphData.DR
  } : {
    id:"", name:"", type:"", subtype:null, movementRate:"", ware:[], morphTraits:[], armor:{energy:0,kinetic:0}, notes:"", swarm:false, WT:0, DUR:0, DR:0
  };

  // Ego traits — from cp.positiveTraits + cp.negativeTraits.
  const egoTraits = []
    .concat((e.cp.positiveTraits || []).map(t => typeof t === "string" ? { name: t, level: 1 } : { name: t.name, level: t.level || 1 }))
    .concat((e.cp.negativeTraits || []).map(t => typeof t === "string" ? { name: t, level: 1, negative:true } : { name: t.name, level: t.level || 1, negative:true }));

  // Gear: flatten from RULEBOOK_DATA.gearPacks per current campaign + career.
  // Each item is an opaque string in the pack CSV; we split, lookup metadata
  // in RULEBOOK_REFERENCE.gear_items for cost/weapon info if available, and
  // tag with a stable id for consumables tracking.
  const gear = [];
  const slugify = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const addPack = (packLabel, csv) => {
    if (!csv) return;
    csv.split(/,\s*/).forEach(rawName => {
      const name = rawName.trim().replace(/\.$/, "");
      if (!name) return;
      const id = slugify(packLabel) + ":" + slugify(name);
      const ref = (RULEBOOK_REFERENCE.gear_items && RULEBOOK_REFERENCE.gear_items[slugify(name)]) || null;
      const equippedKey = id + ":equipped";
      const equipped = (STATE.play.consumables && STATE.play.consumables[equippedKey] === false) ? false : true;
      const usesKey = id + ":uses";
      const usesVal = STATE.play.consumables && STATE.play.consumables[usesKey];
      gear.push({
        id, name, pack: packLabel,
        equipped,
        cost: ref?.cost || "—",
        note: ref?.short || "",
        weapon: ref?.weapon || null,
        uses: usesVal == null ? null : usesVal,
        usesMax: ref?.uses_max || null,
      });
    });
  };
  const campaignKey = STATE.meta.campaignType;
  const campaignPack = RULEBOOK_DATA.gearPacks?.campaign?.[campaignKey];
  if (campaignPack) addPack(campaignPack.name || "Campaign Pack", campaignPack.description);
  const careerPack = e.career && RULEBOOK_DATA.gearPacks?.profession?.[e.career];
  if (careerPack) {
    const careerLabel = careerName ? (careerName + " Pack") : "Career Pack";
    addPack(careerLabel, typeof careerPack === "string" ? careerPack : careerPack.description);
  }

  return {
    name: e.name || "",
    player: e.player || "",
    concept,
    muse: e.muse || "",
    quote: e.quote || quoteFallback,
    motivations: e.motivations || [],
    languages: e.languages || [],
    egoTraits,
    background: bgName, career: careerName, interest: interestName, faction: factionName,
    aptitudes: ds.apt,
    pools,
    recharge: STATE.play.recharge || { short1:false, short2:false, long:false },
    derived: {
      wound_threshold: WT,
      durability: (ms && ms.morph && ms.morph.DUR) || 0,
      death_rating: (ms && ms.morph && ms.morph.DR) || 0,
      lucidity: ds.lucidity || 0,
      trauma_threshold: TT,
      insanity_rating: ds.insanityRating || 0,
      initiative: ds.initiative || 0,
    },
    damageTaken, stressTaken, woundsTaken, traumasTaken,
    morph,
    reputation,
    skills,
    gear,
    statuses: STATE.play.statuses || [],
    initiative: STATE.play.initiative || { round:0, position:null },
    notes: STATE.play.notes || "",
    log: STATE.play.log || [],
    /* v6 dossier projections — these surface on the Studio sheet as
       protruding-tab lore panels + portrait slot in the Identity Hero. */
    avatar: (STATE.ego.narrative && STATE.ego.narrative.avatarDataUrl) || null,
    teamBrief: (STATE.ego.narrative && STATE.ego.narrative.teamBrief) || "",
    // v0.5.1 — Studio BACKSTORY panel auto-populates from chargen
    // backstoryAnswers (per-question textareas filled during character
    // creation) when the free-form `backstory` field is empty. The moment
    // the player edits the Studio BACKSTORY panel directly, their text
    // becomes the value of `backstory` and the projection stops auto-filling.
    // This way the chargen Q&A flows into the dossier by default, and the
    // player can curate / expand the prose without re-typing.
    backstory: (() => {
      const n = STATE.ego.narrative || {};
      const free = n.backstory || "";
      if (free) return free;
      const ans = n.backstoryAnswers || {};
      const vals = Object.values(ans).filter(v => v && String(v).trim());
      if (!vals.length) return "";
      return vals.map(v => "› " + String(v).trim()).join("\n\n");
    })()
  };
}

/* =================================================================
   STUDIO MUTATIONS  —  thin wrappers over dispatch() that capture the
   patterns Studio's UI emits. Naming convention: studio<Action>.
   ================================================================= */
function studioSetIn(path, value) {
  // Deep-set; used by EditableText for inline edits on the Studio sheet.
  dispatch(s => {
    let node = s;
    for (let i = 0; i < path.length - 1; i++) {
      if (node[path[i]] == null) node[path[i]] = (typeof path[i+1] === "number") ? [] : {};
      node = node[path[i]];
    }
    const key = path[path.length - 1];
    node[key] = typeof value === "function" ? value(node[key]) : value;
  });
}

function studioRollSkill(skillName, modifier) {
  modifier = modifier || 0;
  const fs = derived.finalSkills();
  const total = (fs && fs[skillName]) || 0;
  const target = Math.max(0, total + modifier);
  const roll = EP2.rollD100();
  const res = EP2.evaluate(roll, target);
  const apt = EP2.skillAptitude(skillName);
  dispatch(s => {
    if (!Array.isArray(s.play.log)) s.play.log = [];
    s.play.log.unshift({
      id: Math.random().toString(36).slice(2),
      t: Date.now(), kind: "roll", text: skillName,
      target, modifier, roll: roll.value, doubles: roll.doubles,
      outcome: res.outcome, result: res.label, mos: res.mos, success: res.success,
      aptitude: apt
    });
    s.play.log = s.play.log.slice(0, 50);
  });
  return { roll, target, res };
}

function studioRollAptitude(aptKey, modifier) {
  modifier = modifier || 0;
  const base = (STATE.ego.aptitudes && STATE.ego.aptitudes[aptKey]) || 0;
  const target = Math.max(0, base * 3 + modifier);
  const roll = EP2.rollD100();
  const res = EP2.evaluate(roll, target);
  dispatch(s => {
    if (!Array.isArray(s.play.log)) s.play.log = [];
    s.play.log.unshift({
      id: Math.random().toString(36).slice(2),
      t: Date.now(), kind: "roll", text: aptKey + " Check",
      target, modifier, roll: roll.value, doubles: roll.doubles,
      outcome: res.outcome, result: res.label, mos: res.mos, success: res.success,
      aptitude: aptKey
    });
    s.play.log = s.play.log.slice(0, 50);
  });
  return { roll, target, res };
}

function studioSpendPool(key, delta) {
  // key is Studio-shape lowercase ("insight"|"moxie"|"vigor"|"flex"). Map to our caps.
  delta = delta == null ? 1 : delta;
  const upper = key.charAt(0).toUpperCase() + key.slice(1);
  const ms = derived.morphStats();
  const max = (ms && ms.pools && ms.pools[upper]) || 0;
  dispatch(s => {
    const cur = s.play.pools[upper] == null ? max : s.play.pools[upper];
    s.play.pools[upper] = Math.max(0, Math.min(max, cur - delta));
  });
}

function studioSetDamage(v) {
  // Studio's setDamage takes raw damage; we store it in play.wounds (historical
  // name, IS the raw value). Auto-bumps woundsTaken to floor(damage/WT) capped at
  // max(current, derived) and ≤9 (Studio's behavior).
  // v0.6: swarm morphs distribute damage — woundsTaken stays at 0; only raw damage accumulates.
  const ms = derived.morphStats();
  const isSwarm = !!(ms && ms.morph && ms.morph.swarm);
  const WT = isSwarm ? 1 : ((ms && ms.morph && ms.morph.WT) || 1);
  const DR = (ms && ms.morph && ms.morph.DR) || 9999;
  dispatch(s => {
    const next = typeof v === "function" ? v(s.play.wounds || 0) : v;
    const damage = Math.max(0, Math.min(DR, next));
    s.play.wounds = damage;
    if (isSwarm) {
      s.play.woundsTaken = 0;
    } else {
      const auto = Math.floor(damage / WT);
      const current = s.play.woundsTaken || 0;
      s.play.woundsTaken = Math.max(current, Math.min(auto, 9));
    }
  });
}

function studioSetWounds(v) {
  dispatch(s => {
    const next = typeof v === "function" ? v(s.play.woundsTaken || 0) : v;
    s.play.woundsTaken = Math.max(0, Math.min(9, next));
  });
}

function studioSetStress(v) {
  const ds = derived.derivedStats();
  const TT = ds.traumaThreshold || 1;
  const IR = ds.insanityRating || 9999;
  dispatch(s => {
    const next = typeof v === "function" ? v(s.play.stress || 0) : v;
    const stress = Math.max(0, Math.min(IR, next));
    const auto = Math.floor(stress / TT);
    const current = s.play.traumasTaken || 0;
    s.play.stress = stress;
    s.play.traumasTaken = Math.max(current, Math.min(auto, 9));
  });
}

function studioSetTraumas(v) {
  dispatch(s => {
    const next = typeof v === "function" ? v(s.play.traumasTaken || 0) : v;
    s.play.traumasTaken = Math.max(0, Math.min(9, next));
  });
}

function studioToggleRecharge(slot) {
  dispatch(s => {
    if (!s.play.recharge) s.play.recharge = { short1:false, short2:false, long:false };
    s.play.recharge[slot] = !s.play.recharge[slot];
  });
}

function studioTriggerRecharge(kind) {
  const ms = derived.morphStats();
  dispatch(s => {
    if (!s.play.recharge) s.play.recharge = { short1:false, short2:false, long:false };
    if (kind === "short") {
      const slot = !s.play.recharge.short1 ? "short1" : (!s.play.recharge.short2 ? "short2" : null);
      if (slot) s.play.recharge[slot] = true;
      ["Insight","Moxie","Vigor","Flex"].forEach(P => {
        const max = (ms && ms.pools && ms.pools[P]) || 0;
        const cur = s.play.pools[P] == null ? max : s.play.pools[P];
        const restore = 1 + Math.floor(Math.random() * 6);  // 1d6
        s.play.pools[P] = Math.min(max, cur + restore);
      });
    } else if (kind === "long") {
      s.play.recharge.short1 = true;
      s.play.recharge.short2 = true;
      s.play.recharge.long = true;
      ["Insight","Moxie","Vigor","Flex"].forEach(P => { s.play.pools[P] = null; });
    } else if (kind === "reset") {
      s.play.recharge.short1 = false;
      s.play.recharge.short2 = false;
      s.play.recharge.long = false;
    }
  });
}

function studioAddStatus(label, modifier) {
  dispatch(s => {
    if (!Array.isArray(s.play.statuses)) s.play.statuses = [];
    s.play.statuses.push({ key: Math.random().toString(36).slice(2), label, modifier: modifier || 0 });
  });
}

function studioRemoveStatus(key) {
  dispatch(s => {
    if (!Array.isArray(s.play.statuses)) s.play.statuses = [];
    s.play.statuses = s.play.statuses.filter(st => st.key !== key);
  });
}

function studioToggleGear(id) {
  // We store gear-equipped state in play.consumables as `<id>:equipped`.
  // Default = true (equipped). False = stowed.
  dispatch(s => {
    if (!s.play.consumables) s.play.consumables = {};
    const k = id + ":equipped";
    const cur = s.play.consumables[k];
    s.play.consumables[k] = cur === false ? true : false;
  });
}

function studioConsumeGear(id, delta) {
  delta = delta == null ? -1 : delta;
  dispatch(s => {
    if (!s.play.consumables) s.play.consumables = {};
    const k = id + ":uses";
    const cur = s.play.consumables[k] || 0;
    s.play.consumables[k] = Math.max(0, cur + delta);
  });
}

function dispatch(mutator, opts) {
  try { mutator(STATE); } catch(e) { console.error("dispatch error", e); }
  scheduleSave();
  // v0.10: opts.skipRerender lets text-input handlers commit without losing focus
  // (rerender would re-mount the input and drop the cursor). Always saves.
  if (!opts || !opts.skipRerender) rerender();
  // v0.10.4: schedule auto-push if in a team room (debounced 5s, hash-skipped).
  // Hash is over STATE.ego + STATE.play only so poll-driven partyImports updates
  // don't trigger pushes. Gated against AFK suspend + hidden tab inside the
  // debounced callback.
  if (typeof scheduleAutoPushLive === "function" && STATE.team && STATE.team.roomId) {
    scheduleAutoPushLive();
  }
}

const scheduleSave = debounce(() => {
  try {
    STATE.meta.savedAt = new Date().toISOString();
    localStorage.setItem("ep2charv1", JSON.stringify(STATE));
  } catch(e) { console.warn("persist failed", e); }
}, 250);

function loadFromLocalStorage() {
  try {
    const raw = localStorage.getItem("ep2charv1");
    if (!raw) return false;
    let loaded = JSON.parse(raw);
    if (!loaded || !loaded.meta) return false;
    loaded = migrateToCurrent(loaded);
    if (loaded.meta.schemaVersion === SCHEMA_VERSION) {
      const fresh = newState();
      Object.assign(fresh, loaded);
      fresh.meta = Object.assign(fresh.meta, loaded.meta);
      fresh.ego = Object.assign(fresh.ego, loaded.ego || {});
      if (loaded.ego) {
        fresh.ego.narrative = Object.assign(newState().ego.narrative, loaded.ego.narrative || {});
        fresh.ego.cp = Object.assign(newState().ego.cp, loaded.ego.cp || {});
        fresh.ego.slotAllocations = loaded.ego.slotAllocations || {};
        fresh.ego.customSlots = loaded.ego.customSlots || [];
        fresh.ego.customSlotCounter = loaded.ego.customSlotCounter || 0;
      }
      fresh.play = Object.assign(newState().play, loaded.play || {});
      fresh.play.pools = Object.assign(newState().play.pools, (loaded.play && loaded.play.pools) || {});
      STATE = fresh;
      return true;
    }
  } catch(e) { console.warn("load failed", e); }
  return false;
}

function exportJSON() {
  // Build a summary block so consumers can read the character without re-running derivation
  const fs = derived.finalSkills();
  const ds = derived.derivedStats();
  const mc = derived.morphStats();
  const cov = derived.partyCoverage();
  const exportObj = clone(STATE);
  exportObj.summary = {
    name: STATE.ego.name || "Unnamed",
    concept: STATE.ego.narrative.concept,
    lifepath: [
      STATE.ego.background ? RULEBOOK_DATA.backgrounds[STATE.ego.background].name : null,
      STATE.ego.career ? RULEBOOK_DATA.careers[STATE.ego.career].name : null,
      STATE.ego.interest ? RULEBOOK_DATA.interests[STATE.ego.interest].name : null
    ].filter(Boolean).join(" / "),
    faction: STATE.ego.factionless ? "Factionless" : (STATE.ego.faction ? RULEBOOK_DATA.factions[STATE.ego.faction].name : (STATE.ego.factionDeferred ? "Deferred" : null)),
    aptitudes: ds.apt,
    skills: fs.skills.map(s => ({ skill:s.skill, field:s.field, final:s.final })),
    derived: { initiative:ds.initiative, lucidity:ds.lucidity, TT:ds.traumaThreshold, IR:ds.insanityRating, IRating:ds.infectionRating },
    morph: mc ? { name:mc.morph.name, type:mc.morph.type, WT:mc.morph.WT, DUR:mc.morph.DUR, DR:mc.morph.DR, pools:mc.pools, ware:mc.morph.ware } : null,
    coverage: cov.self,
    exportedAt: new Date().toISOString(),
    toolVersion: STATE.meta.toolVersion
  };
  const json = JSON.stringify(exportObj, null, 2);
  const blob = new Blob([json], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  const fname = (STATE.ego.name || "ep2-character").replace(/[^a-z0-9_-]+/gi, "_").toLowerCase() + ".ep2.json";
  a.download = fname;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast("Exported " + fname);
}

function importJSON(text, asPartyMember) {
  try {
    let loaded = JSON.parse(text);
    if (!loaded || !loaded.meta) {
      alert("This file is not a recognizable EP2 character export.");
      return;
    }
    loaded = migrateToCurrent(loaded);
    if (loaded.meta.schemaVersion !== SCHEMA_VERSION) {
      alert("This file is from a newer version of the tool. Cannot import.");
      return;
    }
    if (asPartyMember) {
      // v0.9.2: build a v7-complete entry via shared helper so file-imports
      // get id/source/lastSyncedAt/gmNotes/syncUrl just like URL-share imports do.
      const entry = buildPartyImportEntry(loaded, "file");
      // Upsert if a partyImports entry with the same characterId already exists.
      const existingIdx = entry.id ? STATE.partyImports.findIndex(p => p.id === entry.id) : -1;
      if (existingIdx >= 0) {
        const existingGm = STATE.partyImports[existingIdx].gmNotes || {};
        entry.gmNotes = Object.assign(
          { wounds:0, stress:0, initiative:null, statusEffects:[], notes:"" },
          existingGm
        );
        entry.syncUrl = STATE.partyImports[existingIdx].syncUrl;
        STATE.partyImports[existingIdx] = entry;
      } else {
        STATE.partyImports.push(entry);
      }
      scheduleSave(); rerender();
      showToast((existingIdx >= 0 ? "Updated " : "Added ") + entry.name + " (from file)");
    } else {
      const fresh = newState();
      Object.assign(fresh, loaded);
      fresh.ego = Object.assign(newState().ego, loaded.ego || {});
      fresh.ego.narrative = Object.assign(newState().ego.narrative, (loaded.ego && loaded.ego.narrative) || {});
      fresh.ego.cp = Object.assign(newState().ego.cp, (loaded.ego && loaded.ego.cp) || {});
      fresh.ego.slotAllocations = (loaded.ego && loaded.ego.slotAllocations) || {};
      fresh.ego.customSlots = (loaded.ego && loaded.ego.customSlots) || [];
      fresh.ego.customSlotCounter = (loaded.ego && loaded.ego.customSlotCounter) || 0;
      delete fresh.summary;
      STATE = fresh;
      scheduleSave(); rerender();
      showToast("Imported character: " + (STATE.ego.name || "Unnamed"));
    }
  } catch(e) {
    // v0.9.1: log full stack to console for diagnosis.
    console.error("[importJSON] failed:", e);
    alert("Import failed: " + e.message + "\n\nThis is a bug. Open the browser console (F12 → Console tab) and copy the error details for the developer.");
  }
}

function showToast(msg) {

  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

/* stripPortrait — clone state with avatarDataUrl removed. Used for compact
   share-links (portraits are ~30-50KB JPEG; stripping cuts URL by ~85%). */
function stripPortrait(state) {
  const copy = JSON.parse(JSON.stringify(state));
  if (copy.ego && copy.ego.narrative) copy.ego.narrative.avatarDataUrl = null;
  return copy;
}

/* encodeShareUrl — STATE → LZ-compressed → base64 URL fragment.
   Returns the FULL URL the user can copy (location.origin + path + #share=...). */
function encodeShareUrl(state, opts) {
  opts = opts || {};
  const payload = opts.stripPortrait ? stripPortrait(state) : state;
  const json = JSON.stringify(payload);
  const compressed = LZString.compressToEncodedURIComponent(json);
  return location.origin + location.pathname + "#share=" + compressed;
}

/* decodeShareUrl — parse a URL fragment OR raw payload string, return parsed
   STATE or null. Accepts either:
     - "#share=xyz..." (fragment from URL)
     - "https://...#share=xyz..." (full URL)
     - "xyz..." (raw payload) */
function decodeShareUrl(input) {
  if (!input || typeof input !== "string") return null;
  let payload = input;
  const idx = input.indexOf("#share=");
  if (idx >= 0) payload = input.slice(idx + 7);
  else if (input.startsWith("share=")) payload = input.slice(6);
  try {
    const json = LZString.decompressFromEncodedURIComponent(payload);
    if (!json) return null;
    return JSON.parse(json);
  } catch (e) { return null; }
}

/* showQrModal — render the URL as a scannable QR via QrCreator. Portrait is

  }

  root.appendChild(panel);

  const onKey = (ev) => { if (ev.key === "Escape") { root.remove(); document.removeEventListener("keydown", onKey); } };
  document.addEventListener("keydown", onKey);

/* importShareSnapshot — apply a parsed state as party member or self.
   Reuses migrateToCurrent + the same shape as importJSON's two paths.
   v0.9.1: defensive — validates parsedState shape before mutating STATE, and
   logs full stack to console on failure so users can DM the trace. */
function importShareSnapshot(parsedState, asPartyMember, sourceLabel) {
  // v0.9.1: validate BEFORE entering try block so we report shape errors
  // distinctly from migration/rerender errors.
  if (!parsedState || typeof parsedState !== "object") {
    alert("Import failed: share data is empty or not an object. The share link may be corrupted.");
    return;
  }
  if (!parsedState.meta || typeof parsedState.meta.schemaVersion !== "number") {
    alert("Import failed: share data is missing required metadata (meta.schemaVersion). The share link may be from a different tool or corrupted.");
    return;
  }
  if (!parsedState.ego || typeof parsedState.ego !== "object") {
    alert("Import failed: share data is missing the ego object. The share link is malformed.");
    return;
  }
  try {
    let loaded = migrateToCurrent(parsedState);
    if (loaded.meta.schemaVersion !== SCHEMA_VERSION) {
      alert("This share is from a newer tool version (v" + loaded.meta.schemaVersion + ") than this tool supports (v" + SCHEMA_VERSION + "). Cannot import.");
      return;
    }
    if (asPartyMember) {
      // v0.9.2: use shared helper so URL-share and file-import entries are identical in shape.
      const entry = buildPartyImportEntry(loaded, sourceLabel || "URL");
      // Force lastSyncedAt to "now" for URL/live imports (helper falls back to summary.exportedAt;
      // for inbound shares we want the moment we received them, not when the GM exported).
      entry.lastSyncedAt = new Date().toISOString();
      const existingIdx = entry.id ? STATE.partyImports.findIndex(p => p.id === entry.id) : -1;
      dispatch(s => {
        if (existingIdx >= 0) {
          // Preserve gmNotes from existing entry; replace .full.
          // Defensively rebuild gmNotes if existing entry was missing fields
          // (could happen with very old saves).
          const existingGm = s.partyImports[existingIdx].gmNotes || {};
          entry.gmNotes = Object.assign(
            { wounds:0, stress:0, initiative:null, statusEffects:[], notes:"" },
            existingGm
          );
          entry.syncUrl = s.partyImports[existingIdx].syncUrl;
          s.partyImports[existingIdx] = entry;
        } else {
          s.partyImports.push(entry);
        }
      });
      showToast((existingIdx >= 0 ? "Updated " : "Added ") + entry.name);
    } else {
      const fresh = newState();
      Object.assign(fresh, loaded);
      fresh.ego = Object.assign(newState().ego, loaded.ego || {});
      fresh.ego.narrative = Object.assign(newState().ego.narrative, (loaded.ego && loaded.ego.narrative) || {});
      fresh.ego.cp = Object.assign(newState().ego.cp, (loaded.ego && loaded.ego.cp) || {});
      fresh.ego.slotAllocations = (loaded.ego && loaded.ego.slotAllocations) || {};
      fresh.ego.customSlots = (loaded.ego && loaded.ego.customSlots) || [];
      fresh.ego.customSlotCounter = (loaded.ego && loaded.ego.customSlotCounter) || 0;
      // v0.9.1: ensure play substate isn't missing keys after merge (older
      // exports may have play.wounds but not woundsTaken, etc.)
      fresh.play = Object.assign(newState().play, loaded.play || {});
      fresh.play.pools = Object.assign(newState().play.pools, (loaded.play && loaded.play.pools) || {});
      // partyImports from an incoming "load-as-self" share should NOT clobber
      // the GM's own party list — keep whatever was already loaded.
      if (Array.isArray(loaded.partyImports) && loaded.partyImports.length > 0 && STATE.partyImports.length === 0) {
        fresh.partyImports = loaded.partyImports;
      } else {
        fresh.partyImports = STATE.partyImports;
      }
      delete fresh.summary;
      STATE = fresh;
      scheduleSave(); rerender();
      showToast("Imported: " + (STATE.ego.name || "Unnamed"));
    }
  } catch (e) {
    // v0.9.1: dump full stack to console for diagnosis; show a more helpful
    // message in the alert. The most common failure mode is the rerender
    // hitting an unsafe property access on freshly-imported state.
    console.error("[importShareSnapshot] failed:", e);
    alert("Import failed: " + e.message + "\n\nThis is a bug. Open the browser console (F12 → Console tab) and copy the error details for the developer.");
  }
}

/* handleShareHash — runs once on page load. If URL has #share=..., decode and
   show the import prompt. Hash is cleared after handling. */
function handleShareHash() {
  const hash = location.hash || "";
  if (!hash.includes("share=")) return;
  const parsed = decodeShareUrl(hash);
  if (!parsed) {
    showToast("Share link malformed or corrupted");
    history.replaceState(null, "", location.pathname);
    return;
  }
  // Clear hash so refresh doesn't re-prompt
  history.replaceState(null, "", location.pathname);
  showImportPromptModal(parsed, "URL");
}

/* handleLiveParam — runs once on page load. If URL has ?live=<id>, fetch the
   character from the backend and show import prompt. */
async function handleLiveParam() {
  const params = new URLSearchParams(location.search);
  const liveId = params.get("live");
  if (!liveId) return;
  // Clear the param so refresh doesn't re-prompt
  history.replaceState(null, "", location.pathname);
  try {
    const resp = await fetch("/api/share/" + encodeURIComponent(liveId));
    if (!resp.ok) {
      showToast("Live link not found or expired");
      return;
    }
    const remote = await resp.json();
    if (!remote || !remote.data) {
      showToast("Live link malformed");
      return;
    }
    const json = LZString.decompressFromEncodedURIComponent(remote.data);
    const parsed = json ? JSON.parse(json) : null;
    if (!parsed) {
      showToast("Live link could not be decoded");
      return;
    }
    showImportPromptModal(parsed, "LIVE");
  } catch (e) {
    showToast("Live fetch failed: " + e.message);
  }
}

/* createTeamRoom — generates a fresh roomId, pushes own character to layer 1,
   POSTs a new team doc to layer 2, sets STATE.team.roomId. Used by the
   "Create Team Room" button. */
async function createTeamRoom() {
  // Ensure own character has an id (pushToLive does this too, but we need it
  // before the POST body is built).
  if (!STATE.ego.characterId) {
    dispatch(s => { s.ego.characterId = makeCharacterId(); });
  }
  // Disable double-click via window-level flag.
  if (window.__teamCreateInFlight) return;
  window.__teamCreateInFlight = true;
  try {
    // Push self to layer 1 first so the room has at least one fetchable member.
    await pushSelfQuietly();
    const roomId = makeCharacterId();
    const body = {
      teamName: (STATE.team && STATE.team.teamName) || "",
      members: [STATE.ego.characterId],
      initiative: []
    };
    let resp = await fetch("/api/team/" + encodeURIComponent(roomId), {
      method: "POST",
      headers: {"content-type":"application/json"},
      body: JSON.stringify(body)
    });
    if (resp.status === 409) {
      // 1-in-2^128 chance of UUID collision; retry once with fresh id.
      const retryId = makeCharacterId();
      resp = await fetch("/api/team/" + encodeURIComponent(retryId), {
        method: "POST", headers: {"content-type":"application/json"}, body: JSON.stringify(body)
      });
      if (!resp.ok) {
        showToast("Team room create failed (" + resp.status + ")");
        return;
      }
      dispatch(s => { s.team.roomId = retryId; });
    } else if (!resp.ok) {
      const text = await resp.text();
      showToast("Team room create failed (" + resp.status + ") — " + text.slice(0, 80));
      return;
    } else {
      dispatch(s => { s.team.roomId = roomId; });
    }
    showTeamRoomCreatedModal();
    startTeamRoomPolling();
  } catch (e) {
    console.error("[createTeamRoom]", e);
    showToast("Team room create failed: " + e.message);
  } finally {
    window.__teamCreateInFlight = false;
  }
}

/* pushSelfQuietly — push current STATE to /api/share/{characterId} without
   opening the post-push modal. Used internally by team-room flows. */
async function pushSelfQuietly() {
  if (!STATE.ego.characterId) {
    dispatch(s => { s.ego.characterId = makeCharacterId(); });
  }
  const id = STATE.ego.characterId;
  const payload = JSON.stringify({
    data: LZString.compressToEncodedURIComponent(JSON.stringify(STATE)),
    name: STATE.ego.name || "Unnamed",
    updatedAt: new Date().toISOString()
  });
  const resp = await fetch("/api/share/" + encodeURIComponent(id), {
    method: "POST", headers: {"content-type":"application/json"}, body: payload
  });
  if (!resp.ok) {
    throw new Error("share push failed: " + resp.status);
  }
}

/* ============================================================== */
/* v0.10.4 Quiet Sync — event-driven push + adaptive read + AFK   */
/* ============================================================== */

/* Producer state */
let _lastPushedPayload = null;      // hash of last pushed payload (player-owned slice)

/* Consumer state (poll cadence) */
let _idleCount = 0;                 // consecutive polls with no member updatedAt advance
let _pollIntervalMs = 60 * 1000;    // current poll interval

/* AFK state */
let _lastInputAt = Date.now();
const AFK_THRESHOLD_MS = 5 * 60 * 1000;   // 5 minutes
let _inputTrackersInstalled = false;

/* _playerOwnedPayload — the bytes that represent the player's authored state.
   Excludes partyImports (which the poller mutates) and team.lastPolledAt (which
   updates on every poll). Used both as the hash key and as the wire payload —
   compressing once is cheaper than compressing twice. */
function _playerOwnedPayload() {
  // Note: we still push the FULL STATE in maybeAutoPushSelf below — this slice
  // is only the *hash key*. That way teammates receiving via poll see the full
  // state but the producer can detect no-op edits cheaply.
  return LZString.compressToEncodedURIComponent(JSON.stringify({
    ego: STATE.ego,
    play: STATE.play
  }));
}

/* _isSuspended — AFK detection. True when no user input for AFK_THRESHOLD_MS
   AND tab is not visible. Both conditions required: if the user is reading
   the page (visible but no input), we keep syncing; if they switched tabs
   briefly (hidden but recent input), we keep syncing. */
function _isSuspended() {
  const idleMs = Date.now() - _lastInputAt;
  if (typeof document === "undefined") return false; // node sandbox
  return idleMs > AFK_THRESHOLD_MS && document.visibilityState !== "visible";
}

/* maybeAutoPushSelf — push current STATE to /api/share/{characterId} ONLY if
   the player-owned slice has changed since the last push. Otherwise skip
   entirely (zero KV cost). */
async function maybeAutoPushSelf() {
  if (!STATE.team || !STATE.team.roomId) return;
  if (!STATE.ego.characterId) return;
  const hashKey = _playerOwnedPayload();
  if (hashKey === _lastPushedPayload) return;   // no-op: skip
  try {
    const fullPayload = LZString.compressToEncodedURIComponent(JSON.stringify(STATE));
    const resp = await fetch("/api/share/" + encodeURIComponent(STATE.ego.characterId), {
      method: "POST", headers: {"content-type":"application/json"},
      body: JSON.stringify({
        data: fullPayload,
        name: STATE.ego.name || "Unnamed",
        updatedAt: new Date().toISOString()
      })
    });
    if (resp.ok) {
      _lastPushedPayload = hashKey;
    } else {
      console.warn("[auto-push] non-ok status:", resp.status);
    }
  } catch (e) {
    console.warn("[auto-push]", e && e.message);
  }
}

/* scheduleAutoPushLive — debounced 5s wrapper around maybeAutoPushSelf.
   Gated on visibility + not-suspended; called from dispatch() tail. */
const scheduleAutoPushLive = debounce(() => {
  if (!STATE.team || !STATE.team.roomId) return;
  if (_isSuspended()) return;
  if (typeof document !== "undefined" && document.visibilityState !== "visible") return;
  maybeAutoPushSelf();
}, 5000);

/* _trackInput — bumps _lastInputAt on any user input. If the team-room timer
   was suspended (handle is null while roomId is set), resume it with an
   immediate one-shot poll. */
function _trackInput() {
  _lastInputAt = Date.now();
  if (STATE.team && STATE.team.roomId && !_teamRoomPollHandle) {
    _idleCount = 0;
    _pollIntervalMs = 60 * 1000;
    try { pollTeamRoomOnce(); } catch (e) { console.warn("[input resume]", e && e.message); }
    _scheduleNextPoll();
  }
}

/* _installInputTrackers — idempotent. Hooks document input events to refresh
   the AFK timer. Called once from boot. */
function _installInputTrackers() {
  if (_inputTrackersInstalled || typeof document === "undefined") return;
  ["pointerdown","keydown","touchstart","wheel"].forEach(ev =>
    document.addEventListener(ev, _trackInput, { passive: true, capture: true })
  );
  _inputTrackersInstalled = true;
}

/* _scheduleNextPoll — recursive setTimeout for adaptive cadence. Reads the
   current _pollIntervalMs at scheduling time so changes propagate. */
function _scheduleNextPoll() {
  if (_teamRoomPollHandle) { clearTimeout(_teamRoomPollHandle); _teamRoomPollHandle = null; }
  if (!STATE.team || !STATE.team.roomId) return;
  _teamRoomPollHandle = setTimeout(async () => {
    // Re-check all gates at tick time
    const visible = typeof document === "undefined" || document.visibilityState === "visible";
    const drawerOpen = typeof document !== "undefined" && !!document.getElementById("team-member-drawer-root");
    const suspended = _isSuspended();
    if (visible && !drawerOpen && !suspended) {
      try { await pollTeamRoomOnce(); } catch (e) { console.warn("[poll tick]", e && e.message); }
    }
    // Suspend = stop the chain entirely; _trackInput / visibility resume re-arm it.
    if (suspended) {
      _teamRoomPollHandle = null;
      return;
    }
    _scheduleNextPoll();
  }, _pollIntervalMs);
}

/* joinTeamRoom — fetch the team doc, push own character to layer 1, PATCH the
   doc to add own characterId, set local STATE.team.roomId. */
async function joinTeamRoom(roomId) {
  if (!roomId) return;
  try {
    // Verify room exists
    const checkResp = await fetch("/api/team/" + encodeURIComponent(roomId));
    if (!checkResp.ok) {
      showToast("Team room not found or expired");
      return false;
    }
    const remoteDoc = await checkResp.json();
    // Ensure own characterId
    if (!STATE.ego.characterId) {
      dispatch(s => { s.ego.characterId = makeCharacterId(); });
    }
    // Push self to layer 1
    await pushSelfQuietly();
    // PATCH team doc to add self as member (set-union; safe if already present)
    const patchResp = await fetch("/api/team/" + encodeURIComponent(roomId), {
      method: "PATCH", headers: {"content-type":"application/json"},
      body: JSON.stringify({ members: [STATE.ego.characterId] })
    });
    if (!patchResp.ok) {
      showToast("Join failed (" + patchResp.status + ")");
      return false;
    }
    dispatch(s => {
      s.team.roomId = roomId;
      // Pull teamName from remote so the joiner sees what the host typed.
      if (remoteDoc && typeof remoteDoc.teamName === "string") s.team.teamName = remoteDoc.teamName;
    });
    showToast("Joined team " + (remoteDoc.teamName || ""));
    startTeamRoomPolling();
    return true;
  } catch (e) {
    console.error("[joinTeamRoom]", e);
    showToast("Join failed: " + e.message);
    return false;
  }
}

/* Team-room polling — cost-aware. Default 60s interval; pauses when tab is
   hidden; uses updatedAt short-circuit so member docs only refetch when their
   listed updatedAt has advanced. */
let _teamRoomPollHandle = null;
let _teamRoomPollLastTeamDoc = null;

async function pollTeamRoomOnce() {
  if (!STATE.team || !STATE.team.roomId) return;
  const roomId = STATE.team.roomId;
  try {
    const resp = await fetch("/api/team/" + encodeURIComponent(roomId));
    if (!resp.ok) {
      if (resp.status === 404) {
        // Room expired or was deleted
        showToast("Team room expired — leaving locally");
        leaveTeamRoom();
      }
      return;
    }
    const teamDoc = await resp.json();
    _teamRoomPollLastTeamDoc = teamDoc;
    // Sync team metadata from remote
    let metaChanged = false;
    dispatch(s => {
      if (typeof teamDoc.teamName === "string" && teamDoc.teamName !== s.team.teamName) {
        s.team.teamName = teamDoc.teamName;
        metaChanged = true;
      }
      s.team.lastPolledAt = new Date().toISOString();
    }, { skipRerender: true });

    // For each member in the team doc (except self), fetch their char if we haven't
    // cached it or if there's no cached lastSyncedAt match.
    const remoteMembers = Array.isArray(teamDoc.members) ? teamDoc.members : [];
    let anyMemberUpdated = false;
    for (const memberId of remoteMembers) {
      if (memberId === STATE.ego.characterId) continue; // skip self
      // Find or create the partyImports entry for this member
      let entry = STATE.partyImports.find(p => p.id === memberId);
      // Fetch the member's live share
      const memberResp = await fetch("/api/share/" + encodeURIComponent(memberId));
      if (!memberResp.ok) continue; // member's share might not exist yet (or expired)
      const memberShare = await memberResp.json();
      if (!memberShare || !memberShare.data) continue;
      // Short-circuit: skip if our cached lastSyncedAt matches the remote updatedAt
      if (entry && entry.lastSyncedAt === memberShare.updatedAt) continue;
      // Decode
      let parsed = null;
      try {
        const json = LZString.decompressFromEncodedURIComponent(memberShare.data);
        parsed = json ? JSON.parse(json) : null;
      } catch (e) { continue; }
      if (!parsed) continue;
      const migrated = migrateToCurrent(parsed);
      // Update or insert
      const teammateEntry = buildPartyImportEntry(migrated, "live");
      teammateEntry.id = memberId;
      teammateEntry.lastSyncedAt = memberShare.updatedAt;
      dispatch(s => {
        const idx = s.partyImports.findIndex(p => p.id === memberId);
        if (idx >= 0) {
          // Preserve gmNotes from existing entry
          const existingGm = s.partyImports[idx].gmNotes || {};
          teammateEntry.gmNotes = Object.assign(
            { wounds:0, stress:0, initiative:null, statusEffects:[], notes:"" },
            existingGm
          );
          s.partyImports[idx] = teammateEntry;
        } else {
          s.partyImports.push(teammateEntry);
        }
      }, { skipRerender: true });
      anyMemberUpdated = true;
    }

    // Rerender if anything changed
    if (metaChanged || anyMemberUpdated) {
      rerender();
    }

    // v0.10.4 Mechanism 2: adaptive cadence based on remote activity.
    if (anyMemberUpdated || metaChanged) {
      _idleCount = 0;
      _pollIntervalMs = 60 * 1000;          // reset to snappy
    } else {
      _idleCount++;
      if (_idleCount >= 10 && _pollIntervalMs < 15 * 60 * 1000) {
        _pollIntervalMs = 15 * 60 * 1000;   // long idle → 15 min
      } else if (_idleCount >= 3 && _pollIntervalMs < 5 * 60 * 1000) {
        _pollIntervalMs = 5 * 60 * 1000;    // mild idle → 5 min
      }
    }
  } catch (e) {
    // Polling errors shouldn't surface to the user as toasts — they happen
    // silently. Show offline indicator on next render cycle.
    console.warn("[poll team room]", e && e.message);
  }
}

function startTeamRoomPolling() {
  stopTeamRoomPolling();
  // v0.10.4: reset cadence state on every fresh start (create/join/resume)
  _idleCount = 0;
  _pollIntervalMs = 60 * 1000;
  _lastInputAt = Date.now();  // entering a room counts as "active"
  // Immediate one-shot
  pollTeamRoomOnce();
  // Recursive setTimeout for adaptive cadence
  _scheduleNextPoll();
  // On tab becoming visible again, do an immediate one-shot
  if (typeof document !== "undefined") {
    document.addEventListener("visibilitychange", _teamRoomVisibilityHandler);
  }
}

function stopTeamRoomPolling() {
  if (_teamRoomPollHandle) {
    clearTimeout(_teamRoomPollHandle);
    _teamRoomPollHandle = null;
  }
  if (typeof document !== "undefined") {
    document.removeEventListener("visibilitychange", _teamRoomVisibilityHandler);
  }
}

function _teamRoomVisibilityHandler() {
  if (document.visibilityState === "visible" && STATE.team && STATE.team.roomId) {
    // v0.10.4: visibility resume = reset cadence to snappy + immediate fetch.
    _idleCount = 0;
    _pollIntervalMs = 60 * 1000;
    _lastInputAt = Date.now();
    pollTeamRoomOnce();
    // If timer chain died from suspend, re-arm it.
    if (!_teamRoomPollHandle) _scheduleNextPoll();
  }
}

/* =================================================================
   LEXICON OVERLAY — Always-accessible glossary of core EP2 setting
   concepts (Fall, Mesh, Resleeving, etc.). Renders as a fixed-position
   modal when STATE.meta.lexiconOpen is true. Backdrop click + ESC dismiss.
   Cross-references in other tooltips visually mark these terms; the
   overlay is the canonical destination for "what does this term mean".
   ================================================================= */
function buildLexiconOverlay() {
  const lex = (RULEBOOK_REFERENCE.lexicon) || {};
  // Stable order: by name (drop _meta if subagent added one)
  const keys = Object.keys(lex).filter(k => !k.startsWith("_")).sort((a, b) => {
    const an = (lex[a].name || a).toLowerCase();
    const bn = (lex[b].name || b).toLowerCase();
    return an < bn ? -1 : an > bn ? 1 : 0;
  });
  const root = h("div", {class:"lex-overlay-root"});
  // Backdrop closes on click
  const backdrop = h("div", {class:"lex-backdrop",
    onClick: () => dispatch(s => { s.meta.lexiconOpen = false; })});
  root.appendChild(backdrop);
  const panel = h("div", {class:"lex-panel"});
  // Header
  const header = h("div", {class:"lex-header"},
    h("div", {class:"lex-title"}, "Setting Lexicon"),
    h("div", {class:"lex-subtitle"}, "Core EP2 concepts that show up across the sheet"),
    h("button", {class:"lex-close", title:"Close (Esc)",
      onClick: () => dispatch(s => { s.meta.lexiconOpen = false; })}, "✕")
  );
  panel.appendChild(header);
  // Body — either entries or "loading" if subagent hasn't returned
  const body = h("div", {class:"lex-body"});
  if (keys.length === 0) {
    body.appendChild(h("div", {class:"lex-empty"},
      h("p", null, "Lexicon content is being extracted from the EP2 corebook."),
      h("p", {class:"muted"}, "(Subagent in flight. This panel will populate when the JSON write completes.)")));
  } else {
    keys.forEach(k => {
      const entry = lex[k];
      const card = h("div", {class:"lex-card", id:"lex-"+k});
      card.appendChild(h("h3", {class:"lex-name"}, entry.name || k));
      if (entry.short) card.appendChild(h("div", {class:"lex-short"}, entry.short));
      if (entry.setting) card.appendChild(h("p", {class:"lex-setting"}, entry.setting));
      if (entry.implications) {
        const impl = h("p", {class:"lex-impl"});
        impl.appendChild(h("b", null, "Why it matters in play: "));
        impl.appendChild(h("span", null, entry.implications));
        card.appendChild(impl);
      }
      if (entry.page) card.appendChild(h("div", {class:"lex-page"}, "book p" + entry.page));
      body.appendChild(card);
    });
  }
  panel.appendChild(body);
  root.appendChild(panel);
  return root;
}

  document.body.classList.toggle("play-mode", STATE.meta.mode === "play");
  document.body.classList.toggle("party-mode", STATE.meta.mode === "party");

  } else {

  app.appendChild(buildChrome());

function triggerImport(asPartyMember) {
  const input = $("#hidden-import");
  input.onchange = (ev) => {
    const f = ev.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => importJSON(reader.result, asPartyMember);
    reader.readAsText(f);
    input.value = "";
  };
  input.click();
