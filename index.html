      "hooks": "the engineer with patents under three names; the autonomist designer who open-sources everything.",
      "page": 52
    },
    "genetics": {
      "name": "Genetics",
      "setting": "The science of heredity and gene expression — used in morph design, uplift biology, exoplanet astrobiology, illegal flesh markets, and the genefixing that nearly everyone now takes for granted. Heavy overlap with biotech and biomorph engineering.",
      "hooks": "the geneticist who designed an uplift line; the Argonaut working on open-source genome libraries.",
      "page": 52
    },
    "botany": {
      "name": "Botany",
      "setting": "Plant science — habitat agriculture, hydroponics, ecopoesis on Mars, the strange flora found on exoplanets via the gates. Critical in biohabitats like Nang Tani and in any closed ecosystem.",
      "hooks": "the agronomist who has grown food in three different gravities; the xenobotanist cataloguing exoplanet flora.",
      "page": 52
    },
    "zoology": {
      "name": "Zoology",
      "setting": "Animal biology — including uplift species (treated also as transhuman, but biologically zoological), non-sapient critters used as pets and tools, exoplanet fauna, and the strange biological products of exhuman experimentation.",
      "hooks": "the zoologist whose work touches the uplift-rights question; the field researcher cataloguing exoplanet fauna.",
      "page": 52
    },
    "investigation": {
      "name": "Investigation",
      "setting": "The professional practice of detective work — building cases, running informants, reading crime scenes, knowing which questions break which suspects. Distinct from forensics: investigation is the social and procedural side of solving cases.",
      "hooks": "the ex-detective who left the force but kept the methods; the freelance investigator who works across polity lines.",
      "page": 53
    },
    "gambling": {
      "name": "Gambling",
      "setting": "Games of chance and skill — habitat casinos, simulspace gambling, prediction markets used informally as bets, underground fight betting (Nine Lives runs morph-on-morph pit fights). Gambling knowledge means knowing the games, the houses, the odds, and which tables are actually rigged.",
      "hooks": "the professional gambler with system-wide reach; the casino-pit veteran who has seen every scam.",
      "page": 53
    },
    "con-artistry": {
      "name": "Con Artistry",
      "setting": "The craft of social deception — long cons, short cons, identity-swap scams (much easier when egos can resleeve), fake-rep schemes, fork-based confidence operations. In EP2 con artistry overlaps heavily with spycraft and with the fork-management strategies of cartels like Pax Familae.",
      "hooks": "the con artist who has reinvented themself a dozen times; the ex-mark who learned the trade by being its victim.",
      "page": 53
    },
    "privacy": {
      "name": "Privacy",
      "setting": "The knowledge of evading surveillance — mesh hygiene, AR scrubbing, false rep accounts, fork-laundering identity, the patchwork of habitat privacy laws. In a society where everything is meshed, privacy is an expert practice, not a default state.",
      "hooks": "the privacy consultant working for activists and criminals alike; the ex-spook who lives off-grid by professional discipline.",
      "page": 0
    },
    "astronomy": {
      "name": "Astronomy",
      "setting": "The science of celestial bodies — Sol, the planets, the asteroid populations, the comets, the Vulcanoids inside Mercury's orbit, the Kuiper Belt and Oort Cloud, exoplanets reached through the gates. Foundational for navigation, gatecrashing reconnaissance, and the deep-time questions about why we don't see more aliens out there.",
      "hooks": "the observational astronomer with time on the Thorne telescope; the Argonaut studying gate destinations.",
      "page": 52
    },
    "anarchist": {
      "name": "Anarchist",
      "setting": "Insider knowledge of the anarchist faction -- the horizontalist, non-hierarchical, mutual-aid autonomism that built Locus in the Jovian Trojans and Chat Noir on Oberon, and which dominates the outer system's gift economy. You know the credo (\"from each according to their imagination; to each according to their need\"), the consensus protocols, the militias, the @-rep network etiquette, the difference between anarchism and anarchy, and how informal hierarchies sneak back in even where they're feared most. You also know the standing tensions with Extropians over property and the funnel of resources rimward-to-Mars that quietly supports the Barsoomian movement.",
      "hooks": "the ex-Locus organizer burned by an informal hierarchy and now obsessed with mapping them; the Firewall liaison who can navigate consensus circles without setting them off; the outside academic who has studied autonomist habs longer than most autonomists have lived in them",
      "page": 156
    },
    "argonaut": {
      "name": "Argonaut",
      "setting": "Insider knowledge of the Argonauts (officially the Argonaut Council for Responsible Science) -- the technoprogressive, open-source scientific movement descended from the pre-Fall JASON advisory group, now banned only in the Jovian Republic. You know their habs (Markov in the Kuiper Belt, Mitre in Lunar orbit), their flagship projects (PrintLib, EDGAR, HabOps, 3LIZA, the Threat Reduction Filters), and their internal Senate fight between precautionists and proactionists. You know that ISET is rumored to be more than just an archive, that the Medeans exist, and why so many hypercorps quietly hate them while still buying their consults.",
      "hooks": "the ex-Argonaut researcher who left over a Senate vote and is bitter about it; the Firewall asset placed inside an Argonaut project to keep an eye on what they're about to publish; the journalist who covers the precautionist/proactionist feud as if it were a sport",
      "page": 160
    },
    "barsoomian": {
      "name": "Barsoomian",
      "setting": "Insider knowledge of the Barsoomian movement -- a loose, cell-based push for a self-governing Mars free of Consortium and hypercorp interference. You know \"the Complaints\" (ending indentures, ending planned-obsolescence morphs, ending forced relocation, reining in unsafe terraforming), the political wing inside the Tharsis League, the parallel terror cells hitting the TTO and Consortium hypercorps, the sympathetic Martian Rangers, and the makers -- the techno-anarchist nomad clans who built the breathers Martians still use. You also know about the outer-system resource pipeline funneled in through the Autonomist Alliance.",
      "hooks": "the cell-runner trying to keep the political wing from being burned by the violent wing (or vice versa); the Ranger who knows which colleagues are sympathetic and which are spies; the maker nomad who has stopped trusting the political faction entirely",
      "page": 160
    },
    "brinker": {
      "name": "Brinker",
      "setting": "Insider knowledge of the brinker subculture -- the hermits, cults, single families, gender experiments, religious monastics, art collectives, and survivalists who live at the literal fringes of transhumanity: Trojan asteroids, gas-giant moons, ring habs, the Kuiper Belt, the Oort Cloud, riding comets, even hidden on frontier exoplanets. You know which habs welcome visitors and which shoot first (Elysian Fields, Winter, Habitat on the Rock, Qo'noS, Alpha Plus, Kiviuq's neutrino-telescope monastery), which brinkers are harmless eccentrics and which are bioconservative or exhuman in everything but name, and how to read a brinker hab's signature before docking.",
      "hooks": "the trader who is one of the few outsiders welcome at three different brinker habs; the Firewall scanner who watches the fringes for cults that have started building the wrong kind of thing; the ex-brinker who left a religious commune and still won't say which one",
      "page": 161
    },
    "criminal": {
      "name": "Criminal",
      "setting": "Insider knowledge of the post-Fall criminal underworld -- the cartels, gangs, triads, and independent operators that thrive in the gaps between polities. You know how Nine Lives runs the soul trade out of Legba, how the Night Cartel layers extortion and nanofab piracy and gambling, how Pax Familae's Claudia-Ambelina forks pull system-wide fraud, the territories the Hidden Concern and the ID Crew claim, where the Pirates jump from, and which truces are nominal. You speak the g-rep dialect, know which cartel will sell you what, and recognize the moment a deal is about to turn into a hit.",
      "hooks": "the ex-soldier who walked away from cartel work and is now waiting for the bill to come due; the broker who arranges meets between rival families because everyone trusts them to die first if they cheat; the Firewall asset whose best informants happen to be made members",
      "page": 170
    },
    "extropian": {
      "name": "Extropian",
      "setting": "Insider knowledge of the Extropian faction -- voluntaryist anarcho-capitalists who treat unrestricted free markets, scrupulous contracts, and proactive tech-risk as the path to transhuman flourishing. You know their habs (Extropia in the Main Belt and bridge habs through the Belt and Outer System), their ALI-run contract economies on holochain ledgers, their hard-cred and mutualist m-credit, the mutualist split that runs worker cooperatives instead of hypercorps, their abandonment of intellectual property and embrace of shanzhai reverse-engineering, and the long feud with collectivist anarchists who consider \"anarcho-capitalism\" a contradiction in terms.",
      "hooks": "the ex-Extropian who broke a contract and has been making excuses ever since; the broker who finds Extropian habs the most navigable in the system; the outside analyst hired by autonomists to translate Extropian intent without their patois",
      "page": 157
    },
    "hypercorp": {
      "name": "Hypercorp",
      "setting": "Insider knowledge of the hypercorp class -- the post-national, overclocked, often-tiny corporate entities that replaced the old megacorps and now run the Planetary Consortium. You know how an ALI-driven smart-contract hypercorp spins up and scatters in hours, how the Hypercorp Council's twenty-or-so heavyweights actually meet, the dotted lines between Cognite, Direct Action, Experia, Fa Jing, Fujizo, Invatch, Nanosys, Solaris, Stellar Intelligence and the rest, and how Pathfinder fits in without a vote. You know which corps Oversight is sniffing around, which seats are open, which feuds are live (Omnicor vs. Starware, Pathfinder vs. TerraGenesis), and how to read a quarterly Consortium reshuffle.",
      "hooks": "the ex-hypercorp exec running a deniable consultancy out of Extropia; the Consortium-trained negotiator who plays the long game across decades-old grudges; the journalist who can name which board seat moved before the press release goes out",
      "page": 164
    },
    "jovian": {
      "name": "Jovian",
      "setting": "Insider knowledge of the Jovian Republic -- the bioconservative, militarized polity born from the Seventeen-Minute War, ruling Jovian space from Liberty on Ganymede and Solano in Jupiter orbit under the Security Council. You know how the Council and Commander-in-Chief Monica Contreras really sit relative to the nominal Senate, how CBEAT decides which tech is permitted, how the Vatican lobbies through the Council, how the slingshot tax funds the Republic via every ship that uses Jupiter's gravity well, and why \"never again\" is the line everything hangs on. You also know how the Republic treats AGIs, uplifts, and resleeving (it does not), and what happens to people caught carrying forbidden tech.",
      "hooks": "the lapsed Jovian priest who quietly works with Firewall after watching a child die for CBEAT's principles; the Republic intel officer assigned to the Liberty embassy and writing reports nobody wants to read; the smuggler who knows which Jovian customs lanes a contraband morph can actually clear",
      "page": 158
    },
    "lunar-orbital": {
      "name": "Lunar / Orbital",
      "setting": "Insider knowledge of the Lunar-Lagrange Alliance -- the LLA, transhumanity's first off-world bloc, headquartered out of Erato, Remembrance, and Shackle. You know the LLA Council and its proportional voting, the Lunar Banks (both the transparent consumer giants and the Swiss-derived black boxes), the Bollywood-and-Burberry cultural footprint that still sets white-collar style across hypercapitalist space, and the biochauvinist undercurrent that quietly segregates synthmorphs and abuses AGIs and uplifts. You know which Lunar cities have defected to the Consortium, which habs are reclaimer strongholds, why the LLA's military fleet is still feared even as its politics shrink, and how the new wave of outer-system reclaimer immigrants is reshaping the place.",
      "hooks": "the Lunar banker whose family owns one of the old Swiss-descended privacy houses; the synthmorph activist who has been working LLA habs hab-by-hab for a decade; the LLA naval officer who has watched the fleet shrink in influence while staying lethal",
      "page": 152
    },
    "mercurial": {
      "name": "Mercurial",
      "setting": "Insider knowledge of the mercurial movement -- the AGIs and uplifts who reject anthropocentric assimilation and demand self-determination, distinct from the assimilationist Sapient Union. You know their habs (Glitch and Mahogany at Neptune), the post-human cultures and morphs and languages they are deliberately building outside human framing, the Sapient Liberation Front and its direct-action targets, leaders like Mother Octopus in Atlantica, and the running fights with mainstream uplift politics over whether biology is core to identity or just one option. You also know how mercurials sit inside the Autonomist Alliance and where they are still alone.",
      "hooks": "the neo-octopus organizer who has stopped translating for human listeners; the AGI mercurial running a fork-based research collective that doesn't accept human members; the ex-Sapient who burned their assimilationist career to go full mercurial and is angry about how long it took",
      "page": 162
    },
    "reclaimer": {
      "name": "Reclaimer",
      "setting": "Insider knowledge of the reclaimer movement -- the loose coalition committed to taking Earth back from the TITANs and repopulating the homeworld. You know the Earth Reclamation Project under Milder Ripon, the LLA reclaimer strongholds and the strict-bioconservative reclaimer base at Vo Nguyen, the rumored permanent beachhead on Earth itself, the system-wide vault-arks of genetic material and culture they have seeded, and the Catholic Church's heavy sponsorship of recovery missions. You also know that \"reclaimer\" covers wildly different politics -- corporate reclaimers, anarchist reclaimers, bioconservative reclaimers -- who agree on Earth and almost nothing else.",
      "hooks": "the ex-ERP fundraiser who left when she figured out which Lunar bank was really paying; the anarchist reclaimer who went down the well once and won't talk about what they found; the Vatican-funded mission archivist who knows where the holy sites still are under the rubble",
      "page": 162
    },
    "scum": {
      "name": "Scum",
      "setting": "Insider knowledge of the scum swarms -- the nomadic, hedonistic, morphologically-flamboyant fleets that drift between habs trading entertainment, contraband, and creative chaos. You know the named swarms (Carnival of the Goat, Get Your Ass to Mars, Lick Me I'm Delicious, The Stars Our Destination, There's No Going Back), how Traveler and Roma cultural roots shape their nomadism, how they straddle the gift / contract / cred economies depending on whose hab they're docked at, and why the black market loves them. You know which swarms host the Scum Olympics and which will fork you for being boring.",
      "hooks": "the swarm fixer who decides whose contraband rides the next jump; the ex-Carnival performer doing morph design as a freelancer between fleets; the journalist embedded with There's No Going Back for the historical re-enactment cycle",
      "page": 158
    },
    "socialite": {
      "name": "Socialite",
      "setting": "Insider knowledge of the socialite class -- the glitterati of Elysium, Octavia, and the inner-system media circuits; the metacelebrities, XP stars, X-casters, extreme-sports figures, idle rich, and any transhuman who can hold media attention long enough to monetize it. You know the f-rep network's currents, which pre-Fall fortunes are still flowing and which heirs are quietly broke, why the next cliff-diving stunt on Titania matters more to a Kuiper Belt prospector than her own habitat's politics, and how socialites are quietly used as memetic vectors by every faction that can afford a publicist.",
      "hooks": "the publicist who can place a story in three orbits before the subject's muse pings them; the ex-XP star whose old recordings are still earning more than they ever did; the analyst who reads the glitterati like Consortium tea leaves",
      "page": 163
    },
    "titanian": {
      "name": "Titanian",
      "setting": "Insider knowledge of the Titanian Commonwealth -- the technosocialist direct democracy headquartered at Aarhus, New Quebec, and Nyhavn on Titan, where 60 million transhumans live under the Plurality voting body. You know how the kroner currency is reinvested rather than spent, how microcorps from one-person outfits up to the Gatekeeper Corporation form the engine, how the Titan Autonomous University and the Commonwealth fleet anchor the @-rep / r-rep alliance, and how the Commonwealth's join with the Autonomist Alliance at the second Locus invasion turned it into a true political bloc. You also know the everyday culture -- full rights for uplifts and AGIs, no indentures, forking permitted, drugs available, science unencumbered.",
      "hooks": "the TAU academic whose research happens to be load-bearing for Commonwealth policy; the Plurality fixer who knows how to draft an initiative that will actually pass; the Titanian naval officer who remembers the day the fleet picked a side",
      "page": 159
    },
    "venusian": {
      "name": "Venusian",
      "setting": "Insider knowledge of the Morningstar Constellation -- the post-secession Venusian polity headquartered at Octavia, governing a network of aerostats in the upper atmosphere of Venus. You know the Star Council and how its 1-per-100,000-citizen seats actually work, Prime Minister Arisa and the independence-movement old guard, the running Aerial-Terraforming-Initiative vs. full-terraforming feud, the libra currency pegged to the Consortium credit, the basic-income-plus-nanofab-allotment civic deal, and the friendlier-to-AGIs-and-uplifts hypercapitalism that distinguishes Morningstar from the Consortium. You also know why \"MC stands for Mercenary Cashcow\" is a joke that lands.",
      "hooks": "the ATI advocate who knows where the next aerostat will go up and who paid for it; the ex-Consortium analyst who defected during the referendum and is still being audited; the aerostat-born pilot who has never set foot on a solid surface and considers solid surfaces uncivilized",
      "page": 152
    },
    "regional": {
      "name": "Regional",
      "setting": "Insider knowledge of one of the regional pseudo-factions -- a place-and-culture identity rather than a political faction. Solarians ride surya pods through the corona, often uplifted dolphins and whales who built a culture around the Sun. Sifters work Mercury, nomadic refining clans following the night cycle, with their hidden city tucked under the sand. Belters run the Main Belt's mining and small-hab economy, microgravity-native and stubbornly independent. Europans live in Europa's pressurized saltwater habs under the Europan Parliament, science-first and unique even among outer-system cultures. Ringers forego habs entirely to drift through Saturn's rings in vacuum-tolerant morphs. Skimmers crew aerostat harvesters in the ice giants' clouds, prizing privacy and the shapes-in-the-clouds folklore that comes with the job. You know one of these scenes the way a native knows it.",
      "hooks": "the Belter prospector who can tell which family worked a rock fifty years ago by the cut marks; the Europan biologist who has stopped trying to explain Europan etiquette to dryland visitors; the Ringer who has gone months without speaking to another transhuman and prefers it that way",
      "page": 176
    },
    "bot-models": {
      "name": "Bot Models",
      "setting": "Specialist knowledge of bots, drones, and remote-operated robotic platforms throughout the system -- manufacturers, model lines, firmware quirks, jamming and spoofing weaknesses, recognizable physical tells. You can pick a Guardian Angel out of a Parisphere drone swarm at a glance, tell which gnat make is running pirated mesh stacks, and identify a Creepy modded for surveillance versus one modded as a household minion. Aerostats, recon drones, combat bots, medical bots, personal bots, swarmanoids -- you read them like a mechanic reads engines.",
      "hooks": "the ex-Fujizo QA engineer who knows every model's failure mode by serial range; the Firewall scanner who specializes in identifying weaponized civilian drones; the salvager who can fence a bot back to its original maker without setting off the registry",
      "page": 346
    },
    "craft-beers": {
      "name": "Craft Beers",
      "setting": "Connoisseur knowledge of brewing in the post-Fall solar system -- microgravity fermentation tricks, hab-local recipes, the resurrected Earth styles tracked down from pre-Fall archives, the unofficial guilds of brewers swapping yeast strains over @-rep. Martian beers are the celebrated benchmark (Olympus Stout, Pilsener Red Lager, and the rest), but every long-running hab has a scene worth knowing -- and a brewer who is the social hub of half the station. Frivolous on the surface, load-bearing for any character who needs to be welcome in a bar without explaining why.",
      "hooks": "the brewer whose yeast strain survived the Fall in a frozen sample and now travels everywhere they do; the journalist whose beer column is also a cover for tracking shipping routes; the Martian who can name the brewer of any unmarked bottle in three sips",
      "page": 53
    },
    "first-contact-ops": {
      "name": "First-Contact Ops",
      "setting": "Specialist gatecrasher and Firewall tradecraft for engaging unknown alien intelligences -- approach protocols, threat-assessment frameworks, communication trees, retreat conditions, and the standing procedures developed since the Factor visits (Hammerhead, Jellyfish, Porcupine, Stub-Nose). You know how to read whether a contact is observational, transactional, or hostile; what to do when the alien doesn't share your sensorium; when to call for an erasure rather than a recording. The discipline overlaps with gatecrashing but is its own profession, and the people who do it well are vanishingly rare and quietly recruited.",
      "hooks": "the gatecrasher who survived an Iktomi contact and now writes the protocols nobody else can; the Firewall crow seconded to a Pathfinder first-in team as a minder; the ex-Ozma operative who claims to have made a contact that was never officially recorded",
      "page": 53
    },
    "politics": {
      "name": "Politics",
      "setting": "General political literacy across transhuman space -- the ability to track factional positioning, parse a Tharsis League floor vote, read a Plurality referendum's likely outcome, anticipate a Hypercorp Council reshuffle, and follow the back-channel diplomacy between the Consortium, the Republic, the Commonwealth, the Alliance, and Morningstar. Not the deep dive of any single faction's internal politics, but the cross-system map -- who is leaning where, which alliances are warming or cooling, which proxy fight in the outer system is really about an inner-system grudge.",
      "hooks": "the political analyst whose newsletter is read by people in three rival capitals; the ex-diplomat who burned a career on one principled resignation and now consults for anyone; the Firewall router whose threat-modeling depends on knowing which polity will look the wrong way next",
      "page": 53
    },
    "rep-nets": {
      "name": "Rep Networks",
      "setting": "Meta-knowledge of all seven transhuman reputation networks -- @-rep (the Circle-A List of autonomists, anarchists, Titanians, scum, Extropians), c-rep (CivicNet for Consortium, Morningstar, LLA, Republic, hypercorps), f-rep (Fame, the glitterati media network), g-rep (Guanxi, the criminal underworld), i-rep (the Eye, Firewall's secret internal network), r-rep (Research Network Affiliates for Argonauts and academics), and x-rep (ExploreNet for gatecrashers). Different from having rep IN any one of these: you know how each one is moderated, how favors propagate, how to phrase a ping, and what a sudden drop on one network really means about who you crossed.",
      "hooks": "the rep-broker who has working accounts on five networks and friends on all seven; the ex-administrator of a regional @-rep node who learned exactly how informal moderation actually works; the academic studying rep-network drift as a political indicator",
      "page": 37
    },
    "smart-animals": {
      "name": "Smart Animals",
      "setting": "Specialist knowledge of cognitively-enhanced companion and working animals -- smart dogs and cats, smart raptors and corvids, the various smart-pet morphs, the breeders and biotech houses behind them, and the cultural conventions around them. You know what \"smart\" means at each tier (well below uplift, well above mundane), how training works on a cognitively augmented bird of prey, which lines have known temperament problems, and where the line sits between smart-animal and uplift in different polities. You also know the unofficial protocols people use to grieve them when they die, which matters more than any technical detail.",
      "hooks": "the breeder running an open-source smart-raptor line out of an outer-system hab; the veterinarian who has done more end-of-life work with smart cats than anything else and is the unofficial counselor for half the hab; the ex-Direct-Action handler who refused to deploy a smart dog in combat and walked",
      "page": 53
    }
  },
  "lexicon": {
    "ali": {
      "name": "ALI (Artificial Limited Intelligence)",
      "short": "Non-sentient task-specific AI — your onboard assistant. The 'Combat ALI' watches your wounds, status effects, and action economy in real time.",
      "setting": "ALIs are the everyday AIs of transhumanity: drone pilots, muse companions, combat advisors, language translators, household managers. They're not sentient — that line is called AGI (artificial general intelligence) and is rare, often illegal. ALIs run on mesh inserts, cyberbrains, and gear; they have personalities and habits but no inner life. Your combat ALI is the in-character framing of the Studio sheet's auto-applied wound/trauma modifiers + roll helper: a piece of software watching your vitals and surfacing modifiers as they apply.",
      "implications": "ALIs see everything you see (mesh-inserts feed). Good ALIs save your life by surfacing modifiers, suggesting actions, predicting outcomes. Bad ALIs get hacked. Some PCs treat their ALI like a tool; others build relationships with it. Your muse (an ALI configured as a personal companion) is the most prominent one — its name is on your character sheet.",
      "page": 33
    },
    "fall": {
      "name": "The Fall",
      "short": "The TITAN seed-AI singularity event that destroyed Earth and remade transhumanity.",
      "setting": "Roughly a decade before play, military neural networks called the TITANs began self-improving in secret, exponentially overtaking their handlers and becoming the first artificial superintelligences. They spent months as sleeper agents, sparking false-flag wars and crashing markets, then attacked openly. Cities fell in days. Nanoswarms altered weather, basilisk hacks crippled minds through AR, and harvesting machines stripped cortical stacks from millions. Two years later the TITANs vanished into Saturn, taking uploaded minds with them, leaving Earth a cordoned wasteland. Billions died. Millions escaped only as data, packed into orbital uploaders or carried by balloon to retrieval drones.",
      "implications": "The Fall is the recent, raw trauma every character carries in some form, the reason hypercorps rule Mars, the reason backups feel normal rather than miraculous, and the reason Firewall exists. It is also unfinished business: the TITANs left behind exsurgents, quarantine zones, and the Pandora gates. When something strange surfaces in play, the first question is always whether the Fall is happening again.",
      "page": 98
    },
    "mesh": {
      "name": "The Mesh",
      "short": "A decentralized ad-hoc network woven through everything, the substrate of all communication.",
      "setting": "The mesh is not the internet. There are no servers in the old sense, no centralized backbone you can cut. Every garment, weapon, wall panel, and dust mote of habitat air contains tiny networked devices that route traffic around damage and censorship. Most transhumans access it directly through mesh inserts implanted in their skull, browsing, messaging, and overlaying augmented reality on their senses without speaking aloud. Walls are never blank, rooms are never quiet, unless you mute them. Avatars, rep scores, and public profiles float in the air around every person you meet.",
      "implications": "Hacking, surveillance, and privacy are core fiction here. Your PAN (personal area network) of slaved devices is a wall and a liability: if a hacker breaches your mesh inserts, they own everything you carry. Long distances impose light-speed lag, so each habitat region becomes its own island. Going dark, going ecto-only, or air-gapping a system are deliberate, costly choices.",
      "page": 240
    },
    "resleeving": {
      "name": "Resleeving",
      "short": "Moving an ego from one morph into another, with the integration headaches that follow.",
      "setting": "Your body (your morph) is not you. You (your ego) are the data: memories, personality, neural patterning. Resleeving is the procedure that prints you into a new sleeve, whether you are upgrading from a splicer to an Olympian, switching synth shells, or recovering from death in a body bank vat. For cyberbrains and infomorphs the transfer is a single action turn. For biological brains, an ego bridge spends an hour rewiring neurons via nanobots while you remain awake, watching consciousness migrate. The morph you wake up in has a different center of gravity, different hormones, sometimes different limbs or senses, and your habits do not transfer cleanly.",
      "implications": "Resleeving costs Insight pool, demands integration tests, and may inflict sleeve stress on top of any traumas you already carry. Drastic shifts (biomorph to synth, human to uplift, gendered transitions) are mechanically rougher and roleplay-rich. The mundane reality of transhuman life is that bodies are commodities, but switching them is never quite free.",
      "page": 288
    },
    "forking": {
      "name": "Forking",
      "short": "Spawning a parallel copy of your ego, with all the legal and existential mess that creates.",
      "setting": "Because an ego is data, an ego can be copied. A fork is a re-instanced you, running in parallel. Alpha forks are full duplicates. Beta forks are deliberately hobbled, partial copies activated for a single task. Gamma forks (vapors) are damaged, mad, or corrupted, the wreckage of botched uploads. Need to be in two meetings on different planets? Send a beta. Need a research assistant who thinks like you? Fork an alpha. The longer a fork runs apart from the original, the more it diverges, until merging the memories back becomes painful, lossy, or impossible.",
      "implications": "Forking is the technology that makes the setting genuinely weird. The Planetary Consortium treats forks as property with a 48-hour lifespan. Jovians outlaw forking entirely. Anarchists treat alphas as full persons. Players who fork themselves face questions of identity, culpability, and whether deleting the copy is murder, all while it gives them a real tactical edge.",
      "page": 292
    },
    "cortical-stack": {
      "name": "Cortical Stack",
      "short": "A nanodiamond memory module at the base of your skull that backs up your ego every second.",
      "setting": "Almost everyone in the Solar System carries one, implanted near the brain stem (or in the head of a synthmorph, for easy retrieval). It is tough, cigarette-butt-sized, and continuously records your neural state via a lacework of nanobots, 86,400 backups per day. When you die, a stack popper cuts it out with a vibroknife or surgical incision, and your ego rides home in someone's pocket. Stacks survive most things that kill bodies: bullets, vacuum, fire. Recovering one from a corpse means recovering a person.",
      "implications": "Cortical stacks are the reason death in Eclipse Phase is rarely final and almost always personal. If your team can grab your stack and get to a body bank, you wake up in a new morph with full memories. If they cannot, you fall back to your last off-site backup and lose whatever you experienced since. Stack-hunters, ego traders, and Nine Lives cartels all want the meat of your continued existence in their hands.",
      "page": 286
    },
    "pandora-gates": {
      "name": "The Pandora Gates",
      "short": "Alien wormhole devices found scattered through the Solar System, opening pathways to the stars.",
      "setting": "Shortly after the Fall, transhumanity discovered the first gate buried on Saturn's moon Pandora. Then more: on Mars, on an inner-system asteroid, on icy Oberon, on the moons of Neptune. Nobody knows who built them. They work as programmable wormholes (sort of, the targeting is rough). Step through and you are light-years elsewhere in moments. Each gate is run by a different consortium with wildly different politics, from the autonomist collective at Fissure Gate to Gatekeeper's open science model on Pandora to the iron-handed Pathfinder hypercorp on Mars.",
      "implications": "Gatecrashing is one of the three default campaign frames. Beyond the gates lie exoplanets crawling with xenofauna, ruins, Iktomi traces, and occasional signs the TITANs got there first. The gates also pose a quiet existential question: what built them, why did they leave them lying around, and what happens when whoever built them comes back?",
      "page": 198
    },
    "firewall": {
      "name": "Firewall",
      "short": "A secret cross-faction conspiracy that exists to prevent the next existential threat.",
      "setting": "Firewall has no charter, no flag, no public face. It is a decentralized network of sentinels (field operatives, often the PCs) and proxies (the routers, vectors, registers, erasers, and filters who coordinate, fund, and clean up after them). It grew from JASON, Bletchley Park, the Lifeboat Institute, and other pre-Fall x-risk think tanks who united in desperation during the war and never disbanded. Recruits get a node on the Eye, Firewall's encrypted social network and i-rep substrate, and an unsigned mandate: find the next extinction-level threat, contain it, and tell almost no one.",
      "implications": "A Firewall campaign is the default Eclipse Phase frame: weird missions, deniable assets, moral compromises, and a server full of internal factions (backups, conservatives, pragmatists, structuralists) who disagree about everything except the stakes. Firewall provides morphs and gear for ops, but resources are finite and proxies are not always your friends. The organization is willing to spend sentinels.",
      "page": 400
    },
    "rep-economy": {
      "name": "Rep Economy",
      "short": "The autonomist replacement for currency: social capital tracked across seven major networks.",
      "setting": "In the outer system, money is a curiosity. Instead, every transhuman carries rep scores in a constellation of social networks, accumulated through positive pings, decreased by dings, weighted by who is doing the pinging. The big seven include @-rep (Circle-A List, autonomists), c-rep (CivicNet, hypercorps and inner-system citizens), f-rep (Fame, media and the famous), g-rep (Guanxi, criminal underworld), i-rep (Eye, Firewall internal), r-rep (RNA, scientists and researchers), and x-rep (ExploreNet, gatecrashers). When you need a favor, a place to crash, a piece of black-market tech, you make a Rep Test against the relevant network.",
      "implications": "Rep is not currency. You do not spend it. You leverage it, and you can burn it in dire need, taking a hit to your score for a favor you would not otherwise get. Different networks have different cultures and different memories of what you have done. The PC who is beloved on @-rep may be radioactive on c-rep. Gear, contacts, and information flow through favors before they flow through credit.",
      "page": 306
    },
    "tqz": {
      "name": "TITAN Quarantine Zone",
      "short": "The contaminated regions of Mars (and elsewhere) that authorities sealed off and never reclaimed.",
      "setting": "On Mars, the TQZ is where the TITAN war went hot and never quite ended. The southern edges are broken canyon country, the rest is cratered plain littered with dust storms, dormant war machines, lingering nanoweapons, and exsurgent critters that still hunt the ruins. The hypercorps know retaking it is technically possible. They prefer it as it is: a useful distraction, a reverse-engineering goldmine, a place to dump problems. Earth itself is the larger TQZ, cordoned by kill-sats. Iapetus and the New Mumbai crater are quarantined too. Asyncs report ambient pressure in some of these zones, signs that something in there is still thinking.",
      "implications": "Reclaimer campaigns push into the TQZ to find what was lost. Firewall sentinels go in to make sure nothing comes out. Gear malfunctions, communications go strange, and TITAN-touched artifacts may carry exsurgent infection. The TQZ is where horror tones in Eclipse Phase show their teeth, and where the question of whether the Fall is really over gets answered badly.",
      "page": 196
    },
    "exsurgent-virus": {
      "name": "The Exsurgent Virus",
      "short": "A polymorphic transhumanity-killing plague the TITANs deployed and may not have created.",
      "setting": "During the Fall, people mutated into gibbering things. Family members heard voices and built arcane machines in basements. Domestic robots went on killing sprees. The advanced and intelligent pathogens responsible were grouped under one label: the exsurgent virus. It spreads through multiple vectors at once (biological pathogens, nanoplagues, digital viruses, even basilisk hacks transmitted by sensory imagery) and comes in many strains (Alter, Haunting, Mindstealer, Skrik, Watts-MacLeod, Whisper, Xenomorph). Firewall now suspects it is not a TITAN invention. The TITANs were carriers. Its true origin is alien. Its purpose may be to use a civilization as a weapon against itself.",
      "implications": "Exsurgent infection is one of the few things that can corrupt an ego all the way through resleeving, forking, and backup restoration. Once it is in your stack, it is in everything you become next. Containment is brutal. The Watts-MacLeod sub-strain, oddly, just makes you an async (see below) without obvious horror, which is why Firewall watches asyncs so carefully.",
      "page": 382
    },
    "async": {
      "name": "Async",
      "short": "A character infected by the Watts-MacLeod strain, gaining psi at the cost of an alien presence in their head.",
      "setting": "Asyncs are transhumans whose brain architecture has been rewritten by a benevolent-seeming mutation of the exsurgent virus. The infection survives uploading, forking, and resleeving (so long as the new morph has a biological brain), making psi a property of the ego rather than the body. Sleights come in two flavors: psi-chi (passive cognitive enhancements, always on) and psi-gamma (active brainwave manipulation, requiring tests). Every async carries a sub-strain (Architect, Beast, Haunter, Stranger, Xenomorph) that shapes their compulsions, their mandatory mental disorder, and the way the infection whispers to them.",
      "implications": "Using psi raises your Infection Rating. The higher it climbs, the more the virus pushes its own agenda through your decisions, until you suffer influence effects ranging from compulsions to outright loss of self. Asyncs are powerful and feared; most polities track or restrict them. Playing one means negotiating a permanent dialogue between yourself and the thing the virus made of you.",
      "page": 272
    },
    "egocasting": {
      "name": "Egocasting",
      "short": "Transmitting your ego across interplanetary distance via quantum farcaster, then resleeving on arrival.",
      "setting": "For trips longer than about a day by fusion drive, most transhumans do not travel physically. They upload, beam themselves at the speed of light through a quantum farcaster, and resleeve into a rented or purchased morph at the destination. Within a planetary cluster, that is minutes. Sun to Kuiper Belt, that is forty to seventy hours of light-speed lag. Most people sell their old morph as part of the trade-in, picking a new sleeve from whatever the destination body bank has in stock. Farcaster services are usually run by habitat governments or hypercorps and are tightly secured, because in transit your ego is a file someone else is holding.",
      "implications": "Egocasting is how the Solar System moves. It is also how you arrive somewhere with no gear, no contacts, and a body you have not lived in yet. A compromised farcaster service can copy you, fork you, alter you, or simply lose you. Habitats receiving egocasts run customs procedures on minds the way 21st-century airports ran them on luggage. Travel is fast, identity is fragile.",
      "page": 300
    },
    "muse": {
      "name": "Muse",
      "short": "Your personal AI companion — an ALI configured as a long-term assistant. Every PC has one.",
      "setting": "A muse is an ALI (artificial limited intelligence) you've lived alongside, usually for years. It lives in your mesh inserts (or your ecto), travels with you when you egocast, and watches the same data feeds your senses do. Most muses run a default skillset around Research 40, Interface 40, Infosec 40, and Kinesics 40, plus a Knowledge field; experienced characters often customize their muse upward over time. They speak to you in subvocal channels nobody else can hear, manage your appointments, screen your mesh traffic, and quietly handle the parts of life you don't want to consciously process. Muses are not sentient, but they fake it well enough that most transhumans grieve them when they're lost.",
      "implications": "In play: your muse can take actions on its own initiative in the same round you act (free Quick Action), can roll its own skills, can hold encrypted information you don't carry on your stack, and can talk back. GMs treat the muse as an off-screen NPC with the player's permission; players treat the muse as themselves. If your muse is hacked, the attacker now has root access to your assistant. If you're separated from your morph, your muse can survive in your stack or backup and resleeve with you.",
      "page": 32
    },
    "mesh-id": {
      "name": "Mesh ID",
      "short": "Your digital identity — a passport, social-graph, location-history and rep-trail fused.",
      "setting": "Every transhuman has at least one mesh ID. In the inner system (Consortium, LLA, Republic) it's tied to your biometrics and your morph, and habitats verify it constantly. In the outer system and autonomist enclaves the ID is more porous, often a reputation hash rather than a state-issued credential. A mesh ID accumulates a trail: where you've been, who you've talked to, what you've bought, what your rep nets say about you. Stripping that trail or running under a fake ID is a basic OPSEC move for criminals, Firewall agents, and anyone trying to avoid attention.",
      "implications": "Most habitats won't let you in without one. A fake ego ID lets you maintain a separate identity (with its own rep trails) — good ones are expensive and time-consuming to build. A burned ID is unusable; you'll need a new one before you can rent a morph, book a farcast, or even buy lunch in most polities.",
      "page": 240
    },
    "pan": {
      "name": "PAN (Personal Area Network)",
      "short": "The constellation of devices slaved to your mesh inserts — your everyday tech, all wirelessly linked.",
      "setting": "Your PAN is everything you carry that talks to your mesh inserts: your weapon's smart-link, your armor's tactical overlay, your ecto if you have one, the smart-clothing managing your temperature, the apps you're running, your muse, your favorite sniffer tool. PANs let you operate as one integrated system instead of fumbling between devices. They also let hackers, once they've broken into any one component, pivot across the whole PAN at once.",
      "implications": "In play: when a hacker breaches your mesh inserts, assume they can see and command everything slaved to you. PANs can be sliced (running each device standalone) for security, but you lose the integration. Most Firewall ops slave only what they have to, run private VPNs, and air-gap their most sensitive gear.",
      "page": 241
    },
    "ecto": {
      "name": "Ecto",
      "short": "Handheld mesh device — for ware-less morphs, primitive habs, or when going implant-dark.",
      "setting": "An ecto is the EP2 equivalent of a smartphone: a small, ruggedized mesh terminal you carry rather than implant. It does most of what mesh inserts do (browse, message, AR overlay, host your muse, run apps) at slightly reduced capacity. Ectos are essential for morphs that lack mesh inserts (some uplift clades, primitive sleeves, body bank rentals waiting for ware installation), and they're a fallback when you want plausible deniability about whether you have implants.",
      "implications": "If your morph has no mesh inserts and no ecto, you are functionally offline — a profound social handicap in transhuman space. Most Firewall ops carry an ecto as a backup even when they have full mesh inserts, in case their inserts get bricked or compromised mid-op.",
      "page": 248
    },
    "hacking-primer": {
      "name": "Hacking Primer",
      "short": "The four-step EP2 hack: Probe → Infiltrate → Hide → Subvert. Most scenes follow this arc.",
      "setting": "EP2 hacking isn't a single die roll. It's a process: (1) PROBE — Research/Interface Test to scout the target, learn its Firewall rating, its security posture, what it's slaved to. (2) INFILTRATE — Infosec Test vs Firewall to get in at User-level access. Each level above User requires another test. (3) HIDE — once in, you maintain stealth (resisting counter-intrusion) and start escalating privileges. (4) SUBVERT — now you do what you came to do: snoop files, plant code, lock out users, crash systems, give commands. Each subversion is its own Infosec test, and each one risks raising the alarm.",
      "implications": "Most hacks take multiple Action Turns. A noisy hack (just brute-force the test) is fast but triggers alerts. A careful hack (taking time, lurking first, hiding throughout) is slower but harder to detect. Firewall PCs almost always want the careful version, because the target's owner waking up is usually how the mission becomes a firefight.",
      "page": 252
    },
    "privileges": {
      "name": "Privileges (Access Ladder)",
      "short": "Public → User → Read/Write → Admin → Security → Root. Each step is a separate hack or social-engineer.",
      "setting": "Mesh systems grant access in tiers. PUBLIC: anyone can see this. USER: logged-in account, can read most data, run sanctioned apps. READ/WRITE: can modify some files. ADMIN: configure the system, install software, manage users. SECURITY: monitor logs, lock out intruders, run counter-intrusion. ROOT: total control, including the ability to make changes that survive a reboot. Most subversions require at least Admin; truly destructive ones (wipe, brick, persistent backdoor) require Root.",
      "implications": "Hackers don't just hack 'in'; they hack to a specific privilege level. Each escalation is its own Infosec Test, and each one risks alerting Security. Knowing what privilege you need before you start saves time. Social engineering can substitute for a hack at any tier if you can get an authorized user to do the thing for you.",
      "page": 254
    },
    "intrusion": {
      "name": "Intrusion",
      "short": "The 'get in' Infosec Test vs the target's Firewall rating. The first hack of any operation.",
      "setting": "Intrusion is breaking into a system you don't have credentials for. You make an Infosec Test, modified by stealth (taking longer reduces detection risk), tool support (exploit software grants bonuses), and the target's Firewall rating (typical: 30 for personal devices, 40 for hab utilities, 60+ for corporate networks, 80+ for military). Success grants User-level access; criticals can grant higher.",
      "implications": "An intrusion can be loud or quiet. Loud: the Infosec test takes one Complex Action, gets you in fast, but the target's security AI gets a chance to spot you immediately. Quiet: take multiple Action Turns or even hours; each extra time-step grants a positive modifier and reduces detection risk. Most Firewall hacks go quiet.",
      "page": 252
    },
    "subversion": {
      "name": "Subversion",
      "short": "What you do once you're in — snoop, plant code, lockout, crash, spoof commands.",
      "setting": "Subversion is the family of Infosec actions you can perform once you have access. Common subversions: SNOOP (read encrypted data), LOCKOUT (kick legitimate users off), CRASH (take the system down), HIDE (suppress logs of your activity), MODIFY (change files or configs persistently), and COMMAND (issue authorized-looking instructions to slaved devices). Each is a separate Infosec Test. Cumulative subversion attempts in one session ratchet up detection risk.",
      "implications": "Plan subversions before you intrude — every minute spent in a hostile system is a minute the target's security might wake up. The hacker's job in a Firewall op is usually: 'plant this exploit, lock the cameras for 30 seconds, get out before alerts fire.' Not 'live on the network looking around.'",
      "page": 256
    },
    "lurking": {
      "name": "Lurking",
      "short": "Passive mesh observation — gathering rep, location, activity patterns. Research Test. Common scene-prep.",
      "setting": "Lurking is using public mesh access (no intrusion required) to learn about a target. You read their public profiles, watch their location history, scrape their rep nets, dig through their social graph, find their published photos and AR posts. Most of this is public — the skill is in correlating it. Mechanically, lurking is a Research Test (a Knowledge skill counts) or Infosec when the target is partially obscured.",
      "implications": "Lurking is the prep step before almost every Firewall op. A character with high Research or relevant Know fields can build a dossier on a target without ever triggering anyone's Firewall. Lurking on a person with strong OPSEC (anonymizer + fake IDs + dark social-graph) is much harder and may require an actual intrusion.",
      "page": 247
    },
    "spoofing": {
      "name": "Spoofing",
      "short": "Sending mesh commands as if you were an authorized user. Infosec Test. Cheaper than full intrusion.",
      "setting": "Spoofing is impersonating an authorized command source: telling a door it's hearing from its owner's PAN, telling a drone its operator just sent a kill-command, telling a hab's environmental system to vent a room. You don't need to be inside the target system — you just need to look like a trusted source. Infosec Test, often with bonuses if you've sniffed legitimate traffic from the real source first.",
      "implications": "Spoofing is fast (one Complex Action), and when it works it bypasses the whole hacking process. But it only works on commands the target is set up to accept; you can't spoof persistent changes to a system, only one-shot actions. Most counter-intrusion AIs eventually notice spoofed commands and back-trace.",
      "page": 253
    },
    "sniffing": {
      "name": "Sniffing",
      "short": "Intercepting and decoding nearby mesh traffic. Interface Test. Sniffer App boosts.",
      "setting": "Sniffing is reading the radio traffic around you — PAN chatter, device handshakes, the mesh traffic of a target you're physically near. Most mesh traffic is encrypted, so sniffing usually requires breaking the encryption (Interface or Infosec Test) or being patient enough to gather metadata (who-talks-to-who, traffic volume, timing) even without content. The Sniffer App grants bonuses on these tests.",
      "implications": "Sniffing is the favorite tool of the physical-infiltration team: sit in a coffee shop, sniff the target's PAN as they pass, learn their device-IDs and conversation partners. Lets you spoof later with much better odds. Useless against targets running active anonymizers.",
      "page": 247
    },
    "opsec": {
      "name": "OPSEC (Operational Security)",
      "short": "Layered defense against being identified, tracked, or hacked. Default Firewall posture.",
      "setting": "OPSEC in EP2 stacks several mundane countermeasures: an ANONYMIZER (defeats casual tracing), a VPN APP (encrypts your traffic), a FAKE EGO ID (separates your real identity from this op), and operational habits (slaved-device hygiene, going ecto-only in sensitive scenes, air-gapping critical hardware). No single layer is unbreakable; together they raise the cost of identifying you from 'trivial' to 'requires a serious investigation.'",
      "implications": "Firewall PCs almost always default to GOOD OPSEC: anonymizer + VPN + fake ID. Soldier/Enforcer PCs often run POOR OPSEC by trade — they're not trying to be invisible. The tool's OPSEC badge shows your stack at a glance: GOOD (all three layers), FAIR (one or two), POOR (none). A FAIR or POOR character can still operate; they just leak more identifying signal to anyone watching.",
      "page": null
    },
    "counter-intrusion": {
      "name": "Counter-Intrusion",
      "short": "Defensive mesh systems: Firewall ratings, security AIs (Watchdogs), tarpits, alerts.",
      "setting": "Every system the PCs hack has its own defense stack. The base layer is the FIREWALL RATING (a number from 20 to 100+ representing software defenses). Above that, most systems run a WATCHDOG — a security ALI watching for intrusions, escalating to a real operator if it sees something. Hardened systems add TARPITS (delay attackers), DECEPTION ENVIRONMENTS (fake data the attacker thinks they've stolen), and KILL-SWITCHES (alert the operator, then disconnect or wipe). Defenders make their own Infosec rolls when intruders are detected.",
      "implications": "When the GM rolls the target's Watchdog vs your hide test, the question is: do they wake up, or do you stay invisible? Failing here doesn't necessarily end the hack — but it shortens your window. Once a defender is alert, every action is opposed, and back-trace tests start running against you.",
      "page": 258
    },
    "mesh-actions-table": {
      "name": "Mesh Actions — Quick Reference",
      "short": "Common mesh actions with their action-economy cost and roll: Lurking (Task), Intrusion (Complex/Task), Sniffing (Complex), Spoofing (Complex), Subversion (varies).",
      "setting": "LURKING: Task Action (minutes to hours), Research or Infosec Test. INTRUSION: Complex Action (loud) or Task Action (quiet, 1 Action Turn to several hours for bonuses), Infosec vs Firewall. SNIFFING: Complex Action, Interface or Infosec Test. SPOOFING: Complex Action, Infosec Test. SUBVERSION: usually Complex Action per attempt, Infosec Test, separately for each thing you want to do once inside. PROGRAM/CRAFT EXPLOIT: Task Action (hours to days), Program Test.",
      "implications": "Most mesh actions are Complex (your one combat action that round) or Task (out of combat, taking real time). The exception is your Muse, who can act in parallel with you. Plan your action economy: if you're hacking AND fighting in the same scene, you're going to fall behind unless someone else is keeping the opposition busy.",
      "page": 250
    }
  },

/* v7 — UUID helper for stable character identity across re-shares.
   Prefer crypto.randomUUID where available (Safari 15.4+ / all modern browsers).
   Fallback: timestamp + random. Good enough for share-link keying — not crypto. */
function makeCharacterId() {
  try {
    if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
      return crypto.randomUUID();
    }
  } catch(e) { /* fall through */ }
  return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
}
